generated: '2026-07-19'
method: searched
source: https://docs.imprint.co/android, https://docs.imprint.co/ios, https://docs.imprint.co/web
notes: >-
  Imprint ships client-side "application experience" SDKs that embed the co-branded
  card/loan application flow into a partner app or site. There are no public
  server-side API client libraries on npm/PyPI/Maven Central; the server API is
  called directly over HTTPS with HTTP Basic/Bearer auth.
packages:
  - language: kotlin
    platform: android
    registry: maven
    name: co.imprint.sdk:imprint-sdk
    version: 0.5.0
    install: "implementation 'co.imprint.sdk:imprint-sdk:0.5.0'"
    url: https://docs.imprint.co/android
    official: true
    kind: mobile-sdk
  - language: swift
    platform: ios
    registry: swift-package-manager
    name: imprint-sdk-ios
    install: 'https://github.com/Imprint-Tech/imprint-sdk-ios (from: "1.0.0")'
    url: https://github.com/Imprint-Tech/imprint-sdk-ios
    official: true
    kind: mobile-sdk
  - language: javascript
    platform: web
    registry: hosted-script
    name: imprintsdk.js
    install: '<script src="https://apply.imprint.co/imprintsdk.js"></script>'
    url: https://docs.imprint.co/web
    official: true
    kind: web-sdk
    notes: Must be loaded directly from the Imprint origin; cannot be bundled or self-hosted.
