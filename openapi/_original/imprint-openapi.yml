components:
  parameters:
    applicationMerchantKeyParam:
      name: x-imprint-merchant-key
      in: header
      required: true
      description: |
        Identifies the product/program for this application operation. The API
        key must be authorized for the named program. Send this header on every
        request; a key already bound to one product does not make it optional.
      schema:
        type: string

    localeParam:
      name: locale
      in: query
      required: false
      description: |
        Locale for translated category copy. English (`en`) is used when omitted
        or unsupported; Spanish (`es`) and regional variants such as `es-MX` are
        also supported.
      schema:
        type: string
        default: en
      example: en

    customerIdParam:
      name: customer_id
      in: path
      required: true
      description: The unique identifier for the Imprint customer
      schema:
        type: string
        example: "2EE24580-B97B-4949-A65C-929CCB9B9B8D"
    accountIdParam:
      name: account_id
      in: path
      required: true
      description: The unique identifier for the account, as returned by list accounts
      schema:
        type: string
        example: "7C1F9A34-2D6B-4E58-8A03-B15E7D9C4620"
    paymentMethodIdParam:
      name: payment_method_id
      in: path
      required: true
      description: The unique identifier of the payment method
      schema:
        type: string
        example: "9ED4FE47-8E9C-48E9-BBEF-094DF1789012"
    emailParam:
      name: email
      in: query
      schema:
        type: string
        format: email
        example: "john@doe.com"
    applicationIdParam:
      name: application_id
      in: path
      required: true
      description: The unique identifier for the application
      schema:
        type: string
        format: uuid
        example: "7f3c1e20-4b8a-4e11-9c6d-2a5f0b7d3e91"
    nonblankIdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        An optional client-generated key that makes this request safe to retry.
        Replaying a key returns the original result instead of performing the
        action twice. When supplied it must be nonblank. Keys are scoped to your
        program and retained for 24 hours.
      schema:
        type: string
        minLength: 1
        pattern: '\S'
        example: "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
    idempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A client-generated key that makes this request safe to retry. Replaying a
        key returns the original result instead of performing the action twice.
        Keys are scoped to your program and retained for 24 hours.
      schema:
        type: string
        example: "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
    limitParam:
      name: limit
      in: query
      description: Limits the number of returned results
      schema:
        type: integer
        minimum: 1
        default: 10
        format: int32
    transactionExpandParam:
      name: expand
      in: query
      required: false
      style: form
      explode: false
      description: |
        Related data to include on each transaction, as a comma-separated list. Supported values:
        `events` — the transaction's lifecycle events (authorization, captures, refunds, confirmed disputes),
        each with the same `event_id` delivered in the Transaction Event Notification;
        `events.reward` — the events, each with the `reward` it earned or deducted (implies `events`).
        Omit to receive the transaction without events. Unknown values return 400. See
        [Retrieve a transaction's events](https://docs.imprint.co/guide-event-notifications#retrieve-a-transactions-events).
      schema:
        type: array
        items:
          $ref: "#/components/schemas/TransactionExpand"
      example: ["events"]
    startingAfterParam:
      name: starting_after
      in: query
      description: A cursor for use in pagination. An id that defines your place in the list.
      schema:
        type: string
    minAmountParam:
      name: min_amount
      in: query
      description: Filters results based on minimum amount
      schema:
        type: integer
        minimum: 0
        default: 0
        format: int32
    maxAmountParam:
      name: max_amount
      in: query
      description: Filters results based on maximum amount
      schema:
        type: integer
        format: int32

  schemas:
    CustomerListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        has_more:
          type: boolean
        total:
          type: integer
    CustomerProgramStatus:
      type: string
      description: Status of a customer within a card program.
      enum: [ OPEN, CLOSED ]
    PartnerCustomerId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[\x20-\x7E]+$'
      description: |
        The unique identifier for the customer in the partner's system.

        Compared byte-for-byte, so `PARTNER_USER_456` and `partner_user_456` are
        two different customers. Send the same casing everywhere or a later
        lookup silently returns no match.

        Restricted to printable ASCII (`\x20`–`\x7E`) rather than arbitrary
        UTF-8: the value is propagated between internal services as an HTTP/2
        header, which cannot carry non-ASCII bytes. The bound is published
        rather than discovered.
      example: "PARTNER_USER_456"
    Merchant:
      type: object
      properties:
        network_id:
          type: string
          description: Unique identifier of the merchant assigned by the payment network.
          example: "234923454545"
        name:
          type: string
          description: Name of the merchant where the transaction occurred.
          example: "Target"
        category:
          type: string
          nullable: true
          description: Name of the merchant category.
          example: "Grocery Stores"
        category_code:
          type: string
          nullable: true
          description: Code associated with the merchant category.
          example: "5411"
        address:
          $ref: "#/components/schemas/Address"
          type: object
    PurchaseMethod:
      type: string
      enum:
        - CHIP
        - CONTACTLESS
        - KEYEDIN
        - ONLINE
        - SWIPE
        - QRCODE
        - OCR
        - UNKNOWN
      nullable: true
      description: How the purchase was completed.
      example: "CHIP"
    TransactionStatus:
      type: string
      enum:
        - APPROVED
        - UPDATED
        - VOIDED
        - CAPTURED
        - REFUNDED
      example: "APPROVED"
#      oneOf:
#        - const: APPROVED
#          description: "Authorization request was received from the merchant and approved by Imprint. This creates a pending transaction on the customer’s statement."
#        - const: UPDATED
#          description: "Authorization request was updated by the merchant. The pending transaction was updated."
#        - const: VOIDED
#          description: "Approved authorization has been cancelled by the merchant or expired by Imprint, resulting in the pending transaction being removed from the customer’s statement."
#        - const: CAPTURED
#          description: "Approved authorization has been captured, or a force capture has been created (bypassing the authorization step). This creates a confirmed purchase transaction on the customer’s statement."
#        - const: REFUNDED
#          description: "Refund has been created by the merchant, either related to a previous capture or standalone (e.g. blind return). This results in a confirmed refund transaction on the customer’s statement."

    SimulatedTransactionStatus:
      type: string
      enum:
        - APPROVED
        - DECLINED
        - UPDATED
        - VOIDED
        - CAPTURED
        - REFUNDED
    Address:
      type: object
      description: Mailing address information
      properties:
        street_line1:
          type: string
          description: Primary street address
          example: "123 Main St"
        street_line2:
          type: string
          description: Secondary street address (apartment, suite, etc.)
          example: "Apt 4B"
        city:
          type: string
          description: City name
          example: "San Francisco"
        state:
          type: string
          description: State or province
          example: "CA"
        postal_code:
          type: string
          examples:
            - "94105"
            - "94105-1234"
        country:
          type: string
          description: ISO-3166-1 alpha-3 Country Code
          example: "USA"
    CurrencyAmount:
      type: integer
      description: Amount in the smallest currency unit (e.g., cents for USD)
    DateOfBirth:
      type: object
      description: Customer's date of birth
      properties:
        year:
          type: integer
          description: Year of birth
          minimum: 1900
          example: 1990
        month:
          type: integer
          description: Month of birth
          minimum: 1
          maximum: 12
          example: 1
        day:
          type: integer
          description: Day of birth
          minimum: 1
          maximum: 31
          example: 1
    Customer:
      type: object
      description: Represents a customer in the Imprint system
      required:
        - id
      properties:
        id:
          type: string
          description: Unique identifier for the customer
          example: "9B5E1EE0-2E1C-46E7-81B9-3C3917204BE4"
        email:
          type: string
          format: email
          description: Customer's email address
          example: "customer@example.com"
        phone:
          type: string
          description: Customer's phone number in E.164 format
          example: "+14155552671"
        statuses:
          type: object
          description: Map of the customer's enrolled card program name to the customer's status.
          additionalProperties:
            $ref: '#/components/schemas/CustomerProgramStatus'
          example:
            "Card Program Name": "OPEN"
        first_name:
          type: string
          description: The customer's first name.
          example: "John"
        last_name:
          type: string
          description: The customer's last name.
          example: "Doe"
        preferred_language:
          type: string
          description: Customer's preferred language code as defined by ISO 639-1
          example: "en"
        ssn4:
          type: string
          description: Customer's Social Security Number in 4 digits
          example: "1234"
        date_of_birth:
          $ref: "#/components/schemas/DateOfBirth"
        address:
          $ref: "#/components/schemas/Address"
        partner_customer_id:
          $ref: "#/components/schemas/PartnerCustomerId"
        metadata:
          type: object
          description: Set of key-value pairs for storing additional information about the customer.
          additionalProperties: true
          example:
            preferred_language: "en"
        created_at:
          type: string
          description: the RFC-3339 date when the customer was created
          example: 2025-02-13T19:08:07Z
        updated_at:
          type: string
          description: the RFC-3339 date when the customer was created
          example: 2025-02-13T19:08:07Z
        authorized_users:
          type: array
          description: >-
            The authorized users on this customer's account for the requesting partner's card program.
            Authorized users share the primary cardholder's customer record, so they are returned here
            rather than as separate customers. Requires the `AUTHORIZED_USER_READ` scope; omitted entirely
            when the API key does not hold it.


            Only returned by Retrieve Customer. The Search Customers endpoints share this schema but
            never populate this field.


            The array is historical, not current: every authorized user ever added to the account is
            included, and those no longer on it carry `status: inactive`. Filter on `status` to get only
            the authorized users who can currently transact.
          items:
            $ref: "#/components/schemas/AuthorizedUser"

    AuthorizedUser:
      type: object
      description: An authorized user on a primary cardholder's account.
      properties:
        authorized_user_id:
          type: string
          description: >-
            Unique identifier for the authorized user. Stable for the lifetime of the authorized user
            record, and the identifier to store when reconciling with the Payment Method webhook. Note
            that removing and re-adding the same person creates a new authorized user record with a new
            identifier.
          example: "A1B2C3D4-5566-7788-99AA-BBCCDDEEFF00"
        first_name:
          type: string
          description: The authorized user's first name.
          example: "Jane"
        last_name:
          type: string
          description: The authorized user's last name.
          example: "Doe"
        email:
          type: string
          description: >-
            The authorized user's email address, as supplied by the primary cardholder when the
            authorized user was added. This value is not independently verified by Imprint.
          example: "jane.doe@email.com"
        phone:
          type: string
          description: >-
            The authorized user's phone number in E.164 format, as supplied by the primary cardholder
            when the authorized user was added. This value is not independently verified by Imprint.
          example: "+15551234567"
        date_of_birth:
          $ref: "#/components/schemas/DateOfBirth"
        postal_code:
          type: string
          description: The postal code of the authorized user's address.
          example: "60601"
        payment_method_id:
          type: string
          description: >-
            Identifier of the authorized user's current card. Omitted when no card is currently issued
            to them. This value changes when a card is reissued or replaced, so it should not be used
            as a durable key for the authorized user — use `authorized_user_id` instead.
          example: "DCBFC736-2286-42DD-897D-160DCA80AED3"
        status:
          type: string
          description: >-
            The authorized user's status on this account. `pending` means the authorized user has been
            added but is not yet activated. `inactive` means they are no longer active on this account.
          enum:
            - active
            - pending
            - inactive
          example: "active"

    CustomerAccountHistory:
      type: object
      description: "A Customer's account history with the partner"
      properties:
        email:
          type: string
          format: email
          description: "Customer's email address"
          example: "customer@example.com"
        phone:
          type: string
          description: "Customer's phone number in E.164 format"
          example: "+14155552671"
        first_name:
          type: string
          description: "The customer's first name"
          example: "John"
        last_name:
          type: string
          description: "The customer's last name"
          example: "Doe"
        preferred_language:
          type: string
          description: "Customer's preferred language code as defined by ISO 639-1"
          example: "en"
        address:
          $ref: "#/components/schemas/Address"
        account_tenure:
          type: integer
          description: "The customer's account tenure with the partner, in months"
          example: 13
        ltv_amount:
          type: integer
          description: "The Life Time Value for the customer's account, in the min currency unit (cents for USD)"
          example: 34000
        ltv_currency:
          type: string
          description: "The 3 char currency code of the amount in iso-4217"
          example: "USD"
        loyalty_tier:
          type: string
          description: "The customer's current loyalty tier"
          example: "GOLD"
        account_created_at:
          type: string
          description: "The RFC-3339 timestamp when the customer's account was created with the partner"
          example: 2025-02-13T19:08:07Z
        transaction_count:
          type: integer
          description: "The number of lifetime transactions the customer has made with the partner"
          example: 100

    ApplicationOrigin:
      type: string
      description: >-
        Where the application originated. Free-form, so campaign and channel origins can be
        introduced without an API change. In-store applications use one of `in_store_associate`,
        `in_store_kiosk`, or `in_store_signage`; a server-verified in-store application overrides
        whatever value you supply.
      example: "in_store_kiosk"

    CustomerSession:
      type: object
      description: Represents a session created on behalf of an Imprint customer
      required:
        - id
        - client_secret
        - expires_at
      properties:
        id:
          type: string
          example: "2EE24580-B97B-4949-A65C-929CCB9B9B8D"
          description: The unique ID Imprint assigns to the session.
        client_secret:
          type: string
          example: "QzMyNzg4QzgtNEUwOS00QkU4LThDMjEtMkU5OUQ3QzkwRDhGCg=="
          description: Not to be logged or stored. Provide this one time use token to the Imprint SDK or other client side code to allow the customer access to edit their own account or apply
        expires_at:
          type: string
          description: the RFC-3339 timestamp when the `client_secret` will expire.
          example: 2025-02-13T19:08:07Z
        metadata:
          type: object
          description: Set of key-value pairs for storing additional information about the customer session.
          additionalProperties: true
          example:
            store_number: "123"
        customer_metadata:
          type: object
          description: A set of key-value pairs attached to the customer. These values will be included in webhook event payloads for the partner to receive information about the customer.
          additionalProperties:
            type: string
          example:
            loyalty_id: "840012345678"
            membership_tier: "gold"
        source:
          type: string
          description: The marketing source that referred the customer.
          example: "web_signup"
        utm_medium:
          type: string
          description: The marketing medium that referred the customer.
          example: "cpc"
        utm_channel:
          type: string
          description: The marketing channel that referred the customer.
          example: "paid_social"
        utm_campaign:
          type: string
          description: The marketing campaign that referred the customer.
          example: "spring_card_launch"
        utm_content:
          type: string
          description: The specific creative or placement that referred the customer.
          example: "hero_banner_v2"
        utm_term:
          type: string
          description: The paid search keyword that referred the customer.
          example: "rewards+credit+card"
        utm_owner:
          type: string
          description: The team or owner accountable for the campaign that produced this session.
          example: "growth"
        application_origin:
          $ref: "#/components/schemas/ApplicationOrigin"
        origin_location_id:
          type: string
          description: Your own store or location code identifying where the application originated.
          example: "STORE-4417"
        partner_customer_id:
          $ref: "#/components/schemas/PartnerCustomerId"
        transaction_amount:
          type: integer
          format: int64
          description: The current transaction amount, in the min currency unit (cents for USD)
          example: 34000
        transaction_currency:
          type: string
          description: The 3 char currency code of the amount in iso-4217
          example: "USD"
        customer_history:
          $ref: "#/components/schemas/CustomerAccountHistory"

    CustomerLink:
      type: object
      required:
        - customer_id
        - partner_customer_id
        - status
        - created_at
      properties:
        customer_id:
          type: string
          example: "9B5E1EE0-2E1C-46E7-81B9-3C3917204BE4"
          description: The ID of the Imprint customer

        partner_customer_id:
          $ref: "#/components/schemas/PartnerCustomerId"
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          example: "ACTIVE"
          description: Status of the linked relationship
        created_at:
          type: string
          description: the RFC-3339 timestamp when the link was created at.
          example: 2025-02-13T19:08:07Z
        updated_at:
          type: string
          description: the RFC-3339 timestamp when the link was last updated.
          example: 2025-02-13T19:08:07Z
        metadata:
          type: object
          description: Additional linking metadata
          additionalProperties: true
          example:
            store_id: "store_789"
            platform_version: "2.1.0"

    PaymentMethodCardDetails:
      type: object
      description: Card-specific data for a `CARD` payment method. Shared by the `card` and `secured_credit_card` properties on `PaymentMethod`; exactly one of those is present.
      required:
        - last4
        - brand
      properties:
        last4:
          type: string
          example: "1234"
          minLength: 4
          maxLength: 4
          description: The last 4 digits of the card PAN
        network:
          type: string
          description: Name of the card issuer
          enum:
            - VISA
            - MASTERCARD
            - AMEX
            - ""
        card_type:
          $ref: '#/components/schemas/CardType'
        card_design_id:
          $ref: '#/components/schemas/CardDesignID'
        exp_month:
          type: string
          description: The month the card expires (MM format).
          example: "06"
        exp_year:
          type: string
          description: The year the card expires (YYYY format).
          example: "2027"
        pci_details:
          type: object
          description: The pci details of the returned card. Only verified PCI compliant partners will be able to retrieve pci details in production environments.
          properties:
            pan:
              type: string
              description: The unique 16-digit number printed on the front of a payment card, used to identify the member's account.
              example: "5105105105105100"
            exp_month:
              type: string
              description: The month the card expires
              example: "06"
            exp_year:
              type: string
              description: The year the card expires
              example: "26"
            cvv:
              type: string
              description: A three- or four-digit security code used to verify card-not-present transactions and prevent fraud.
              example: "123"
        tokens:
          type: array
          description: Payment method tokens that are defined by a third-party provider are included in this array by Imprint.
          items:
            $ref: "#/components/schemas/PaymentMethodToken"
    PaymentMethod:
      type: object
      required:
        - id
        - type
        - customer_id
        - created_at
        - status
        - metadata
      properties:
        id:
          type: string
          example: "DCBFC736-2286-42DD-897D-160DCA80AED2"
          description: The unique ID Imprint assigns to the payment method.
        type:
          type: string
          description: The type of payment method
          enum:
            - CARD
            - BANK_ACCOUNT
            - LOAN
        customer_id:
          type: string
          description: The `id` of the Imprint customer that the payment method belongs to.
          example: "B40A789E-BD46-4BB9-B63E-F9919582694C"
        card:
          allOf:
            - $ref: '#/components/schemas/PaymentMethodCardDetails'
          description: When the payment method is a non-secured `CARD` type, this object holds its card-specific data. Exactly one of `card` or `secured_credit_card` is present.
        secured_credit_card:
          allOf:
            - $ref: '#/components/schemas/PaymentMethodCardDetails'
          description: Card-specific data for a secured-credit-card product, emitted in place of `card` when the payment method's product is a secured credit card. Exactly one of `card` or `secured_credit_card` is present.
        bank_account:
          type: object
          description: When payment method is a `BANK_ACCOUNT` type, this object will have bank account specific data.
          required:
            - last4
            - routing_number
            - bank_name
          properties:
            last4:
              type: string
              example: "1234"
              description: Last 4 numbers of the account.
              minLength: 4
              maxLength: 4
            routing_number:
              type: string
              description: The bank routing number assigned to this account.
            bank_name:
              type: string
              example: "Wells Fargo"
              description: Name of the banking institution
            account_type:
              type: string
              description: Type of the account.
              enum:
                - CHECKING
                - SAVINGS
        loan:
          type: object
          description: When payment method is a `LOAN` type, this object will have loan specific data.
          required:
            - amount
            - term_months
          properties:
            amount:
              type: integer
              description: Amount in min units.
              example: 10000
            currency:
              $ref: "#/components/schemas/TransactionCurrency"
            remaining_balance:
              type: integer
              description: remaining unspent balance on the loan
            term_months:
              type: integer
              description: Length of the loan term in months
              example: 12
            apr:
              type: string
              description: Annual percentage rate of the loan in floating point
              example: "5.89"
            loan_status:
              type: string
              description: Current status of the loan
              enum:
                - PENDING
                - APPROVED
                - REJECTED
                - ACTIVE
                - CLOSED
        created_at:
          type: string
          description: the RFC-3339 timestamp when the payment method was created
          example: 2025-02-13T19:08:07Z
        updated_at:
          type: string
          description: the RFC-3339 timestamp when the payment method was last updated
          example: 2025-02-13T19:08:07Z
        status:
          type: string
          description: Current status of the payment method
          enum:
            - ACTIVE
            - INACTIVE
            - CANCELED
        metadata:
          type: object
          additionalProperties: true
          description: Additional metadata for the payment method
          example:
            platform_version: "2.1.0"
    PaymentMethodToken:
      type: object
      required:
        - type
        - token
        - created_at
        - updated_at
      properties:
        type:
          type: string
          enum:
            - ADYEN
            - APPLE_WALLET
            - CYBERSOURCE
            - WORLDPAY
        token:
          type: string
          description: The token, as defined by the processor
        pan_reference_id:
          type: string
          description: An ID that represents the PAN and is defined by the processor
        expires_at:
          type: string
          description: >-
            Only present for tokens that expire. If this field is absent, the token has no
            expiration and no action is needed. When present, this is the RFC-3339 timestamp
            after which the token can no longer be used. A timestamp in the past means the
            token is stale and should not be used. Retrieving the payment method refreshes
            expired tokens where possible; if a newly retrieved token's `expires_at` is still
            in the past, it cannot be used.
          example: 2025-02-14T19:08:07.000Z
        created_at:
          type: string
          description: the RFC-3339 timestamp when the payment method was created
          example: 2025-02-13T19:08:07.000Z
        updated_at:
          type: string
          example: 2025-02-13T19:08:07.000Z
          description: the RFC-3339 timestamp when the payment method was updated
    TransactionIntent:
      type: object
      required:
        - id
        - customer_id
        - amount
        - currency
        - status
        - created_at
      properties:
        id:
          type: string
          example: "5B30532B-5B5B-4826-8DE2-429C57B705FD"
        customer_id:
          type: string
          example: "9B5E1EE0-2E1C-46E7-81B9-3C3917204BE4"
        payment_method_id:
          type: string
          description: The `payment_method_id` that this `transaction_intent` was executed with.
          example: "DCBFC736-2286-42DD-897D-160DCA80AED2"
        amount:
          type: integer
          description: Currency amount
          example: 10000
        currency:
          $ref: "#/components/schemas/TransactionCurrency"
        status:
          $ref: "#/components/schemas/TransactionIntentStatus"
        network_transaction_id:
          type: string
          description: "The network's unique identifier for the transaction. Examples include Visa Transaction ID, Mastercard Trace ID, and American Express Network Reference ID"
        partner_transaction_id:
          type: string
          description: "The partner's unique transaction id"
        created_at:
          type: string
          description: the RFC-3339 timestamp when the transaction intent was created
          example: 2025-02-13T19:08:07Z
        updated_at:
          type: string
          description: the RFC-3339 timestamp when the transaction intent was last updated
          example: 2025-02-13T19:08:07Z
        metadata:
          type: object
          description: Additional transaction intent data
          additionalProperties: true
          example:
            platform_version: "2.1.0"

    Transaction:
      type: object
      required:
        - id
        - customer_id
        - payment_method_id
        - amount
        - currency
        - status
        - network_transaction_id
        - created_at
      properties:
        id:
          type: string
          example: "E777214A-2D11-4CAD-9E8F-E1BD71D9FE67"
        intent_id:
          type: string
          description: Reference to the original transaction intent
          example: "5B30532B-5B5B-4826-8DE2-429C57B705FD"
        customer_id:
          type: string
          description: The imprint customer ID for the transaction
          example: "9B5E1EE0-2E1C-46E7-81B9-3C3917204BE4"
        authorization_code:
          type: string
          description: Code authorizing the transaction.
          example: "ABCD"
        payment_method_id:
          type: string
          description: Identifies the payment method used for the transaction
          example: "DCBFC736-2286-42DD-897D-160DCA80AED2"
        purchase_method:
          $ref: "#/components/schemas/PurchaseMethod"
        amount:
          type: integer
          description: Transaction amount in min units.
        currency:
          $ref: "#/components/schemas/TransactionCurrency"
        status:
          $ref: "#/components/schemas/TransactionStatus"
        network_transaction_id:
          type: string
          description: "The network's unique identifier for the transaction. Examples include Visa Transaction ID, Mastercard Trace ID, and American Express Network Reference ID"
        partner_transaction_id:
          type: string
          description: "The partner's unique transaction id"
        created_at:
          type: string
          description: the RFC-3339 timestamp when the transaction was created
          example: 2025-02-13T19:08:07Z
        updated_at:
          type: string
          description: the RFC-3339 timestamp when the transaction was last updated
          example: 2025-02-13T19:08:07Z
        merchant:
          $ref: "#/components/schemas/Merchant"
        metadata:
          type: object
          additionalProperties: true
          example:
            platform_version: "2.1.0"
        events:
          type: array
          description: >-
            Events in the transaction's lifecycle, oldest first. Present only when requested with
            `expand=events`.
          items:
            $ref: "#/components/schemas/TransactionLifecycleEvent"

    TransactionExpand:
      type: string
      description: >-
        Related data that can be included on a transaction with the `expand` query parameter.
        `events` adds the transaction's lifecycle events; `events.reward` adds the events and, on each
        event, the reward it earned or deducted.
      enum:
        - events
        - events.reward
      example: "events"

    TransactionLifecycleEvent:
      type: object
      description: One step in a transaction's lifecycle, e.g. the authorization, a capture, a refund or a confirmed dispute.
      required:
        - event_id
        - status
        - amount
        - created_at
      properties:
        event_id:
          type: string
          description: >-
            Unique identifier of this event. Matches the `event_id` in the Transaction Event Notification and
            the `transaction_event_id` on a Reward.
