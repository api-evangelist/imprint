              example: 5000
            status:
              $ref: "#/components/schemas/RewardStatus"
            currency:
              $ref: "#/components/schemas/RewardCurrency"
            created_at:
              type: string
              description: the RFC-3339 timestamp when the reward was created
              example: 2025-02-13T19:08:07.000Z
            metadata:
              type: object
              description: >
                Additional metadata about the reward. For `OFFER` type rewards,
                this includes `offer_id`, identifying the specific offer that
                generated the reward. Not present for other reward types.
              additionalProperties: true
              properties:
                offer_id:
                  type: string
                  description: >
                    Identifier for the offer that generated this reward, present
                    on `OFFER` type rewards. Use this to map the reward back to
                    the specific offer in your systems.
                  example: "2bd247a1-d935-4b26-88c3-7b3a55ac910b"
              example:
                offer_id: "2bd247a1-d935-4b26-88c3-7b3a55ac910b"
            customer_metadata:
              type: object
              description: A set of key-value pairs of metadata attached to the customer.
              additionalProperties:
                type: string
              example:
                loyalty_id: "840012345678"
                membership_tier: "gold"

    StreakWebhookPayload:
      type: object
      properties:
        object:
          type: string
          description: The type of object this webhook event relates to.
          enum:
            - STREAK
          example: "STREAK"
        data:
          type: object
          properties:
            merchant_key:
              type: string
              description: Unique identifier for the merchant associated with this webhook event.
              example: "MERCHANT_ABC"
            customer_id:
              type: string
              description: Imprint's unique identifier for the associated customer.
              example: "2EE24580-B97B-4949-A65C-929CCB9B9B8D"
            partner_customer_id:
              $ref: "#/components/schemas/PartnerCustomerId"
            streak_id:
              type: string
              description: Unique identifier for the customer's streak instance.
              example: "11111111-2222-3333-4444-555555555555"
            streak_config_id:
              type: string
              description: Unique identifier for the streak configuration this instance was created from.
              example: "66666666-7777-8888-9999-000000000000"
            event:
              $ref: "#/components/schemas/StreakEvent"
            status:
              $ref: "#/components/schemas/StreakStatus"
            period_type:
              type: string
              description: The cadence used to evaluate streak progress.
              example: "STATEMENT"
            current_period:
              type: integer
              description: The 1-based index of the period the streak is currently on.
              example: 12
            completed_periods:
              type: integer
              description: The number of periods the customer has successfully completed.
              example: 12
            total_periods:
              type: integer
              description: The total number of periods required to complete the streak.
              example: 12
            current_period_start_at:
              type: string
              description: RFC-3339 timestamp (millisecond precision) when the current period opened. Omitted on the STREAK_FAILED event.
              example: "2026-05-01T12:00:00.000Z"
            current_period_end_at:
              type: string
              description: RFC-3339 timestamp (millisecond precision) when the current period closes. Omitted on the STREAK_FAILED event.
              example: "2026-05-31T12:00:00.000Z"
            benefits:
              type: array
              description: Partner-facing benefit identifiers to fulfill for the streak. Always present; populated only on the STREAK_COMPLETED event and empty on all other events.
              items:
                type: string
              example: ["BENEFIT_1"]
            created_at:
              type: string
              description: RFC-3339 timestamp (millisecond precision) when the triggering event occurred. Present on every event.
              example: "2026-05-01T12:00:01.000Z"
            metadata:
              type: object
              additionalProperties: true
            customer_metadata:
              type: object
              description: A set of key-value pairs of metadata attached to the customer.
              additionalProperties:
                type: string
              example:
                loyalty_id: "840012345678"
                membership_tier: "gold"

    StreakEvent:
      type: string
      description: The streak lifecycle event being signalled.
      enum:
        - ENROLLED
        - PERIOD_COMPLETED
        - STREAK_COMPLETED
        - STREAK_FAILED
      example: "STREAK_COMPLETED"

    StreakStatus:
      type: string
      description: The status of the streak, derived from the event. ENROLLED and PERIOD_COMPLETED carry IN_PROGRESS; STREAK_COMPLETED carries COMPLETED; STREAK_FAILED carries FAILED.
      enum:
        - IN_PROGRESS
        - COMPLETED
        - FAILED
      example: "COMPLETED"

    AccountStatusWebhookPayload:
      type: object
      properties:
        object:
          type: string
          description: The type of object this webhook event relates to.
          enum:
            - ACCOUNT_STATUS
          example: "ACCOUNT_STATUS"
        data:
          type: object
          properties:
            merchant_key:
              type: string
              description: Unique identifier for the merchant associated with this webhook event.
              example: "MERCHANT_ABC"
            customer_id:
              type: string
              description: Imprint's unique identifier for the associated customer.
              example: "2EE24580-B97B-4949-A65C-929CCB9B9B8D"
            partner_customer_id:
              $ref: "#/components/schemas/PartnerCustomerId"
            status:
              $ref: "#/components/schemas/AccountStatusValue"
            updated_at:
              type: string
              description: RFC-3339 timestamp when the account status transition took effect. May be backdated when the transition has an effective date earlier than delivery (e.g. a debt sale).
              example: "2026-05-01T12:00:00.000Z"
            customer_metadata:
              type: object
              description: A set of key-value pairs of metadata attached to the customer.
              additionalProperties:
                type: string
              example:
                loyalty_id: "840012345678"
                membership_tier: "gold"

    AccountSummary:
      type: object
      description: |
        One account a customer holds with your program, identifying it and the
        type of product it is. Read the full servicing snapshot with
        `GET /v2/customers/{customer_id}/accounts/{account_id}`.
      required:
        - account_id
      properties:
        account_id:
          type: string
          description: The unique identifier for the account
          example: "7C1F9A34-2D6B-4E58-8A03-B15E7D9C4620"
        account_type:
          $ref: "#/components/schemas/AccountType"

    AccountType:
      type: string
      description: |
        The type of product the account is. Absent when the product's type could
        not be determined.
      enum:
        - CREDITCARD
        - SECUREDCREDITCARD
        - INSTALLMENT_LOAN
        - SPENDCARD
      example: "CREDITCARD"

    RewardCategoriesResponse:
      type: object
      required:
        - currency
        - categories
        - special_categories
      properties:
        currency:
          type: string
          description: The reward currency configured for the account's program
          example: "FanCash"
        categories:
          type: array
          description: Standard transaction earning categories in display order
          items:
            $ref: "#/components/schemas/RewardCategory"
        special_categories:
          type: array
          description: Active non-transaction categories, such as a signup bonus
          items:
            $ref: "#/components/schemas/SpecialRewardCategory"

    RewardCategory:
      type: object
      required:
        - name
        - description
        - earn_rate
        - type
        - merchants
      properties:
        name:
          type: string
          example: "On-Merchant"
        description:
          type: string
          example: "Purchases at Fanatics stores"
        earn_rate:
          type: string
          description: |
            Reward units earned per one transaction-currency unit, as a decimal
            string in the currency named by the response's `currency` field. The
            number of decimal places is the precision the rate is configured
            with, so `"10.00"` and `"10"` are the same rate configured at
            different precisions.
          pattern: '^-?\d+(\.\d+)?$'
          example: "10.00"
        type:
          $ref: "#/components/schemas/RewardCategoryType"
        merchants:
          type: array
          items:
            type: string
          example: ["Fanatics", "NFL Shop", "NBA Store"]

    RewardCategoryType:
      type: string
      enum:
        - ON_MERCHANT
        - OFF_MERCHANT

    SpecialRewardCategory:
      type: object
      required:
        - name
        - description
        - amount
        - type
      properties:
        name:
          type: string
          example: "Signup Bonus"
        description:
          type: string
          example: "One-time bonus after first purchase"
        amount:
          type: string
          description: Display-formatted reward amount (e.g. "$200", "10,000 points").
          example: "$200"
        type:
          type: string
          enum:
            - SIGNUP

    Account:
      type: object
      description: |
        A customer's card account as of now. Amounts are integers in the
        smallest currency unit and are always positive: they say what the
        customer owes, so a paid-off or in-credit account reads as `0`.

        Per-statement figures live in the statements API, not here.
      required:
        - customer_id
        - account_id
        - status
        - as_of
      properties:
        customer_id:
          type: string
          description: The unique identifier for the customer
          example: "2EE24580-B97B-4949-A65C-929CCB9B9B8D"
        account_id:
          type: string
          description: The unique identifier for the account
          example: "7C1F9A34-2D6B-4E58-8A03-B15E7D9C4620"
        status:
          $ref: "#/components/schemas/AccountStatus"
        currency:
          $ref: "#/components/schemas/TransactionCurrency"
        credit_limit:
          $ref: "#/components/schemas/CurrencyAmount"
        available_credit:
          $ref: "#/components/schemas/CurrencyAmount"
        current_balance:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
          description: |
            Everything posted to the account, including activity since the last
            statement closed.
        overdue_amount:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
          description: |
            The amount past due — a minimum payment that was not made by its due
            date and is still outstanding. Unlike the minimum due, this moves
            during the cycle: a payment brings it down. `0` on an account that is
            current.
        statement_due_date:
          type: string
          description: |
            RFC-3339 timestamp when payment for the most recently closed
            statement is due. Absent on an account still in its first billing
            cycle, which has no closed statement yet.
          example: "2026-06-15T00:00:00Z"
        apr_percentage:
          type: number
          description: The purchase APR as a percentage
          example: 24.99
        as_of:
          type: string
          description: |
            RFC-3339 timestamp of when this snapshot was calculated, which is
            when the request was served. Balances move continuously — a purchase
            or a payment lands between one read and the next — so this is the
            instant the figures above were true. Use it to label or expire a
            cached copy, and to order two reads of the same account.
          example: "2026-08-27T14:22:31Z"

    AccountStatus:
      type: string
      description: |
        The lifecycle state of a customer's card account.

        Two states mean "approved but not usable yet", and they are distinct:

        - `PENDING_FUNDING` is a secured account whose security deposit has not
          been funded. The deposit is either still owed or a submitted payment
          is settling, so no card has been issued and the account cannot be
          spent on. It has no credit limit, balance or APR yet.
        - `INACTIVE` is an approved account whose card has not been activated
          yet — for a secured account, one whose deposit has already settled.

        `PENDING_FUNDING` only ever appears on a secured-credit-card product.
      enum:
        - OPEN
        - INACTIVE
        - PENDING_FUNDING
        - CLOSED
        - REVOKED
        - CHARGE_OFF
        - SOLD
      example: "OPEN"

    Statement:
      type: object
      description: |
        One closed billing cycle. Amounts are integers in the smallest currency
        unit and are signed the way a card statement reads: charges to the
        customer are positive, money credited back to them is negative.

        Every amount is optional. Ledger records only the lines that had activity
        in the cycle, so a quiet month omits most of them rather than reporting
        them as `0`.
      required:
        - statement_id
        - customer_id
        - account_id
        - as_of
      properties:
        statement_id:
          type: string
          description: The unique identifier for the statement
          example: "8A31B2C0-4F6D-4A21-9E3B-5C1D0F7A2B84"
        customer_id:
          type: string
          description: The unique identifier for the customer
          example: "2EE24580-B97B-4949-A65C-929CCB9B9B8D"
        account_id:
          type: string
          description: The unique identifier for the account the statement belongs to
          example: "7C1F9A34-2D6B-4E58-8A03-B15E7D9C4620"
        period_start_date:
          type: string
          description: RFC-3339 timestamp of the first day of the billing cycle
          example: "2026-05-16T00:00:00Z"
        period_end_date:
          type: string
          description: |
            RFC-3339 timestamp when the billing cycle closed. This is the
            statement date.
          example: "2026-06-15T00:00:00Z"
        due_date:
          type: string
          description: RFC-3339 timestamp when payment for this statement is due
          example: "2026-07-10T00:00:00Z"
        pdf_url:
          type: string
          description: |
            A pre-signed link to the statement PDF — the same document the
            cardholder sees. The link expires one hour after this response is
            issued, so treat it as a redirect target or an immediate download
            rather than something to persist: a stored copy will stop working,
            and re-reading the statement is how you get a fresh one.

            Omitted when the document is not available. A statement's PDF is
            rendered shortly after its cycle closes, so the newest statement can
            appear here before its document does; the rest of the statement is
            still accurate.
          example: "https://imprint-statements.s3.us-east-1.amazonaws.com/statements/8A31B2C0.pdf?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Expires=3600"
        currency:
          $ref: "#/components/schemas/TransactionCurrency"
        statement_balance:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
          description: |
            The balance owed when the cycle closed. Negative if the customer had
            paid ahead.
        minimum_due:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
          description: |
            The minimum payment required by `due_date` to keep the account
            current.
        previous_balance:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
          description: The balance carried over from the previous cycle.
        purchases:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
          description: Total purchases posted during the cycle.
        payments:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
          description: |
            Total payments received during the cycle. Negative, because a payment
            reduces what the customer owes.
        credits:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
          description: Total credits applied during the cycle. Negative.
        refunds:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
          description: Total refunds posted during the cycle. Negative.
        interest:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
          description: Interest charged during the cycle.
        fees:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
          description: Fees charged during the cycle.
        overdue_amount:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
          description: |
            The portion of `statement_balance` that was already past due when the
            cycle closed. `0` on a current account.
        as_of:
          type: string
          description: |
            RFC-3339 timestamp of when this statement was read, which is when the
            request was served — not when the cycle closed (that is
            `period_end_date`). Every statement in a page carries the same value.

            A closed statement's figures do not change, but two things about it
            do: servicing can hide a statement, which drops it from later reads,
            and `pdf_url` is only valid for an hour from this instant. Use it to
            label or expire a cached copy.
          example: "2026-08-27T14:22:31Z"

    StatementListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Statement"
        has_more:
          type: boolean
        next_page_token:
          type: string
          description: |
            Opaque cursor for the next page, present only when `has_more` is
            `true`. Pass it back as `starting_after` to fetch the following page.
            Treat it as opaque — its contents are not a statement id and may
            change.
          example: "eyJsYXN0X3N0YXRlbWVudF9pZCI6MTAzfQ"

    AccountStatusValue:
      type: string
      description: The customer's account status.
      enum:
        - CLOSED
      example: "CLOSED"

    RewardStatus:
      type: string
      enum:
        - PENDING
        - AVAILABLE
        - PENDING_DEDUCTION
        - DEDUCTED
      example: "PENDING"

    RewardType:
      type: string
      enum:
        - OFFER
        - TRANSACTION
        - ONE_TIME
        - STATEMENT
        - REFERRAL
      example: "TRANSACTION"

    Offer:
      type: object
      description: Offer marketing placement returned for a partner customer
      required:
        - id
        - is_prescreened
        - title
        - description
      properties:
        id:
          type: string
          description: The unique ID Imprint assigns to the offer placement
          example: "2ade1a36-b6f7-489b-a941-865c33f82f5a"
        is_prescreened:
          type: boolean
          description: Indicates whether the offer is a prescreened offer
          example: true
        title:
          type: string
          description: Short, human-readable title for the offer
          example: "Welcome Offer: Earn $25"
        description:
          type: string
          description: Full marketing copy for the offer
          example: "Sign-up, accept your offer, and spend $500 in the first 90 days of becoming a member to unlock your $25 welcome bonus. To qualify for the $25 bonus, you must make qualifying purchases totaling $500 or more using your Company® Card within 90 days of account approval."

    TransactionCurrency:
      type: string
      description: The 3-character currency code of the amount in ISO 4217 format (e.g., "USD")
      example: "USD"

    RewardCurrency:
      type: string
      description: The 3-character currency code of the amount in ISO 4217 format (e.g., "USD") or a reward unit (e.g., "POINTS")
      example: "POINTS"

    Key:
      type: object
      description: Represents an API Key
      properties:
        key:
          type: string
          description: API Key value
          example: "test_"
        created_at:
          type: string
          description: the RFC-3339 date when the key was created
          example: 2025-02-13T19:08:07Z
        deleted_at:
          type: string
          description: the RFC-3339 date when the key was deleted
          example: 2025-02-13T19:08:07Z
    TransactionIntentStatus:
      type: string
      enum:
        - CONFIRMED
        - CANCELED
      example:
        "CONFIRMED"
    CardDesignID:
      type: string
      description: Imprint ID for the graphic design printed on the card
      example: "3b9c1f3e-52a0-44c1-b131-a7ab0099a214"
    CardDesignOrientation:
      type: string
      description: Orientation of the card design artwork
      enum:
        - UNSPECIFIED
        - VERTICAL
        - HORIZONTAL
      example: "VERTICAL"
    CardDesignType:
      type: string
      description: |
        Whether this is the program's default design or one of its selectable alternates.
      enum:
        - UNSPECIFIED
        - DEFAULT
        - REGULAR
      example: "REGULAR"
    CardDesignStatus:
      type: string
      description: |
        Availability of the design. Only `ACTIVE` designs can be selected.
      enum:
        - UNSPECIFIED
        - ACTIVE
        - INACTIVE
        - DELETED
      example: "ACTIVE"
    CardDesign:
      type: object
      required:
        - id
        - name
        - access_min_rank
        - type
        - status
      properties:
        id:
          $ref: "#/components/schemas/CardDesignID"
        name:
          type: string
          description: Human-readable name of the card design
          example: "Midnight Black"
        access_min_rank:
          type: integer
          format: int64
          description: |
            Minimum loyalty tier rank a customer must hold to select this design. `0`
            means available to everyone. A design with a rank above the customer's own
            tier is returned but cannot be selected by them.
          example: 0
        loyalty_tier_name:
          type: string
          description: |
            Name of the loyalty tier corresponding to `access_min_rank`. Currently always
            omitted; use `access_min_rank` to determine gating.
          example: "GOLD"
        categories:
          type: object
          additionalProperties:
            type: string
          description: Partner-defined key/value labels for grouping designs
        image_orientation:
          $ref: "#/components/schemas/CardDesignOrientation"
        type:
          $ref: "#/components/schemas/CardDesignType"
        status:
          $ref: "#/components/schemas/CardDesignStatus"
        light_asset_url_path:
          type: string
          description: |
            Absolute URL of the card design artwork for light mode. Artwork is served
            from `https://assets.imprint.co` or `https://app.imprint.co` depending on
            where it was uploaded.
          example: "https://assets.imprint.co/brand-assets/card-designs/light/midnight-black.svg"
        dark_asset_url_path:
          type: string
          description: |
            Absolute URL of the card design artwork for dark mode. Artwork is served
            from `https://assets.imprint.co` or `https://app.imprint.co` depending on
            where it was uploaded.
          example: "https://assets.imprint.co/brand-assets/card-designs/dark/midnight-black.svg"
        virtual_digital_card_art_id:
          type: string
          description: Processor-side art identifier for the virtual card
        physical_digital_card_art_id:
          type: string
          description: Processor-side art identifier for the physical card
    CardDesignListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CardDesign"
        has_more:
          type: boolean
        total:
          type: integer
        next_page_token:
          type: string
          description: |
            Opaque cursor for the next page, present only when `has_more` is `true`.
            Pass it back as `starting_after` to fetch the following page. Treat it as
            opaque — its contents are not a card design id and may change.
          example: "eyJsIjoyNSwiYyI6eyJpZCI6MTAzfX0="
    PaymentMethodCardDesignResponse:
      type: object
      required:
        - selected
      properties:
        selected:
          type: boolean
          description: |
            Whether a card design is resolved for this payment method. When `false`,
            `card_design` is omitted.
        card_design:
          $ref: "#/components/schemas/CardDesign"
    CardType:
      type: string
      description: The type of card
      enum:
        - PHYSICAL
        - VIRTUAL
        - UNIFIED
    OrderEvent:
      allOf:
        - $ref: "#/components/schemas/OrderEventBase"
    OrderEventBase:
      type: object
      required:
        - order_id
        - type
        - amount
        - network_transaction_id
      properties:
        order_event_id:
          type: string
          description: The ID of the order event
          example: "77f60af4-185e-4867-b113-34e3cf7c6acd"
        order_id:
          type: string
          description: The ID of the order to which the event is related
          example: "77f60af4-185e-4867-b113-34e3cf7c6acd"
        partner_event_id:
          type: string
          description: Partner's event identifier
          example: "7622c07d-eb2b-4345-a9a9-345d61d32bc2"
        type:
          type: string
          enum: [ CAPTURED, REFUNDED ]
          description: Type of order event
          example: "CAPTURED"
        amount:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
            - example: 274999
              description: "Total event amount ($2,699.99 + $50.00)"
        rewards_amount:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
            - example: 2500
              description: "Total rewards amount for the event ($25 + $0)"
        currency:
          type: string
          description: The 3-character currency code of the amount in ISO 4217 format (e.g., "USD")
          example: "USD"
        network_transaction_id:
          type: string
          description: Card network transaction identifier
          example: "615e3ba0-6b99-495b-ade4-1f584c40f376"
        order_lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
          description:
            When provided, the API will require that the calculated sum of all the rates and rewards rates
            within (taking quantities into account) are equal to the `amount` and `rewards_amount`, respectively.
            
            It is important to note that the sums of all *event* amounts and *event* rewards amounts belonging to an
            order do not need to be equal to `total_order_amount` and `total_rewards_amount` in the order, as the data
            contained in events will serve as the final source of truth for the lifecycle of the order, as it actually
            transpired.
          example:
            - name: "Couch Supreme"
              product_url: "www.restassured.com/couch-supreme"
              image_url: "https://cdn.restassured.com/couch-supreme.jpg"
              quantity: 1
              rate: 274999
              rewards_rate: 2500

    OrderEventsResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrderEvent"
          description: List of order events
        has_more:
          type: boolean
        total:
          type: integer

    Order:
      allOf:
        - $ref: "#/components/schemas/OrderBase"
    OrderBase:
      type: object
      required:
        - payment_method_id
        - total_order_amount
        - partner_order_id
      properties:
        id:
          type: string
          description: Unique identifier for the order
          example: "77f60af4-185e-4867-b113-34e3cf7c6acd"
        customer_id:
          type: string
          description: Customer identifier
          example: "1bb0ab64-ed57-4f2f-bd8d-ab04d1a365c5"
        payment_method_id:
          type: string
          description: Payment method identifier
          example: "0144ea84-3c39-4382-a37a-03c699b77646"
        partner_order_id:
          type: string
          description: >-
            Partner's order identifier. Within a product, the combination of
            `partner_order_id` and `payment_method_id` uniquely identifies an order.
            Submitting the same combination again when creating an order updates
            the existing order and returns its existing `id`. The same
            `partner_order_id` may be used with a different `payment_method_id`
            to create a separate order.
          example: "o-c8a1fe46bbff4a18ba1d"
        merchant_id:
          type: string
          nullable: true
          description: Merchant identifier
          example: "m-123456789"
        merchant_name:
          type: string
          nullable: true
          description: Merchant name
          example: "Rest Assured"
        merchant_address:
          type: array
          items:
            $ref: "#/components/schemas/Address"
          description: List of merchant addresses
        order_lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
          description:
            An array of items that make up the order, used for the purpose of establishing the items, amounts, and
            rewards that are *expected* to be included in events sent to Imprint following order creation.
            
            Changes made to orders after the order is created can be implicitly communicated to Imprint through the
            event creation process following the creation of the order; modifying the order itself is not necessary.
            The set of events sent to Imprint after order creation serve as the final source of truth for transaction
            amounts, rewards, order lines, etc.
            
            When provided, the API will require that the calculated sum of all the rates and rewards rates
            within (taking quantities into account) are equal to the `total_order_amount` and `total_rewards_amount`,
            respectively.
          example:
            - name: "Couch Supreme"
              product_url: "www.restassured.com/couch-supreme"
              image_url: "https://cdn.restassured.com/couch-supreme.jpg"
              quantity: 1
              rate: 274999
              rewards_rate: 2500
        total_order_amount:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
            - example: 274999
              description: "Total order amount ($2,699.99 + $50.00)"
        total_rewards_amount:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
            - example: 2500
              description: "Total rewards amount ($25 + $0)"
        currency:
          type: string
          description: The 3-character currency code of the amount in ISO 4217 format (e.g., "USD")
          example: "USD"
        created_at:
          type: string
          format: date-time
          nullable: true
          description: The RFC-3339 timestamp when the order was created
          example: "2025-02-13T19:08:07Z"
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: The RFC-3339 timestamp when the order was last updated
          example: "2025-02-13T19:08:07Z"

    OrderLine:
      type: object
      required:
        - name
        - quantity
        - rate
        - rewards_rate
      properties:
        name:
          type: string
          description: Name of the order line item
          example: "Couch Supreme"
        product_url:
          type: string
          nullable: true
          description: URL to the product
          example: "www.restassured.com/couch-supreme"
        image_url:
          type: string
          nullable: true
          description: URL to an image of the product
          example: "https://cdn.restassured.com/couch-supreme.jpg"
        quantity:
          type: integer
          description: Quantity of the item
          example: 1
        rate:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
            - example: 274999
        rewards_rate:
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
            - example: 2500

    OrdersResponse:
      type: object
      required:
        - orders
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
          description: List of orders

    ApplicationConfiguration:
      type: object
      description: |
        The program's application schema — every field that can ever be asked
        for, the disclosures that must be consented, and the verification and
        authentication modes in effect.
      required:
        - configuration_revision
        - fields
        - disclosures
        - requirement_definitions
      properties:
        configuration_revision:
          type: string
          description: |
            Identifier for this configuration entry. Applications retain this
            value so callers can request the matching entry when resuming.
            Operators can edit or remove entries; revisions are not immutable snapshots.
          example: "ACFG-2026-08-02-1"
        fields:
          type: array
          description: |
            Every applicant field the program can ask for. Use this to build
            your form; use the application's `requirements` to decide what to
            show for a given applicant.
          items:
            $ref: "#/components/schemas/ApplicationFieldSchema"
        disclosures:
          type: array
          description: The disclosures this program requires consent to.
          items:
            $ref: "#/components/schemas/DisclosureSchema"
        requirement_definitions:
          type: array
          description: |
            Every non-field, non-disclosure requirement key this program can
            emit. FIELD keys are defined by `fields`; DISCLOSURE keys are
            defined by `disclosures`. Together these collections define every
            requirement key an application can return.
          items:
            $ref: "#/components/schemas/ApplicationRequirementDefinition"
        legal_documents:
          type: array
          description: |
            Every document the program publishes, whether or not a disclosure
            references it. A program has documents no single consent covers — a
            rewards program's terms, a fee schedule — and an applicant is
            entitled to read all of them, so the full set is published rather
            than only the consent-reachable subset.

            This is not consent: nothing here needs acknowledging. Render it as
            a documents or terms section, separately from `disclosures`.
          items:
            $ref: "#/components/schemas/LegalDocumentSchema"
        phone_verification:
          $ref: "#/components/schemas/ApplicationPhoneVerification"
        authentication:
          $ref: "#/components/schemas/ApplicationAuthentication"
        card_design:
          $ref: "#/components/schemas/ApplicationCardDesign"


    ApplicationPhoneVerification:
      type: object
      required:
        - mode
      properties:
        mode:
          type: string
          description: |
            `IMPRINT_OTP` — Imprint sends and verifies the code.
            `PARTNER_ATTESTED` — you may instead certify that you verified
            the phone number yourself, via the `ATTEST` action.
          enum:
            - IMPRINT_OTP
            - PARTNER_ATTESTED
          example: "IMPRINT_OTP"
        code_length:
          type: integer
          description: |
            How many digits the code has, so an input can be sized before a
            code is ever sent. Present when `mode` is `IMPRINT_OTP`.
          example: 6
        resend_after_ms:
          type: integer
          description: |
            How long to wait between `SEND` actions. Lets a caller disable
            its own resend control before being rejected; the `429` from the
            endpoint remains authoritative, since it accounts for a code
            sent before the current page was loaded.
          example: 15000

    ApplicationAuthentication:
      type: object
      required:
        - supported_types
      properties:
        supported_types:
          type: array
          description: |
            The authentication types this program accepts.
            `PARTNER_MANAGED` is present only for programs with a full
            Servicing-API integration.
          items:
            type: string
            enum:
              - PASSWORD
              - PARTNER_MANAGED
          example: ["PASSWORD"]
        password_policy:
          $ref: "#/components/schemas/PasswordPolicy"

    ApplicationCardDesign:
      type: object
      description: How card-design selection behaves for this program.
      properties:
        default_card_design_id:
          type: string
          format: uuid
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-import: &nullableImport
            path: github.com/oapi-codegen/nullable
          x-go-type-skip-optional-pointer: true
          description: |
            The default card design for single-product applications, applied
            when the applicant does not choose one. When present, the
            `card_design` requirement starts satisfied and a selection is an
            override. Multi-product applications choose a design per product
            offer on accept instead.
          example: "8a2f41c6-90be-4d77-b1e3-5c7092da6f84"

    PasswordPolicy:
      type: object
      description: |
        The password rule this program enforces, published so a caller can
        validate before submitting rather than inventing its own rule and
        rejecting input the program would have accepted.

        This is the inline-checkable subset of the Imprint default password
        policy: 10 to 128 Unicode code points with at least one uppercase
        letter, one lowercase letter and one digit. The server additionally
        rejects four-character sequential or repeated runs, common passwords,
        and passwords containing the applicant's email name, phone digits or
        date of birth; none of those can be expressed here, so a password that
        satisfies this object can still be rejected with
        `PASSWORD_POLICY_VIOLATION`. See the Password policy section of the
        Application APIs guide for the full table.

        The vocabulary is deliberately the same as `ApplicationFieldSchema`'s —
        `pattern`, `min_length`, `max_length` — rather than a second one for the
        same job.
      properties:
        min_length:
          type: integer
          example: 10
        max_length:
          type: integer
          description: |
            Real policy rather than an oversight: hashing unbounded input is a
            cheap denial of service, so the bound is published rather than
            discovered.
          example: 128
        pattern:
          type: string
          description: |
            A regular expression the password must match.

            This pattern must compile in every engine that reads it, which rules
            out the two constructs most likely to be reached for first:
            lookahead (`(?=...)`) is unsupported by Go's RE2, and the `(?s)`
            flag is a syntax error in JavaScript. The portable form of "an
            uppercase letter, a lowercase letter and a digit, in any order" is an
            alternation over the six orderings, as in the example.

            Unicode classes are used rather than ASCII ranges because programs
            publish non-English copy, and `[A-Za-z]` would reject a valid
            password such as `contraseña1` for containing no letters. Callers
            compiling this in a browser must pass the `u` flag: without it
            JavaScript reads `\p{L}` as a literal `p` instead of failing, and
            silently enforces a rule the program never published.

            A caller that cannot compile the pattern should treat the password as
            acceptable and let the server reject it. The program enforces the
            rule regardless, and a form that can never be submitted is worse
            than a rejection that explains itself.
          example: "^(?:[\\s\\S]*\\p{Lu}[\\s\\S]*\\p{Ll}[\\s\\S]*\\p{Nd}|[\\s\\S]*\\p{Lu}[\\s\\S]*\\p{Nd}[\\s\\S]*\\p{Ll}|[\\s\\S]*\\p{Ll}[\\s\\S]*\\p{Lu}[\\s\\S]*\\p{Nd}|[\\s\\S]*\\p{Ll}[\\s\\S]*\\p{Nd}[\\s\\S]*\\p{Lu}|[\\s\\S]*\\p{Nd}[\\s\\S]*\\p{Lu}[\\s\\S]*\\p{Ll}|[\\s\\S]*\\p{Nd}[\\s\\S]*\\p{Ll}[\\s\\S]*\\p{Lu})[\\s\\S]*$"

    LocalizedMessage:
      type: object
      description: |
        Applicant-facing text, keyed by IETF BCP 47 locale tag.

        A dictionary rather than a server-resolved string because the caller
        knows which locale to render and the server does not: an applicant who
        switches language mid-application would otherwise need every requirement
        refetched, and resolving server-side means resolving against a language
        preference the applicant may not have set yet.

        Callers should fall back to `en-US`, and then to any present locale — a
        missing translation should degrade to readable copy in the wrong
        language rather than to a blank where the applicant most needs to be
        told something.
      additionalProperties:
        type: string
      example:
        en-US: "At least 8 characters, including a letter and a number."
        es-US: "Al menos 8 caracteres, incluyendo una letra y un número."

    ApplicationFieldSchema:
      type: object
      description: |
        The schema for one applicant field: how to render and validate it, and
        whether the program can ever require it.

        No label is published. What a field is *called* belongs to the surface it
        appears on — it changes with that surface and needs translating alongside
        the rest of the page. Validation is published because the program
        enforces it server-side, and a caller inventing its own would reject
        input the program accepts.
      required:
        - key
        - type
        - necessity
      properties:
        key:
          type: string
          description: |
            The field's stable identifier, also used as the `key` of a
            `FIELD` requirement and as the path to set in `PATCH`.
          example: "applicant.email"
        type:
          type: string
          description: The field's data type, which determines the JSON shape accepted by `PATCH`.
          enum:
            - string
            - email
            - phone
            - integer
            - date
            - address
            - enum
          example: "email"
        necessity:
          type: string
          description: |
            `ALWAYS_REQUIRED` — every application will require this field.
            `CONDITIONALLY_REQUIRED` — some applications will, depending on
            their state; only the application's `requirements` can tell you.
            `OPTIONAL` — never blocks progress.

            This describes what the program *can* ask for. It never tells you
            what a given application requires right now.
          enum:
            - ALWAYS_REQUIRED
            - CONDITIONALLY_REQUIRED
            - OPTIONAL
          example: "ALWAYS_REQUIRED"
        pattern:
          type: string
          description: A regular expression the value must match.
          example: "^\\d{9}$"
        min_length:
          type: integer
          example: 1
        max_length:
          type: integer
          example: 254
        allowed_values:
          type: array
          description: For `enum` fields, the permitted values.
          items:
            type: string
          example: ["EMPLOYED", "SELFEMPLOYED", "OTHER"]
        minimum:
          type: integer
          format: int64
          description: For `integer` fields, the smallest permitted value, inclusive.
          example: 0
        maximum:
          type: integer
          format: int64
          description: For `integer` fields, the largest permitted value, inclusive.
          example: 999999900
        multiple_of:
          type: integer
          format: int64
          description: |
            For `integer` fields, the value must be an exact multiple of this
            number. Currency fields use `100` to require whole dollars.
          example: 100

    DisclosureSchema:
      type: object
      description: A disclosure with all configured translations, keyed by locale.
      required:
        - id
        - version
        - content
        - gates
      properties:
        id:
          type: string
          description: Stable opaque disclosure identifier used when recording consent.
          example: "DISC-esign-v1"
        version:
          type: string
          example: "1"
        content:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ApplicationDisclosureContent"
        gates:
          type: string
          description: The milestone this disclosure blocks until consented.
          enum:
            - PHONE_VERIFICATION
            - SUBMIT
            - OFFER_ACCEPTANCE
            - COMPLETION

    ApplicationDisclosureContent:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: Where the disclosure content can be retrieved for display.
        body:
          type: array
          items:
            type: string
        acknowledgement:
          type: string

    LegalDocumentSchema:
      type: object
      description: A published document with all configured translations, keyed by locale.
      required:
        - id
        - content
      properties:
        id:
          type: string
          example: "DOC-cardholder-agreement-v1"
        content:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ApplicationLegalDocumentContent"

    ApplicationLegalDocumentContent:
      type: object
      required:
        - display_name
        - url
      properties:
        display_name:
          type: string
        url:
          type: string

    Application:
      type: object
      description: |
        An application in progress or complete. `requirements` is the driver:
        it tells you what to collect next and what is blocking each milestone.
      required:
        - id
        - configuration_revision
        - status
        - requirements
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Stable opaque application id, unchanged in reads and API-origin webhooks.
          example: "7f3c1e20-4b8a-4e11-9c6d-2a5f0b7d3e91"
        configuration_revision:
          type: string
          description: |
            The configuration revision currently assigned to this application.
            Initially pinned at create and unchanged by routine configuration
            updates. If a legal revision is revoked, the server assigns its
            replacement while preserving candidate and consent history, and
            returns the replacement disclosure as unsatisfied.
          example: "ACFG-2026-08-02-1"
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        partner_customer_id:
          $ref: "#/components/schemas/PartnerCustomerId"
        customer_id:
          type: string
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-import: *nullableImport
          x-go-type-skip-optional-pointer: true
          description: |
            The existing external Imprint customer identifier used by the
            servicing APIs. Populated once offer acceptance provisions the
            account; `null` before then. It is not a separate application-only
            identifier.
          example: "2EE24580-B97B-4949-A65C-929CCB9B9B8D"
        requirements:
          type: array
          description: |
            Everything outstanding or satisfied for this application, in
            recommended order. Iterate this list rather than reading individual
            status flags — new requirement kinds are added here over time.
          items:
            $ref: "#/components/schemas/ApplicationRequirement"
        poll_after_ms:
          type: integer
          nullable: true
          x-go-type: nullable.Nullable[int]
          x-go-type-import: *nullableImport
          x-go-type-skip-optional-pointer: true
          description: |
            When present, the application is mid-evaluation — wait this many
            milliseconds before polling again. `null` means no evaluation is in
            flight and polling will not change the result. It can remain set for
            longer than usual while Imprint completes a delayed evaluation; that
            is not an error. Poll for at most 30 seconds in the applicant's
            session, then rely on the application webhook.
          example: 2000
        applicant:
          $ref: "#/components/schemas/Applicant"
        metadata:
          type: object
          description: Application metadata after applying create and merge-patch updates.
          additionalProperties:
            type: string
        card_design_id:
          type: string
          format: uuid
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-import: *nullableImport
          x-go-type-skip-optional-pointer: true
          description: |
            The card design selected on the application. Applies only to
            single-product applications. Writable via `PATCH` through
            `OFFERS_AVAILABLE`, and used when accepting the product offer
            without a `card_design_id`.
            The design each accepted product offer actually committed is
            `product_offers[].card_design_id`.
          example: "8a2f41c6-90be-4d77-b1e3-5c7092da6f84"
        product_offers:
          type: array
          description: |
            One entry per product on the application: that product's decision
            and, when approved, its offer. Empty until decisioning finishes, and
            empty while the application is `IDV_REQUIRED`, `FROZEN`, or
            `PENDING_REVIEW`. Only an `OFFER_READY`, `ACCEPTED`,
            `ACCEPTED_PENDING_ACTION`, or `COMPLETED` entry carries offer terms.
          items:
            $ref: "#/components/schemas/ProductOffer"
        product_offer:
          allOf:
            - $ref: "#/components/schemas/ProductOffer"
          description: >
            The accepted product offer. Present only on the accept response.
        ownership_session:
          allOf:
            - $ref: "#/components/schemas/OwnershipSession"
          description: |
            Reserved for the Imprint-hosted account-ownership handoff, which is
            not yet available; never present today. When it ships it appears
            only in the response that initiates `HOSTED` verification and is
            omitted from ordinary reads. Do not persist its URL.
        created_at:
          type: string
          description: The RFC-3339 timestamp when the application was created
          example: "2026-08-02T19:08:07Z"
        updated_at:
          type: string
          description: The RFC-3339 timestamp when the application was last updated
          example: "2026-08-02T19:12:44Z"
        draft_expires_at:
          type: string
          description: >
            The RFC-3339 timestamp, set at creation, by which the application
            must be submitted. An application that has not been submitted by
            then is removed: `GET` returns `404` and the list omits it. Has no
            effect once the application is submitted.
          example: "2026-08-30T19:08:07Z"
        expires_at:
          type: string
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-import: *nullableImport
          x-go-type-skip-optional-pointer: true
          description: >
            The RFC-3339 timestamp, set at the first submit, by which an offer
            must be accepted. `null` until then; a later resubmit does not move
            it. If no offer has been accepted by this time, including while the
            application is still being decided, the application becomes
            `EXPIRED`. Each `OFFER_READY` entry in `product_offers` also carries
            its own `expires_at`, which can be earlier.
          example: "2026-08-27T19:08:07Z"


    ApplicationStatus:
      type: string
      description: |
        The application's lifecycle status. The application webhook reports
        this same status: Imprint computes it from the application's current
        decisioning state on every read, and sends the webhook only after that
        state changes, so a `GET /v2/applications/{application_id}` made after
        a webhook returns that webhook's `status` or a later one, never an
        earlier one.

        Branch on `status`, not on
        `product_offers[].result`, when choosing what to render: in a
        multi-product application some products can be `REJECTED` while the
        application is `OFFERS_AVAILABLE`.

        `IDV_REQUIRED`, `FROZEN`, and `PENDING_REVIEW` are application statuses,
        not product offer results; `product_offers` is empty while the
        application is in one of them. `IDV_REQUIRED` means the applicant must
        complete IDV; `FROZEN` means the applicant must lift the credit freeze
        with the bureau before the application is resubmitted.

        `EVALUATING` means Imprint is decisioning the application. It normally
        lasts seconds but can occasionally persist longer while Imprint
        completes a delayed evaluation; no action is required and the
        application cannot be submitted again from this status.

        `OFFER_ACCEPTED` means acceptance is durably committed and provisioning
        is still running. `PENDING_AUTHENTICATION` means the account exists but
        required authentication is outstanding. `COMPLETED` requires both.
        `ACCOUNT_FUNDED` is shared webhook vocabulary for funding products; the
        first Application API release has no secured funding operation and does
        not originate it.
      enum:
        - IN_PROGRESS
        - EVALUATING
        - IDV_REQUIRED
        - PENDING_REVIEW
        - FROZEN
        - OFFERS_AVAILABLE
        - REJECTED
        - OFFER_ACCEPTED
        - ACCOUNT_FUNDED
        - PENDING_AUTHENTICATION
        - COMPLETED
        - EXPIRED
      example: "IN_PROGRESS"

    ApplicationRequirementDefinition:
      type: object
      description: A non-field requirement key the program may emit.
      required:
        - key
        - kind
        - blocks
      properties:
        key:
          type: string
          example: "account_ownership"
        kind:
          type: string
          enum:
            - ACTION
            - SELECTION
          example: "ACTION"
        blocks:
          type: string
          enum:
            - PHONE_VERIFICATION
            - SUBMIT
            - OFFER_ACCEPTANCE
            - COMPLETION
          example: "SUBMIT"
        resolution_options:
          type: array
          description: The resolution routes this requirement may advertise when unsatisfied.
          items:
            $ref: "#/components/schemas/RequirementResolutionOption"

    ApplicationRequirement:
      type: object
      description: |
        One thing the application needs. `kind` says what sort of thing it is,
        `status` whether it is done, and `blocks` which milestone it holds up.

        Modelling fields, disclosures, and actions in one list means a new
        requirement is an added array entry rather than a new response field —
        so handle unknown `kind` and `key` values by ignoring them rather than
        failing.
      required:
        - key
        - kind
        - status
      properties:
        key:
          type: string
          description: |
            Stable identifier. For `FIELD` requirements this matches a `key` in
            the application configuration's `fields`.
          example: "applicant.address"
        kind:
          type: string
          description: |
            `FIELD` — applicant data, set via `PATCH`.
            `DISCLOSURE` — consent recorded via `PATCH`.
            `SELECTION` — a choice among options, such as a card design.
            `ACTION` — something with a side effect, satisfied by its own
            `POST` endpoint.
          enum:
            - FIELD
            - DISCLOSURE
            - SELECTION
            - ACTION
          example: "FIELD"
        status:
          type: string
          description: |
            `MISSING` — not yet provided.
            `PENDING` — provided or started, awaiting completion elsewhere
            (an OTP sent but unverified, an IDV session in progress).
            `SATISFIED` — done.
            `INVALID` — provided but rejected; `message` explains why.
          enum:
            - MISSING
            - PENDING
            - SATISFIED
            - INVALID
          example: "MISSING"
        blocks:
          type: string
          nullable: true
          description: |
            The milestone this requirement holds up, or `null` if it blocks
            nothing.

            `blocks` names the *earliest* milestone gated, not the only one, so
            the milestones nest: `PHONE_VERIFICATION` requirements block
            submission as well, because nothing can be submitted before the
            phone is verified. To find what is holding up submit, take every
            unsatisfied requirement whose `blocks` is `PHONE_VERIFICATION` or
            `SUBMIT` — which is what `SUBMIT_BLOCKED`'s `blocking_requirements`
            reports. `OFFER_ACCEPTANCE` and `COMPLETION` requirements do not
            block submission: `authentication` can be satisfied after an offer is
            accepted.
          enum:
            - PHONE_VERIFICATION
            - SUBMIT
            - OFFER_ACCEPTANCE
            - COMPLETION
          example: "SUBMIT"
        message:
          allOf:
            - $ref: "#/components/schemas/LocalizedMessage"
          description: >
            Why the value was rejected, present when `status` is `INVALID`.
            Applicant-facing and safe to display.
          example:
            en-US: "Address could not be verified"
            es-US: "No se pudo verificar la dirección"
        disclosure:
          $ref: "#/components/schemas/DisclosureSchema"
        resolution_options:
          type: array
          description: |
            For an unsatisfied `ACTION`, the route or routes by which it can be
            resolved. Present whenever the caller must choose a dedicated
            resolution route, even if only one is currently available.
          items:
            $ref: "#/components/schemas/RequirementResolutionOption"

    RequirementResolutionOption:
      type: object
      description: One way to satisfy a requirement.
      required:
        - type
      properties:
        type:
          type: string
          description: |
            Identifies the route to take. These name *routes*, and are a
            different vocabulary from the credential `type` the routes accept —
            do not pass one of these values through as a request field:

            | This option | Call | With `type` |
            |---|---|---|
            | `VERIFY_PASSWORD` | `POST .../verify_account_ownership` | `PASSWORD` |
            | `VERIFY_PIN` | `POST .../verify_account_ownership` | `PIN` |
            | `HOSTED_AUTHENTICATION` | `POST .../verify_account_ownership` | `HOSTED` |
            | `SET_PASSWORD` | `POST .../authentication` | `PASSWORD` |
            | `IDV` | `POST .../idv` | — |

            `HOSTED_AUTHENTICATION` is reserved and not advertised today.
            `UNFREEZE_CREDIT` has no endpoint: the applicant must lift the
            freeze with the bureau, then the application can be resubmitted.
          enum:
            - VERIFY_PASSWORD
            - VERIFY_PIN
            - HOSTED_AUTHENTICATION
            - SET_PASSWORD
            - IDV
            - UNFREEZE_CREDIT
          example: "VERIFY_PASSWORD"
        message:
          allOf:
            - $ref: "#/components/schemas/LocalizedMessage"
          description: Applicant-facing detail about this option.
          example:
            en-US: "Verify the password on the existing Imprint account"
            es-US: "Verifique la contraseña de su cuenta Imprint existente"

    Applicant:
      type: object
      description: |
        The applicant data held on the application. Fields absent from the
        program's configuration are never populated. Sensitive values are
        returned masked or omitted.
      properties:
        first_name:
          type: string
          example: "Jane"
        last_name:
          type: string
          example: "Doe"
        email:
          type: string
          format: email
          example: "jane@doe.com"
        phone:
          type: string
          description: E.164 format
          example: "+15125550143"
        address:
          $ref: "#/components/schemas/Address"
        date_of_birth:
          $ref: "#/components/schemas/DateOfBirth"
        ssn_last_four:
          type: string
          description: >
            The last four digits of the SSN. The full value is never returned.
          example: "1234"
        annual_income:
          type: integer
          description: |
            Gross annual income in cents (the smallest currency unit). Must be
            a whole-dollar amount (a multiple of 100) between 0 and 999999900
            ($9,999,999.00); `8500000` is $85,000.00. A value outside these
            bounds cannot be submitted.
          example: 8500000
        income_type:
          type: string
          example: "SALARY"
        housing_cost:
          type: integer
          description: |
            Monthly housing cost in cents (the smallest currency unit). Must be
            a whole-dollar amount (a multiple of 100) between 0 and 999999900
            ($9,999,999.00); `220000` is $2,200.00. A value outside these
            bounds cannot be submitted.
          example: 220000
        housing_type:
          type: string
          example: "RENT"
        language:
          type: string
          description: IETF language tag for applicant-facing content
          example: "en-US"

    ProductOffer:
      type: object
      description: |
        One product's decision and, when approved, its offer.

        `credit_limit`, `apr_percentage`, `expires_at`, and
        `cardholder_agreement_url` are present only on an `OFFER_READY`,
        `ACCEPTED`, `ACCEPTED_PENDING_ACTION`, or `COMPLETED` entry.
        `card_design_id` is present once the entry is accepted. A `REJECTED`
        entry carries its reasons and, when required, an adverse action
        notice.
      required:
        - id
        - product_id
        - result
      properties:
        id:
          type: string
          format: uuid
          description: The id to pass as `product_offer_id` when accepting.
          example: "6db3f865-e2ea-4cf0-a77d-4330a1b2c3d4"
        product_id:
          type: string
          description: The product this decision is for
          example: "daff06e9-143f-4318-81db-42d47e9bb388"
        result:
          $ref: "#/components/schemas/ProductOfferResult"
        reason_code:
          type: string
          description: |
            The primary machine-readable reason. This vocabulary only ever
            grows — codes are never repurposed — so treat an unrecognised code
            as an unhandled default rather than an error.
          example: "INSUFFICIENT_CREDIT_HISTORY"
        reasons:
          type: array
          description: All contributing reasons, most significant first.
          items:
            type: object
            required:
              - code
            properties:
              code:
                type: string
                example: "INSUFFICIENT_CREDIT_HISTORY"
              message:
                allOf:
                  - $ref: "#/components/schemas/LocalizedMessage"
                description: >
                  Applicant-facing explanation of this reason, safe to display.
                example:
                  en-US: "Not enough credit history"
                  es-US: "Historial de crédito insuficiente"
        adverse_action_notice_url:
          type: string
          description: >
            Where the adverse action notice can be retrieved, when one is
            required for this decision.
          example: "https://disclosures.imprint.co/aan/7f3c1e20-4b8a-4e11-9c6d-2a5f0b7d3e91.pdf"
        cardholder_agreement_url:
          type: string
          description: >
            Where this product offer's cardholder agreement can be retrieved. It is
            generated for this product with this product offer's terms, so each
            acceptable entry has its own. Present on an `OFFER_READY`,
            `ACCEPTED`, `ACCEPTED_PENDING_ACTION`, or `COMPLETED` entry once the
            agreement has been generated. Presigned and short-lived: do not
            cache, log, or persist it.
          example: "https://disclosures.imprint.co/cardholder-agreement/APLN-v1-650E5076-F94C-4E6C-9583-9DED76DB3F86/agreement.pdf"
        card_design_id:
          type: string
          format: uuid
          description: >
            The card design committed for this product when the product offer was
            accepted, and the design used for issuance. Absent until the entry
            is accepted, or when no design was selected.
          example: "3b9c1f3e-52a0-44c1-b131-a7ab0099a214"
        credit_limit:
          $ref: "#/components/schemas/CurrencyAmount"
        apr_percentage:
          type: number
          description: The purchase APR as a percentage
          example: 24.99
        expires_at:
          type: string
          description: The RFC-3339 timestamp after which this offer can no longer be accepted
          example: "2026-08-20T12:00:04Z"

    ProductOfferResult:
      type: string
      description: |
        One product's decision.

        - `OFFER_READY`: approved for this product; the offer can be accepted.
        - `ACCEPTED`: the offer was accepted and the account is being provisioned.
        - `ACCEPTED_PENDING_ACTION`: the offer was accepted and a required
          action, such as funding a security deposit, must complete first.
        - `COMPLETED`: the account for this product is provisioned.
        - `REJECTED`: declined for this product.
        - `EXPIRED`: the offer was not accepted in time, or an accepted offer's
          required action did not complete in time.

        `COMPLETED`, `REJECTED`, and `EXPIRED` are final.
      enum:
        - OFFER_READY
        - ACCEPTED
        - ACCEPTED_PENDING_ACTION
        - COMPLETED
        - REJECTED
        - EXPIRED
      example: "OFFER_READY"

