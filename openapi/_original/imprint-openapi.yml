        data:
          type: object
          properties:
            merchant_key:
              type: string
              description: Unique identifier for the merchant associated with this webhook event.
              example: "MERCHANT_ABC"
            customer_id:
              type: string
              description: Imprint's unique identifier for the associated customer
              example: "2EE24580-B97B-4949-A65C-929CCB9B9B8D"
            partner_customer_id:
              $ref: "#/components/schemas/PartnerCustomerId"
            application_id:
              type: string
              format: uuid
              description: >
                Imprint's unique identifier for the application. Pass it to
                `GET /v2/applications/{application_id}` for the full state.
              example: "7f3c1e20-4b8a-4e11-9c6d-2a5f0b7d3e91"
            status:
              type: string
              description: |
                The new status of the application. The application already
                carries this status when the webhook is sent, so
                `GET /v2/applications/{application_id}` returns this status or a
                later one. Webhooks are retried, so ignore one whose status is
                behind a status you already hold.

                Rejections are reported as a single `REJECTED` status refined by
                `reason_code`, rather than as distinct statuses per rejection
                cause.
              example: OFFER_ACCEPTED
              enum:
                - EVALUATING
                - IDV_REQUIRED
                - PENDING_REVIEW
                - OFFERS_AVAILABLE
                - REJECTED
                - OFFER_ACCEPTED
                - ACCOUNT_FUNDED
                - COMPLETED
                - EXPIRED
                - FROZEN
            product_types:
              type: array
              description: >
                The product types on the application. A single-product
                application has one entry; a multi-product application (for
                example a credit card with a secured-card backup) lists each. For
                `OFFERS_AVAILABLE` this is limited to the products that actually
                have an offer ready, so a rejected or skipped backup is excluded.
