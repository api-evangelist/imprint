openapi: 3.1.0
info:
  title: Public Imprint API
  version: "2.0"

security:
  - basicAuth: []
  - bearerAuth: []

servers:
  - url: "https://dev.sbx.imprint.co"
    description: "Imprint public api sandbox"

paths:
  /v2/customers:
    get:
      tags:
        - "Customers"
      summary: Search for customers
      operationId: searchCustomers
      parameters:
        - name: partner_customer_id
          in: query
          description: The unique identifier for the customer in the partner's system
          schema:
            $ref: "#/components/schemas/PartnerCustomerId"
        - name: limit
          $ref: "#/components/parameters/limitParam"
        - name: starting_after
          $ref: "#/components/parameters/startingAfterParam"
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
    post:
      tags:
        - "Customers"
      summary: Search for customers
      operationId: searchCustomersPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                partner_customer_id:
                  $ref: "#/components/schemas/PartnerCustomerId"
                ssn:
                  description: The ssn of the customer without hyphens
                  example: "123456789"
                  type: string
                date_of_birth:
                  $ref: "#/components/schemas/DateOfBirth"
                limit:
                  description: Limits the number of returned results
                  type: integer
                  minimum: 1
                  default: 10
                  format: int32
                starting_after:
                  description: A cursor for use in pagination. An id that defines your place in the list.
                  type: string
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"

  /v2/customers/{customer_id}:
    get:
      tags:
        - "Customers"
      summary: Retrieve a customer
      description: |
        Retrieves the details of an existing customer by ID

        **Optional scope:** `AUTHORIZED_USER_READ`. Without it the request still succeeds, but `authorized_users` is omitted from the response.
      operationId: getCustomer
      x-optional-scopes:
        - AUTHORIZED_USER_READ

      parameters:
        - name: customer_id
          in: path
          required: true
          description: The unique identifier for the customer
          schema:
            type: string
            example: "BBB815E9-F654-438D-9AD3-3F7BB8136FC0"
      responses:
        "200":
          description: Customer retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerNotFoundError"

  /v2/customers/{customer_id}/link:
    post:
      tags:
        - "Customer Links"
      summary: Link an Imprint customer and partner customer accounts
      description: Creates a link between an existing Imprint customer and a partner's customer account. The API key provided with the request will be used to link the partner with the imprint customer.
      operationId: linkCustomerAccount

      parameters:
        - name: customer_id
          in: path
          required: true
          description: The unique identifier for the Imprint customer
          schema:
            type: string
            example: "BBB815E9-F654-438D-9AD3-3F7BB8136FC0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - partner_customer_id
              properties:
                partner_customer_id:
                  $ref: "#/components/schemas/PartnerCustomerId"
                metadata:
                  type: object
                  description: Additional linking metadata
                  additionalProperties: true
                  example:
                    store_id: "store_789"
                    platform_version: "2.1.0"
      responses:
        "200":
          description: Customer accounts linked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerLink"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestError"
        "404":
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerNotFoundError"
        "409":
          description: Customer already linked. To change the linked `partner_customer_id`, use `PATCH /v2/customers/{customer_id}/link`.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - type
                      - message
                    properties:
                      type:
                        type: string
                        description: Error type (e.g., CUSTOMER_ALREADY_LINKED)
                      message:
                        type: string
                        example: "Customer already linked to a partner account"
                      existing_link:
                        $ref: "#/components/schemas/CustomerLink"
    patch:
      tags:
        - "Customer Links"
      summary: Update the partner customer ID of a customer link
      description: >
        Changes the `partner_customer_id` of the customer's existing active link to a new value. Use this
        when the partner customer account an Imprint customer is linked to has changed, for example after
        a partner account merge. The link must already exist and be active; to create a link, use
        `POST /v2/customers/{customer_id}/link`. If the provided `partner_customer_id` already matches the
        active link, the link is returned unchanged. A successful change sends a `CUSTOMER_LINK` webhook
        with the new `partner_customer_id`.
      operationId: updateCustomerLink
      parameters:
        - name: customer_id
          in: path
          required: true
          description: The unique identifier for the Imprint customer
          schema:
            type: string
            example: "BBB815E9-F654-438D-9AD3-3F7BB8136FC0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - partner_customer_id
              properties:
                partner_customer_id:
                  $ref: "#/components/schemas/PartnerCustomerId"
                metadata:
                  type: object
                  description: Additional linking metadata
                  additionalProperties: true
                  example:
                    store_id: "store_789"
                    platform_version: "2.1.0"
      responses:
        "200":
          description: Customer link updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerLink"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestError"
        "404":
          description: Customer not found, or the customer has no active link to update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerNotFoundError"

  /v2/customer_sessions:
    post:
      tags:
        - "Customer Sessions"
      summary: Create a new customer session
      description: Creates a new session for a customer with a client_secret that can be passed to the SDK, providing client access to modify their own profile, card, or card/loan application. If required, a new customer will be created to attach this session to. Customer history can be attached to this session and will be included in the customer's profile if created, or attached to the application the customer creates during the session
      operationId: createSession
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                partner_customer_id:
                  $ref: "#/components/schemas/PartnerCustomerId"
                transaction_amount:
                  type: integer
                  description: "The current transaction amount, if the session is currently executing a transaction. integer value in the min currency unit (cents for USD)"
                  example: 34000
                transaction_currency:
                  type: string
                  description: "The 3 char currency code of the amount in iso-4217"
                  example: "USD"
                customer_history:
                  $ref: "#/components/schemas/CustomerAccountHistory"
                source:
                  type: string
                  description: The marketing source that referred the customer.
                  example: "web_signup"
                utm_medium:
                  type: string
                  description: The marketing medium that referred the customer.
                  example: "cpc"
                utm_channel:
                  type: string
                  description: The marketing channel that referred the customer.
                  example: "paid_social"
                utm_campaign:
                  type: string
                  description: The marketing campaign that referred the customer.
                  example: "spring_card_launch"
                utm_content:
                  type: string
                  description: The specific creative or placement that referred the customer.
                  example: "hero_banner_v2"
                utm_term:
                  type: string
                  description: The paid search keyword that referred the customer.
                  example: "rewards+credit+card"
                utm_owner:
                  type: string
                  description: The team or owner accountable for the campaign that produced this session.
                  example: "growth"
                application_origin:
                  $ref: "#/components/schemas/ApplicationOrigin"
                origin_location_id:
                  type: string
                  description: Your own store or location code identifying where the application originated.
                  example: "STORE-4417"
                metadata:
                  type: object
                  description: Additional linking metadata
                  additionalProperties: true
                  example:
                    store_number: "123"
                customer_metadata:
                  type: object
                  description: A set of key-value pairs attached to the customer. These values will be included in webhook event payloads for the partner to receive information about the customer.
                  additionalProperties:
                    type: string
                  example:
                    loyalty_id: "840012345678"
                    membership_tier: "gold"
      responses:
        "201":
          description: Customer session created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSession"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestError"

  /v2/customer_sessions/{session_id}:
    get:
      tags:
        - "Customer Sessions"
      summary: Retrieve a session
      operationId: getSession
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer session retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSession"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNotFoundError"

  /v2/payment_methods:
    get:
      tags:
        - "Payment Methods"
      summary: List payment methods
      description: |
        **Optional scope:** `PCI_DETAILS_READ`. Without it the request still succeeds, but `card.pci_details` (PAN, CVV, expiry) is omitted from the response.
      operationId: searchPaymentMethods
      x-optional-scopes:
        - PCI_DETAILS_READ

      parameters:
        - name: customer_id
          in: query
          required: true
          description: The unique identifier for the customer
          schema:
            type: string
            example: "DE92AF9E-E705-4B8E-9184-6D976DBD8050"
        - name: type
          in: query
          description: The type of payment method to filter by
          schema:
            type: string
            enum:
              - LOAN
              - CARD
              - BANK_ACCOUNT
            example: "LOAN"
        - name: limit
          $ref: "#/components/parameters/limitParam"
        - name: starting_after
          $ref: "#/components/parameters/startingAfterParam"
      responses:
        "200":
          description: List of customer payment methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentMethod"
                  has_more:
                    type: boolean
                  total:
                    type: integer
    post:
      tags:
        - "Payment Methods"
      summary: List payment methods
      description: |
        **Optional scope:** `PCI_DETAILS_READ`. Without it the request still succeeds, but `card.pci_details` (PAN, CVV, expiry) is omitted from the response.
      operationId: searchPaymentMethodsPost
      x-optional-scopes:
        - PCI_DETAILS_READ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
              properties:
                customer_id:
                  type: string
                  description: The Imprint customer id
                  example: "54CFF41D-0AA0-4D16-853B-608C5AAF503D"
                type:
                  type: string
                  description: The type of payment method to filter by
                  enum:
                    - LOAN
                    - CARD
                    - BANK_ACCOUNT
                  example: "CARD"
                pan:
                  type: string
                  description: The card pan to search by
                  example: "4111111592341815"
      responses:
        "200":
          description: List of customer payment methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentMethod"
                  has_more:
                    type: boolean
                  total:
                    type: integer
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestError"

  /v2/payment_methods/{payment_method_id}:
    get:
      tags:
        - "Payment Methods"
      summary: Retrieve a payment method
      description: |
        Retrieves the details of the payment method associated with the supplied `payment_method_id`.

        **Optional scope:** `PCI_DETAILS_READ`. Without it the request still succeeds, but `card.pci_details` (PAN, CVV, expiry) is omitted from the response.
      operationId: getPaymentMethod
      x-optional-scopes:
        - PCI_DETAILS_READ

      parameters:
        - name: payment_method_id
          in: path
          required: true
          description: The unique identifier of the payment method
          schema:
            type: string
            example: "9ED4FE47-8E9C-48E9-BBEF-094DF1789012"
      responses:
        "200":
          description: Payment method retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"
        "404":
          description: Payment method not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodNotFoundError"

  /v2/payment_methods/{payment_method_id}/provision/{wallet}:
    post:
      tags:
        - "Payment Methods"
      summary: Add a payment method to a device wallet
      description: >
        Provisions the payment method into the device wallet named by the
        `wallet` path parameter, returning the encrypted payload the platform
        wallet SDK needs to finish adding the card. `apple_pay` expects the
        PassKit handshake; `google_pay` expects the Google wallet and device
        identifiers.


        For `apple_pay`, your app must obtain the PassKit handshake before
        calling this endpoint. The `certificates`, `nonce`, and
        `nonce_signature` values come from the
        `PKAddPaymentPassViewControllerDelegate` callback and must be
        Base64-encoded — PassKit supplies them as `Data`, not strings. For
        `google_pay`, send the active wallet ID and stable device ID from the
        TapAndPay client.


        The returned payload is single-use. Hand it straight to the wallet SDK;
        do not cache, log, or persist it. See the
        [Add to Wallet guide](https://docs.imprint.co/add-to-wallet) for the
        full integration flow.


        **Required scope:** `CARD_WRITE`
      operationId: provisionPaymentMethod
      x-required-scopes:
        - CARD_WRITE
      parameters:
        - name: payment_method_id
          in: path
          required: true
          description: The unique identifier of the payment method
          schema:
            type: string
            example: "9ED4FE47-8E9C-48E9-BBEF-094DF1789012"
        - name: wallet
          in: path
          required: true
          description: The target device wallet.
          schema:
            type: string
            enum:
              - apple_pay
              - google_pay
            example: "apple_pay"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionPaymentMethodRequest"
      responses:
        "200":
          description: Provisioning payload for the selected wallet SDK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionPaymentMethodResponse"
        "400":
          description: Malformed body, failed field validation, or unsupported wallet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningError"
        "403":
          description: The API key does not have card write access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningError"
        "404":
          description: The payment method does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningError"
        "409":
          description: Already provisioned to this wallet on this device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningError"
        "422":
          description: >
            Well-formed but not actionable — an ineligible device, or a PassKit
            nonce that has gone stale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningError"

  /v2/payment_methods/{payment_method_id}/card_design:
    get:
      tags:
        - "Payment Methods"
      summary: Retrieve a payment method's card design
      operationId: getPaymentMethodCardDesign
      description: |
        Returns the card design printed on this payment method.

        The design belongs to the card, not the customer: a customer with several
        cards can have a different design on each, so read it per payment method.
        Enumerate a customer's cards with
        `GET /v2/customers/{customer_id}/payment_methods` and call this for the one
        you care about.

        A card may have no design resolved yet — some programs assign a default
        asynchronously. That is a normal state, not an error: the response is `200`
        with `selected: false` and no `card_design`.

        Only `CARD` payment methods carry a design. A loan or bank account returns
        `200` with `selected: false`.
      parameters:
        - name: payment_method_id
          $ref: "#/components/parameters/paymentMethodIdParam"
      responses:
        "200":
          description: The payment method's card design, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodCardDesignResponse"
        "404":
          description: Payment method not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethodNotFoundError"

  /v2/transaction_intents:
    post:
      tags:
        - "Transaction Intents"
      summary: Create a transaction intent
      description: |
        Creates a transaction intent object that represents a pending financial transaction. Transaction intents are used to initiate, validate, and track the lifecycle of a transaction before it is finalized.

        **Required scope:** `TRANSACTION_INTENT_WRITE`
      operationId: createTransactionIntent
      x-required-scopes:
        - TRANSACTION_INTENT_WRITE

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - amount
                - currency
              properties:
                customer_id:
                  type: string
                  description: The Imprint Customer ID of the customer making the transaction intent
                  example: "F9B5A5E8-C8B0-4B7A-8E6B-0C8EE90A62CF"
                payment_method_id:
                  type: string
                amount:
                  type: integer
                  description: Amount in min units.
                  example: 10000
                currency:
                  $ref: "#/components/schemas/TransactionCurrency"
                network_transaction_id:
                  type: string
                  description: "The network's unique identifier for the transaction. Examples include Visa Transaction ID, Mastercard Trace ID, and American Express Network Reference ID"
                merchant_name:
                  type: string
                  description: The name of the merchant this transaction intent will be
                  example: "walmart"
                merchant_address:
                  $ref: "#/components/schemas/Address"
                merchant_id:
                  type: string
                merchant_code:
                  type: string
                expected_date:
                  type: string
                  description: the RFC-3339 date when the transaction is expected to process. This does not have to be exact but it will be used as a data point to help link a transaction with a transaction intent. This example includes date and time to be explict, any RFC3339 date or date+time will be accepted
                  example: 2025-02-13T19:08:07Z
                metadata:
                  type: object
                  additionalProperties: true
                  example:
                    platform_version: "2.1.0"
      responses:
        "200":
          description: Transaction intent created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionIntent"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestError"
        "403":
          description: API key is missing the required `TRANSACTION_INTENT_WRITE` scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      tags:
        - "Transaction Intents"
      summary: List transaction intents
      description: Retrieves a list of transaction intents.
      operationId: searchTransactionIntents

      parameters:
        - name: type
          in: query
          description: The type of transaction intent to filter by.
          schema:
            type: string
            enum:
              - CONFIRMED
              - CANCELED
            example: "CONFIRMED"
        - name: limit
          $ref: "#/components/parameters/limitParam"
        - name: starting_after
          $ref: "#/components/parameters/startingAfterParam"
      responses:
        "200":
          description: List of transaction intents
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TransactionIntent"
                  has_more:
                    type: boolean
                  total:
                    type: integer

  /v2/transaction_intents/{intent_id}:
    get:
      tags:
        - "Transaction Intents"
      summary: Retrieve a transaction intent
      description: |
        Retrieves the details of an existing transaction intent by `id`.

        **Required scope:** `TRANSACTION_INTENT_READ`
      operationId: getTransactionIntent
      x-required-scopes:
        - TRANSACTION_INTENT_READ

      parameters:
        - name: intent_id
          in: path
          required: true
          description: The unique identifier for the transaction intent.
          schema:
            type: string
            example: "3E4F0CCD-ACBF-42F3-A459-6DF92AF632D1"
      responses:
        "200":
          description: Transaction intent retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionIntent"
        "403":
          description: API key is missing the required `TRANSACTION_INTENT_READ` scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Transaction intent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionIntentFoundError"
    post:
      tags:
        - "Transaction Intents"
      summary: Update a transaction intent
      description: |
        Updates the details of the transaction intent associated with the supplied intent_id.

        **Required scope:** `TRANSACTION_INTENT_WRITE`
      operationId: updateTransactionIntent
      x-required-scopes:
        - TRANSACTION_INTENT_WRITE

      parameters:
        - name: intent_id
          in: path
          required: true
          description: The unique identifier for the transaction intent
          schema:
            type: string
            example: "3E4F0CCD-ACBF-42F3-A459-6DF92AF632D1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - amount
                - status
                - created_at
              properties:
                customer_id:
                  type: string
                  example: "D8CD2346-9A02-4ABB-A388-AB3DACC57DCF"
                amount:
                  type: integer
                  example: 100
                status:
                  $ref: "#/components/schemas/TransactionIntentStatus"
                currency:
                  $ref: "#/components/schemas/TransactionCurrency"
                network_transaction_id:
                  type: string
                  description: "The network's unique identifier for the transaction. Examples include Visa Transaction ID, Mastercard Trace ID, and American Express Network Reference ID"
                partner_transaction_id:
                  type: string
                  description: "The partner's unique transaction id"
                metadata:
                  type: object
                  description: Additional transaction intent data
                  additionalProperties: true
                  example:
                    platform_version: "2.1.0"
      responses:
        "200":
          description: Transaction intent updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionIntent"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestError"
        "403":
          description: API key is missing the required `TRANSACTION_INTENT_WRITE` scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v2/transactions/{transaction_id}:
    get:
      tags:
        - "Transactions"
      summary: Retrieve a transaction
      description: Retrieves the details of an existing transaction by `id`
      operationId: getTransaction

      parameters:
        - name: transaction_id
          in: path
          required: true
          description: The unique identifier for the transaction
          schema:
            type: string
            example: "4E6FE207-53E5-4EC0-BF51-5923BE5CEE2F"
        - name: expand
          $ref: "#/components/parameters/transactionExpandParam"
      responses:
        "200":
          description: Transaction retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Unsupported expand value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestError"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionNotFoundError"

  /v2/rewards:
    get:
      tags:
        - "Rewards"
      summary: Search for rewards
      operationId: searchRewards

      parameters:
        - name: transaction_event_id
          in: query
          description: "Reward associated to the transaction event"
          schema:
            type: string
