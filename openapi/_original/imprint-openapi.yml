    CreateIdvRequest:
      type: object
      properties:
        redirect_url:
          type: string
          description: >
            Where to send the applicant when identity verification completes
            or fails. Must be on your program's redirect allowlist, which
            Imprint configures with its verification provider; ask Imprint to
            add a URL before using it. A URL that is not allowlisted is
            rejected with `400`. Omit it to leave the applicant on the
            verification page when they finish. Query parameters added to this
            URL on arrival are not a decision: read the outcome from the
            application or its webhook.
          example: "https://partner.example.com/apply/idv-complete"

    IdvSession:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: >
            The hosted identity-verification URL to send the applicant to.
            It points at the application's one verification and stays the same
            until identity verification is finished, apart from the
            `redirect_url` you pass, which is included in it.
          example: "https://imprint.withpersona.com/verify?inquiry-id=inq_2CVZ4HvXFPVgjxM9ZwSm1ZbV&redirect-uri=https%3A%2F%2Fpartner.example.com%2Fapply%2Fidv-complete"

    AcceptOfferRequest:
      type: object
      required:
        - product_offer_id
      properties:
        product_offer_id:
          type: string
          format: uuid
          description: The `id` of an `OFFER_READY` entry in the application's `product_offers`.
          example: "31d9a0c4-77e2-4b58-9f16-8c3e5a2b0d74"
        card_design_id:
          type: string
          format: uuid
          description: >
            The card design for this product offer, from the designs available
            to the entry's `product_id`. For a single-product application it
            may be omitted in favor of the design selected via `PATCH` or the
            configuration's `default_card_design_id`.
          example: "8a2f41c6-90be-4d77-b1e3-5c7092da6f84"

    RateLimitedError:
      type: object
      description: >
        An action was requested again too soon. `retry_after_seconds` rounds up
        — truncating would report `0` with time still on the clock and send the
        caller straight into another rejection. The same value is on the
        `Retry-After` header; it is in the body as well so a client that already
        parses the JSON error can render a countdown without reaching for
        response headers.
      required:
        - type
        - message
        - retry_after_seconds
      properties:
        type:
          type: string
          example: "RESEND_TOO_SOON"
        message:
          type: string
          example: "A verification code was already sent; retry in 9 seconds"
        retry_after_seconds:
          type: integer
          example: 9

    IdempotencyConflictError:
      type: object
      description: |
        A keyed operation could not yet be replayed. Reuse the same key and
        request after `retry_after_seconds` for `IDEMPOTENCY_IN_PROGRESS`.
        `IDEMPOTENCY_KEY_REUSED` means the key was previously reserved for a
        different method, operation, target, action, or canonical request body;
        retry only with a new key for the genuinely new operation.
      required:
        - type
        - message
      properties:
        type:
          type: string
          enum:
            - IDEMPOTENCY_IN_PROGRESS
            - IDEMPOTENCY_KEY_REUSED
          example: "IDEMPOTENCY_IN_PROGRESS"
        message:
          type: string
          example: "The operation for this idempotency key is still in progress"
        retry_after_seconds:
          type: integer
          description: Present only for `IDEMPOTENCY_IN_PROGRESS`; matches the Retry-After header.
          example: 2

    NoPrefillMatchError:
      type: object
      description: >
        No identity record matched the verified phone number and the four SSN
        digits supplied. This is an expected outcome, not a fault: send the
        applicant to manual entry. The application is unchanged.
      required:
        - type
        - message
      properties:
        type:
          type: string
          example: "NO_PREFILL_MATCH"
        message:
          type: string
          example: "No prefill record matched the supplied details"

    ApplicationNotFoundError:
      type: object
      required:
        - type
        - message
      properties:
        type:
          type: string
          example: "APPLICATION_NOT_FOUND"
        message:
          type: string
          example: "No application found with id 7f3c1e20-4b8a-4e11-9c6d-2a5f0b7d3e91"

    SubmitBlockedError:
      type: object
      description: >
        Returned when submission is attempted with outstanding requirements.
        `blocking_requirements` is the subset of the application's requirements
        that is holding up submission.
      required:
        - type
        - message
        - blocking_requirements
      properties:
        type:
          type: string
          example: "SUBMIT_BLOCKED"
        message:
          type: string
          example: "2 requirements must be satisfied before this application can be submitted"
        blocking_requirements:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationRequirement"

    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - type
            - message
          properties:
            type:
              type: string
              description: The category of error being returned
              example: "BAD_REQUEST_ERROR"
            message:
              type: string
              description: A message describing the cause of the error
              example: "unsupported reward_type: INVALID, must be STATEMENT or DELAYED"

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        Basic HTTP authentication. Allowed headers-- Authorization: Basic
        <base64(api_key_id:api_key_secret)>
    bearerAuth:
      bearerFormat: auth-scheme
      description: >-
        Bearer HTTP authentication. Allowed headers-- Authorization: Bearer
        <api_key>
      scheme: bearer
      type: http
