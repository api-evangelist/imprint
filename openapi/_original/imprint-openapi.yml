                only the product the event concerns.
                Denormalized here so you can route without a follow-up fetch.
              items:
                type: string
                enum:
                  - CREDITCARD
                  - SECUREDCREDITCARD
                  - INSTALLMENT_LOAN
                  - SPENDCARD
              example:
                - CREDITCARD
                - SECUREDCREDITCARD
            reason_code:
              type: string
              description: |
                Why the application reached this status, present for `REJECTED`
                and `IDV_REQUIRED`. Denormalized here so you can route without a
                follow-up fetch.

                This vocabulary only ever grows — codes are never repurposed — so
                treat an unrecognised code as an unhandled default rather than an
                error.
              example: "CREDIT_FILE_FROZEN"
            created_at:
              type: string
              example: 2025-02-13T19:08:07.000Z
              description: the RFC-3339 timestamp when the application was created
            updated_at:
              type: string
              example: 2025-02-13T19:08:07.000Z
              description: the RFC-3339 timestamp when the application was last updated
            expires_at:
              type: string
              example: 2025-03-10T19:08:07.000Z
              description: >
                The RFC-3339 timestamp after which the application expires if it
                has not been completed. Omitted when not yet known, such as on the initial
                `IN_PROGRESS` / `EVALUATING` event.
            upgraded:
              type: boolean
              description: >
                Whether this application represents an upgrade/graduation of an
                existing account. Currently always `false`; a real value will be
                sourced once account graduation/upgrade is implemented.
              example: false
            customer_metadata:
              type: object
              description: A set of key-value pairs of metadata attached to the customer.
              additionalProperties:
                type: string
              example:
