    TransactionWebhookPayload:
      type: object
      properties:
        object:
          type: string
          description: >-
            The type of object associated with this webhook event. This field
            indicates what kind of resource has been created or updated.
          enum:
            - TRANSACTION
          example: TRANSACTION
        data:
          type: object
          properties:
            merchant_key:
              type: string
              description: >-
                Unique identifier for the merchant associated with this webhook
                event.
              example: MERCHANT_ABC
            transaction_id:
              type: string
              description: >-
                Unique identifier for the transaction. transaction_id remains
                the same throughout the lifecycle of a transaction (e.g., from
                APPROVED to CAPTURED or REFUNDED). It represents the overarching
                transaction instance.
              example: e2806932-5f1b-4518-8b15-156d773e9496
            event_id:
              type: string
              description: >-
                Unique identifier for a specific event that occurs within a
                transaction’s lifecycle. Transaction events correlated with a
                status (e.g., APPROVED, UPDATED, CAPTURED, REFUNDED), and every
                event is uniquely identified by an event_id.
              example: e2806932-5f1b-4518-8b15-156d773e9496
            intent_id:
              type: string
              nullable: true
              description: Unique identifier of the transaction intent.
              example: intent-12345
            payment_method_id:
              type: string
              description: Unique identifier of the payment method used.
              example: 7f754378-dd84-4a9a-b1ce-0646bb769c29
            customer_id:
              type: string
              description: Unique identifier of the customer.
              example: e0549550-90e9-4acb-b7e9-2e4738b7def2
            partner_customer_id:
              $ref: '#/components/schemas/PartnerCustomerId'
            status:
              $ref: '#/components/schemas/TransactionStatus'
            created_at:
              type: string
              format: date-time
              description: >-
                RFC 3339 timestamp indicating when the transaction was
                authorized.
              example: '2025-02-27T18:11:32.358Z'
            updated_at:
              type: string
              format: date-time
              nullable: true
              description: >-
                RFC 3339 timestamp indicating when the transaction was last
                updated.
              example: '2025-02-27T18:15:00.000Z'
            amount:
              type: integer
              description: >-
                Amount of the transaction in the smallest currency unit (e.g.,
                cents for USD).
              example: 5000
            currency:
              $ref: '#/components/schemas/TransactionCurrency'
            authorization_code:
              type: string
              nullable: true
              description: Code used to authorize the transaction.
              example: '645432'
            network_transaction_id:
              type: string
              nullable: true
              description: Unique transaction identifier assigned by the payment network.
              example: txn-789456
            purchase_method:
              $ref: '#/components/schemas/PurchaseMethod'
            merchant:
              $ref: '#/components/schemas/Merchant'
            customer_metadata:
              type: object
              description: A set of key-value pairs of metadata attached to the customer.
              additionalProperties:
                type: string
              example:
