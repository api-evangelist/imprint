  /v2/simulate_transaction_event:
    post:
      tags:
        - Simulate Transaction Event
      summary: Simulate transaction event in sandbox environment
      operationId: simulateTransactionEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payment_method_id
                - status
              properties:
                event_id:
                  type: string
                  description: Unique identifier of the event.
                  example: e2806932-5f1b-4518-8b15-156d773e9496
                transaction_id:
                  type: string
                  description: >-
                    Unique identifier of the transaction. Required to VOID,
                    UPDATE, CAPTURE, or REFUND a transaction
                  example: e2806932-5f1b-4518-8b15-156d773e9496
                payment_method_id:
                  type: string
                  description: Unique identifier of the payment method used.
                  example: 7f754378-dd84-4a9a-b1ce-0646bb769c29
                status:
                  $ref: '#/components/schemas/TransactionStatus'
                amount:
                  type: integer
                  description: >-
                    Amount of the transaction in the smallest currency unit
                    (e.g., cents for USD).
                  example: 5000
                currency:
                  $ref: '#/components/schemas/TransactionCurrency'
                authorization_code:
                  type: string
                  nullable: true
                  description: Code used to authorize the transaction.
                  example: '645432'
                network_transaction_id:
                  type: string
                  nullable: true
                  description: >-
                    Unique transaction identifier assigned by the payment
                    network.
                  example: txn-789456
                purchase_method:
                  $ref: '#/components/schemas/PurchaseMethod'
                merchant:
                  $ref: '#/components/schemas/Merchant'
      responses:
        '200':
          description: Transaction event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionEvent'
        '409':
          description: Transaction event can not be created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
  /v2/simulate_statement_reward:
    post:
      tags:
        - Simulate Statement Reward
      summary: Simulate Statement Reward
      description: Initiate a statement reward webhook to be sent in sandbox environment
      deprecated: true
      operationId: simulateStatementReward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
              properties:
                customer_id:
                  type: string
                  example: e2806932-5f1b-4518-8b15-156d773e9496
      responses:
        '200':
          description: Statement reward webhook initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  debugging_id:
                    type: string
                    description: >-
                      If you received an unexpected webhook or did not receive a
                      webhook, send debugging id to your imprint team
                    example: E777214A-2D11-4CAD-9E8F-E1BD71D9FE67
        '400':
          description: Product is not configured for statement rewards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Endpoint is only available in sandbox environments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v2/simulate_reward:
    post:
      tags:
        - Simulate Reward
      summary: Simulate Reward
      description: >-
        Initiate a reward webhook in sandbox. Specify the reward type to
        simulate processing of pending rewards.
      operationId: simulateReward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - reward_type
              properties:
                customer_id:
                  type: string
                  example: e2806932-5f1b-4518-8b15-156d773e9496
                reward_type:
                  type: string
                  enum:
                    - STATEMENT
                    - DELAYED
                  description: >-
                    The type of reward to simulate. Must match the product's
                    configured reward type.
                  example: DELAYED
      responses:
        '200':
          description: Reward webhook initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  debugging_id:
                    type: string
                    description: >-
                      If you received an unexpected webhook or did not receive a
                      webhook, send debugging id to your imprint team
                    example: E777214A-2D11-4CAD-9E8F-E1BD71D9FE67
        '400':
          description: >-
            Invalid reward_type or product is not configured for the specified
            reward type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Endpoint is only available in sandbox environments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: A simulation is already in progress for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v2/keys:
    post:
      tags:
        - Keys
      summary: Create an API Key
      description: Creates a new API key
      operationId: createKey
      responses:
        '200':
          description: API Key created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        '401':
          description: Unauthorized
    delete:
      tags:
        - Keys
      summary: Delete an API Key
      description: Deletes an existing API Key
      operationId: deleteKey
      responses:
        '200':
          description: API Key deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        '401':
          description: Unauthorized
