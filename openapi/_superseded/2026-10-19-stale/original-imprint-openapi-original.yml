              type: string
              description: The cadence used to evaluate streak progress.
              example: STATEMENT
            current_period:
              type: integer
              description: The 1-based index of the period the streak is currently on.
              example: 12
            completed_periods:
              type: integer
              description: The number of periods the customer has successfully completed.
              example: 12
            total_periods:
              type: integer
              description: The total number of periods required to complete the streak.
              example: 12
            current_period_start_at:
              type: string
              description: >-
                RFC-3339 timestamp (millisecond precision) when the current
                period opened. Omitted on the STREAK_FAILED event.
              example: '2026-05-01T12:00:00.000Z'
            current_period_end_at:
              type: string
              description: >-
                RFC-3339 timestamp (millisecond precision) when the current
                period closes. Omitted on the STREAK_FAILED event.
              example: '2026-05-31T12:00:00.000Z'
            benefits:
              type: array
              description: >-
                Partner-facing benefit identifiers to fulfill for the streak.
                Always present; populated only on the STREAK_COMPLETED event and
                empty on all other events.
              items:
                type: string
              example:
                - BENEFIT_1
            created_at:
              type: string
              description: >-
                RFC-3339 timestamp (millisecond precision) when the triggering
                event occurred. Present on every event.
              example: '2026-05-01T12:00:01.000Z'
            metadata:
              type: object
              additionalProperties: true
            customer_metadata:
              type: object
              description: A set of key-value pairs of metadata attached to the customer.
              additionalProperties:
                type: string
              example:
                loyalty_id: '840012345678'
                membership_tier: gold
    StreakEvent:
      type: string
      description: The streak lifecycle event being signalled.
      enum:
        - ENROLLED
        - PERIOD_COMPLETED
        - STREAK_COMPLETED
        - STREAK_FAILED
      example: STREAK_COMPLETED
    StreakStatus:
      type: string
      description: >-
        The status of the streak, derived from the event. ENROLLED and
        PERIOD_COMPLETED carry IN_PROGRESS; STREAK_COMPLETED carries COMPLETED;
        STREAK_FAILED carries FAILED.
      enum:
        - IN_PROGRESS
        - COMPLETED
        - FAILED
      example: COMPLETED
    AccountStatusWebhookPayload:
      type: object
      properties:
        object:
          type: string
          description: The type of object this webhook event relates to.
          enum:
            - ACCOUNT_STATUS
          example: ACCOUNT_STATUS
        data:
          type: object
          properties:
            merchant_key:
              type: string
              description: >-
                Unique identifier for the merchant associated with this webhook
                event.
              example: MERCHANT_ABC
            customer_id:
              type: string
              description: Imprint's unique identifier for the associated customer.
              example: 2EE24580-B97B-4949-A65C-929CCB9B9B8D
            partner_customer_id:
              $ref: '#/components/schemas/PartnerCustomerId'
            status:
              $ref: '#/components/schemas/AccountStatusValue'
            updated_at:
              type: string
              description: >-
                RFC-3339 timestamp when the account status transition took
                effect. May be backdated when the transition has an effective
                date earlier than delivery (e.g. a debt sale).
              example: '2026-05-01T12:00:00Z'
            customer_metadata:
              type: object
              description: A set of key-value pairs of metadata attached to the customer.
              additionalProperties:
                type: string
              example:
                loyalty_id: '840012345678'
                membership_tier: gold
    AccountStatusValue:
      type: string
      description: The customer's account status.
      enum:
        - CLOSED
      example: CLOSED
    RewardStatus:
      type: string
      enum:
        - PENDING
        - AVAILABLE
        - PENDING_DEDUCTION
        - DEDUCTED
      example: PENDING
    RewardType:
      type: string
      enum:
        - OFFER
        - TRANSACTION
        - ONE_TIME
        - STATEMENT
        - REFERRAL
      example: TRANSACTION
    Offer:
      type: object
      description: Offer marketing placement returned for a partner customer
      required:
        - id
        - is_prescreened
        - title
        - description
      properties:
        id:
          type: string
          description: The unique ID Imprint assigns to the offer placement
          example: 2ade1a36-b6f7-489b-a941-865c33f82f5a
        is_prescreened:
          type: boolean
          description: Indicates whether the offer is a prescreened offer
          example: true
        title:
          type: string
          description: Short, human-readable title for the offer
          example: 'Welcome Offer: Earn $25'
        description:
          type: string
          description: Full marketing copy for the offer
          example: >-
            Sign-up, accept your offer, and spend $500 in the first 90 days of
            becoming a cardholder to unlock your $25 welcome bonus. To qualify
            for the $25 bonus, you must make qualifying purchases totaling $500
            or more using your Company® Card within 90 days of account approval.
    TransactionCurrency:
      type: string
      description: >-
        The 3-character currency code of the amount in ISO 4217 format (e.g.,
        "USD")
      example: USD
    RewardCurrency:
      type: string
      description: >-
        The 3-character currency code of the amount in ISO 4217 format (e.g.,
        "USD") or a reward unit (e.g., "POINTS")
      example: POINTS
    Key:
      type: object
      description: Represents an API Key
      properties:
        key:
          type: string
          description: API Key value
          example: test_
        created_at:
          type: string
          description: the RFC-3339 date when the key was created
          example: 2025-02-13T19:08:07.000Z
        deleted_at:
          type: string
          description: the RFC-3339 date when the key was deleted
          example: 2025-02-13T19:08:07.000Z
    TransactionIntentStatus:
      type: string
      enum:
        - CONFIRMED
        - CANCELED
      example: CONFIRMED
    CardDesignID:
      type: string
      description: Imprint ID for the graphic design printed on the card
      example: 3b9c1f3e-52a0-44c1-b131-a7ab0099a214
    CardType:
      type: string
      description: The type of card
      enum:
        - PHYSICAL
        - VIRTUAL
        - UNIFIED
    OrderEvent:
      allOf:
        - $ref: '#/components/schemas/OrderEventBase'
    OrderEventBase:
      type: object
      required:
        - order_id
        - type
        - amount
        - network_transaction_id
      properties:
        order_event_id:
          type: string
          description: The ID of the order event
          example: 77f60af4-185e-4867-b113-34e3cf7c6acd
        order_id:
          type: string
          description: The ID of the order to which the event is related
          example: 77f60af4-185e-4867-b113-34e3cf7c6acd
        partner_event_id:
          type: string
          description: Partner's event identifier
          example: 7622c07d-eb2b-4345-a9a9-345d61d32bc2
        type:
          type: string
          enum:
            - CAPTURED
            - REFUNDED
          description: Type of order event
          example: CAPTURED
        amount:
          allOf:
            - $ref: '#/components/schemas/CurrencyAmount'
            - example: 274999
              description: Total event amount ($2,699.99 + $50.00)
        rewards_amount:
          allOf:
            - $ref: '#/components/schemas/CurrencyAmount'
            - example: 2500
              description: Total rewards amount for the event ($25 + $0)
        currency:
          type: string
          description: >-
            The 3-character currency code of the amount in ISO 4217 format
            (e.g., "USD")
          example: USD
        network_transaction_id:
          type: string
          description: Card network transaction identifier
          example: 615e3ba0-6b99-495b-ade4-1f584c40f376
        order_lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
          description: >-
            When provided, the API will require that the calculated sum of all
            the rates and rewards rates within (taking quantities into account)
            are equal to the `amount` and `rewards_amount`, respectively.

            It is important to note that the sums of all *event* amounts and
            *event* rewards amounts belonging to an order do not need to be
            equal to `total_order_amount` and `total_rewards_amount` in the
            order, as the data contained in events will serve as the final
            source of truth for the lifecycle of the order, as it actually
            transpired.
          example:
            - name: Couch Supreme
              product_url: www.restassured.com/couch-supreme
              quantity: 1
              rate: 274999
              rewards_rate: 2500
    OrderEventsResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderEvent'
          description: List of order events
        has_more:
          type: boolean
        total:
          type: integer
    Order:
      allOf:
        - $ref: '#/components/schemas/OrderBase'
    OrderBase:
      type: object
      required:
        - payment_method_id
        - total_order_amount
        - partner_order_id
      properties:
        id:
          type: string
          description: Unique identifier for the order
          example: 77f60af4-185e-4867-b113-34e3cf7c6acd
        customer_id:
          type: string
          description: Customer identifier
          example: 1bb0ab64-ed57-4f2f-bd8d-ab04d1a365c5
        payment_method_id:
          type: string
          description: Payment method identifier
          example: 0144ea84-3c39-4382-a37a-03c699b77646
        partner_order_id:
          type: string
          description: Partner's order identifier
          example: o-c8a1fe46bbff4a18ba1d
        merchant_id:
          type: string
          nullable: true
          description: Merchant identifier
          example: m-123456789
        merchant_name:
          type: string
          nullable: true
          description: Merchant name
          example: Rest Assured
        merchant_address:
          type: array
          items:
            $ref: '#/components/schemas/Address'
          description: List of merchant addresses
        order_lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
          description: >-
            An array of items that make up the order, used for the purpose of
            establishing the items, amounts, and rewards that are *expected* to
            be included in events sent to Imprint following order creation.

            Changes made to orders after the order is created can be implicitly
            communicated to Imprint through the event creation process following
            the creation of the order; modifying the order itself is not
            necessary. The set of events sent to Imprint after order creation
            serve as the final source of truth for transaction amounts, rewards,
            order lines, etc.

            When provided, the API will require that the calculated sum of all
            the rates and rewards rates within (taking quantities into account)
            are equal to the `total_order_amount` and `total_rewards_amount`,
            respectively.
          example:
            - name: Couch Supreme
              product_url: www.restassured.com/couch-supreme
              quantity: 1
              rate: 274999
              rewards_rate: 2500
        total_order_amount:
          allOf:
            - $ref: '#/components/schemas/CurrencyAmount'
            - example: 274999
              description: Total order amount ($2,699.99 + $50.00)
        total_rewards_amount:
          allOf:
            - $ref: '#/components/schemas/CurrencyAmount'
            - example: 2500
              description: Total rewards amount ($25 + $0)
        currency:
          type: string
          description: >-
            The 3-character currency code of the amount in ISO 4217 format
            (e.g., "USD")
          example: USD
        created_at:
          type: string
          format: date-time
          nullable: true
          description: The RFC-3339 timestamp when the order was created
          example: '2025-02-13T19:08:07Z'
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: The RFC-3339 timestamp when the order was last updated
          example: '2025-02-13T19:08:07Z'
    OrderLine:
      type: object
      required:
        - name
        - quantity
        - rate
        - rewards_rate
      properties:
        name:
          type: string
          description: Name of the order line item
          example: Couch Supreme
        product_url:
          type: string
          nullable: true
          description: URL to the product
          example: www.restassured.com/couch-supreme
        quantity:
          type: integer
          description: Quantity of the item
          example: 1
        rate:
          allOf:
            - $ref: '#/components/schemas/CurrencyAmount'
            - example: 274999
        rewards_rate:
          allOf:
            - $ref: '#/components/schemas/CurrencyAmount'
            - example: 2500
    OrdersResponse:
      type: object
      required:
        - orders
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
          description: List of orders
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - type
            - message
          properties:
            type:
              type: string
              description: The category of error being returned
              example: BAD_REQUEST_ERROR
            message:
              type: string
              description: A message describing the cause of the error
              example: 'unsupported reward_type: INVALID, must be STATEMENT or DELAYED'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        Basic HTTP authentication. Allowed headers-- Authorization: Basic
        <base64(api_key_id:api_key_secret)>
    bearerAuth:
      bearerFormat: auth-scheme
      description: >-
        Bearer HTTP authentication. Allowed headers-- Authorization: Bearer
        <api_key>
      scheme: bearer
      type: http
