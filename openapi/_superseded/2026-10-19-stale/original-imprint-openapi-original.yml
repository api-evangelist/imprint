components:
  parameters:
    customerIdParam:
      name: customer_id
      in: path
      required: true
      description: The unique identifier for the Imprint customer
      schema:
        type: string
        example: 2EE24580-B97B-4949-A65C-929CCB9B9B8D
    emailParam:
      name: email
      in: query
      schema:
        type: string
        format: email
        example: john@doe.com
    limitParam:
      name: limit
      in: query
      description: Limits the number of returned results
      schema:
        type: integer
        minimum: 1
        default: 10
        format: int32
    startingAfterParam:
      name: starting_after
      in: query
      description: >-
        A cursor for use in pagination. An id that defines your place in the
        list.
      schema:
        type: string
    minAmountParam:
      name: min_amount
      in: query
      description: Filters results based on minimum amount
      schema:
        type: integer
        minimum: 0
        default: 0
        format: int32
    maxAmountParam:
      name: max_amount
      in: query
      description: Filters results based on maximum amount
      schema:
        type: integer
        format: int32
  schemas:
    CustomerListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        has_more:
          type: boolean
        total:
          type: integer
    CustomerProgramStatus:
      type: string
      description: Status of a customer within a card program.
      enum:
        - OPEN
        - CLOSED
    PartnerCustomerId:
      type: string
      description: The unique identifier for the customer in the partner's system
      example: PARTNER_USER_456
    Merchant:
      type: object
      properties:
        network_id:
          type: string
          description: Unique identifier of the merchant assigned by the payment network.
          example: '234923454545'
        name:
          type: string
          description: Name of the merchant where the transaction occurred.
          example: Target
        category:
          type: string
          nullable: true
          description: Name of the merchant category.
          example: Grocery Stores
        category_code:
          type: string
          nullable: true
          description: Code associated with the merchant category.
          example: '5411'
        address:
          $ref: '#/components/schemas/Address'
          type: object
    PurchaseMethod:
      type: string
      enum:
        - CHIP
        - CONTACTLESS
        - KEYEDIN
        - ONLINE
        - SWIPE
        - QRCODE
        - OCR
        - UNKNOWN
      nullable: true
      description: How the purchase was completed.
      example: CHIP
    TransactionStatus:
      type: string
      enum:
        - APPROVED
        - UPDATED
        - VOIDED
        - CAPTURED
        - REFUNDED
      example: APPROVED
    Address:
      type: object
      description: Mailing address information
      properties:
        street_line1:
          type: string
          description: Primary street address
          example: 123 Main St
        street_line2:
          type: string
          description: Secondary street address (apartment, suite, etc.)
          example: Apt 4B
        city:
          type: string
          description: City name
          example: San Francisco
        state:
          type: string
          description: State or province
          example: CA
        postal_code:
          type: string
          description: ZIP or postal code
          example: '94105'
        country:
          type: string
          description: ISO-3166-1 alpha-3 Country Code
          example: USA
    CurrencyAmount:
      type: integer
      description: Amount in the smallest currency unit (e.g., cents for USD)
    DateOfBirth:
      type: object
      description: Customer's date of birth
      properties:
        year:
          type: integer
          description: Year of birth
          minimum: 1900
          example: 1990
        month:
          type: integer
          description: Month of birth
          minimum: 1
          maximum: 12
          example: 1
        day:
          type: integer
          description: Day of birth
          minimum: 1
          maximum: 31
          example: 1
    Customer:
      type: object
      description: Represents a customer in the Imprint system
      required:
        - id
      properties:
        id:
          type: string
          description: Unique identifier for the customer
          example: 9B5E1EE0-2E1C-46E7-81B9-3C3917204BE4
        email:
          type: string
          format: email
          description: Customer's email address
          example: customer@example.com
        phone:
          type: string
          description: Customer's phone number in E.164 format
          example: '+14155552671'
        statuses:
          type: object
          description: >-
            Map of the customer's enrolled card program name to the customer's
            status.
          additionalProperties:
            $ref: '#/components/schemas/CustomerProgramStatus'
          example:
            Card Program Name: OPEN
        first_name:
          type: string
          description: The customer's first name.
          example: John
        last_name:
          type: string
          description: The customer's last name.
          example: Doe
        preferred_language:
          type: string
          description: Customer's preferred language code as defined by ISO 639-1
          example: en
        ssn4:
          type: string
          description: Customer's Social Security Number in 4 digits
          example: '1234'
        date_of_birth:
          $ref: '#/components/schemas/DateOfBirth'
        address:
          $ref: '#/components/schemas/Address'
        partner_customer_id:
          $ref: '#/components/schemas/PartnerCustomerId'
        metadata:
          type: object
          description: >-
            Set of key-value pairs for storing additional information about the
            customer.
          additionalProperties: true
          example:
            preferred_language: en
        created_at:
          type: string
          description: the RFC-3339 date when the customer was created
          example: 2025-02-13T19:08:07.000Z
        updated_at:
          type: string
          description: the RFC-3339 date when the customer was created
          example: 2025-02-13T19:08:07.000Z
    CustomerAccountHistory:
      type: object
      description: A Customer's account history with the partner
      properties:
        email:
          type: string
          format: email
          description: Customer's email address
          example: customer@example.com
        phone:
          type: string
          description: Customer's phone number in E.164 format
          example: '+14155552671'
        first_name:
          type: string
          description: The customer's first name
          example: John
        last_name:
          type: string
          description: The customer's last name
          example: Doe
        preferred_language:
          type: string
          description: Customer's preferred language code as defined by ISO 639-1
          example: en
        address:
          $ref: '#/components/schemas/Address'
        account_tenure:
          type: integer
          description: The customer's account tenure with the partner, in months
          example: 13
        ltv_amount:
          type: integer
          description: >-
            The Life Time Value for the customer's account, in the min currency
            unit (cents for USD)
          example: 34000
        ltv_currency:
          type: string
          description: The 3 char currency code of the amount in iso-4217
          example: USD
        loyalty_tier:
          type: string
          description: The customer's current loyalty tier
          example: GOLD
        account_created_at:
          type: string
          description: >-
            The RFC-3339 timestamp when the customer's account was created with
            the partner
          example: 2025-02-13T19:08:07.000Z
        transaction_count:
          type: integer
          description: >-
            The number of lifetime transactions the customer has made with the
            partner
          example: 100
    CustomerSession:
      type: object
      description: Represents a session created on behalf of an Imprint customer
      required:
        - id
        - client_secret
        - expires_at
      properties:
        id:
          type: string
          example: 2EE24580-B97B-4949-A65C-929CCB9B9B8D
          description: The unique ID Imprint assigns to the session.
        client_secret:
          type: string
          example: QzMyNzg4QzgtNEUwOS00QkU4LThDMjEtMkU5OUQ3QzkwRDhGCg==
          description: >-
            Not to be logged or stored. Provide this one time use token to the
            Imprint SDK or other client side code to allow the customer access
            to edit their own account or apply
        expires_at:
          type: string
          description: the RFC-3339 timestamp when the `client_secret` will expire.
          example: 2025-02-13T19:08:07.000Z
        metadata:
          type: object
          description: >-
            Set of key-value pairs for storing additional information about the
            customer session.
          additionalProperties: true
          example:
            store_number: '123'
        customer_metadata:
          type: object
          description: >-
            A set of key-value pairs attached to the customer. These values will
            be included in webhook event payloads for the partner to receive
            information about the customer.
          additionalProperties:
            type: string
          example:
            loyalty_id: '840012345678'
            membership_tier: gold
        source:
          type: string
          description: The source where the session was initiated
          example: web_signup
    CustomerLink:
      type: object
      required:
        - customer_id
        - partner_customer_id
        - status
        - created_at
      properties:
        customer_id:
          type: string
          example: 9B5E1EE0-2E1C-46E7-81B9-3C3917204BE4
          description: The ID of the Imprint customer
        partner_customer_id:
          $ref: '#/components/schemas/PartnerCustomerId'
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          example: ACTIVE
          description: Status of the linked relationship
        created_at:
          type: string
          description: the RFC-3339 timestamp when the link was created at.
          example: 2025-02-13T19:08:07.000Z
        updated_at:
          type: string
          description: the RFC-3339 timestamp when the link was last updated.
          example: 2025-02-13T19:08:07.000Z
        metadata:
          type: object
          description: Additional linking metadata
          additionalProperties: true
          example:
            store_id: store_789
            platform_version: 2.1.0
    PaymentMethod:
      type: object
      required:
        - id
        - type
        - customer_id
        - created_at
        - status
        - metadata
      properties:
        id:
          type: string
          example: DCBFC736-2286-42DD-897D-160DCA80AED2
          description: The unique ID Imprint assigns to the payment method.
        type:
          type: string
          description: The type of payment method
          enum:
            - CARD
            - BANK_ACCOUNT
            - LOAN
        customer_id:
          type: string
          description: The `id` of the Imprint customer that the payment method belongs to.
          example: B40A789E-BD46-4BB9-B63E-F9919582694C
        card:
          type: object
          description: >-
            When payment method is a `CARD` type, this object will have card
            specific data.
          required:
            - last4
            - brand
          properties:
            last4:
              type: string
              example: '1234'
              minLength: 4
              maxLength: 4
              description: The last 4 digits of the card PAN
            network:
              type: string
              description: Name of the card issuer
              enum:
                - VISA
                - MASTERCARD
                - AMEX
                - ''
            card_type:
              $ref: '#/components/schemas/CardType'
            card_design_id:
              $ref: '#/components/schemas/CardDesignID'
            exp_month:
              type: string
              description: The month the card expires (MM format).
              example: '06'
            exp_year:
              type: string
              description: The year the card expires (YYYY format).
              example: '2027'
            pci_details:
              type: object
              description: >-
                The pci details of the returned card. Only verified PCI
                compliant partners will be able to retrieve pci details in
                production environments.
              properties:
                pan:
                  type: string
                  description: >-
                    The unique 16-digit number printed on the front of a payment
                    card, used to identify the cardholder's account.
                  example: '5105105105105100'
                exp_month:
                  type: string
                  description: The month the card expires
                  example: '06'
                exp_year:
                  type: string
                  description: The year the card expires
                  example: '26'
                cvv:
                  type: string
                  description: >-
                    A three- or four-digit security code used to verify
                    card-not-present transactions and prevent fraud.
                  example: '123'
            tokens:
              type: array
              description: >-
                Payment method tokens that are defined by a third-party provider
                are included in this array by Imprint.
              items:
                $ref: '#/components/schemas/PaymentMethodToken'
        bank_account:
          type: object
          description: >-
            When payment method is a `BANK_ACCOUNT` type, this object will have
            bank account specific data.
          required:
            - last4
            - routing_number
            - bank_name
          properties:
            last4:
              type: string
              example: '1234'
              description: Last 4 numbers of the account.
              minLength: 4
              maxLength: 4
            routing_number:
              type: string
              description: The bank routing number assigned to this account.
            bank_name:
              type: string
              example: Wells Fargo
              description: Name of the banking institution
            account_type:
              type: string
              description: Type of the account.
              enum:
                - CHECKING
                - SAVINGS
        loan:
          type: object
          description: >-
            When payment method is a `LOAN` type, this object will have loan
            specific data.
          required:
            - amount
            - term_months
          properties:
            amount:
              type: integer
              description: Amount in min units.
              example: 10000
            currency:
              $ref: '#/components/schemas/TransactionCurrency'
            remaining_balance:
              type: integer
              description: remaining unspent balance on the loan
            term_months:
              type: integer
              description: Length of the loan term in months
              example: 12
            apr:
              type: string
              description: Annual percentage rate of the loan in floating point
              example: '5.89'
            loan_status:
              type: string
              description: Current status of the loan
              enum:
                - PENDING
                - APPROVED
                - REJECTED
                - ACTIVE
                - CLOSED
        created_at:
          type: string
          description: the RFC-3339 timestamp when the payment method was created
          example: 2025-02-13T19:08:07.000Z
        updated_at:
          type: string
          description: the RFC-3339 timestamp when the payment method was last updated
          example: 2025-02-13T19:08:07.000Z
        status:
          type: string
          description: Current status of the payment method
          enum:
            - ACTIVE
            - INACTIVE
            - CANCELED
        metadata:
          type: object
          additionalProperties: true
          description: Additional metadata for the payment method
          example:
            platform_version: 2.1.0
    PaymentMethodToken:
      type: object
