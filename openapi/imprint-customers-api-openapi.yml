          example: 'Transaction intent not found for provided ID: txn_123'
        param:
          type: string
          description: The param causing the error.
          example: transaction_id
    RewardCategoryType:
      type: string
      enum:
      - ON_MERCHANT
      - OFF_MERCHANT
    Merchant:
      type: object
      properties:
        network_id:
          type: string
          description: Unique identifier of the merchant assigned by the payment network.
          example: '234923454545'
        name:
          type: string
          description: Name of the merchant where the transaction occurred.
          example: Target
        category:
          type: string
          nullable: true
          description: Name of the merchant category.
          example: Grocery Stores
        category_code:
          type: string
          nullable: true
          description: Code associated with the merchant category.
          example: '5411'
        address:
          $ref: '#/components/schemas/Address'
          type: object
    InvalidRequestError:
      type: object
      properties:
        path:
          type: string
          description: The path of the endpoint returning the error
          example: /v2/customers
        details:
          type: array
          items:
            type: string
          description: The details of the error being returned
          example:
          - 'email: must be a well-formed email address'
        error:
          type: string
          description: The category of error being returned
          example: Bad Request
        status:
          type: integer
          description: The HTTP status code of the error
          example: 400
        timestamp:
          type: string
          description: The timestamp that the error occurred
          example: '2025-01-20T18:18:22.923+00:00'
    CustomerProgramStatus:
      type: string
      description: Status of a customer within a card program.
      enum:
      - OPEN
      - CLOSED
  parameters:
    startingAfterParam:
      name: starting_after
      in: query
      description: A cursor for use in pagination. An id that defines your place in the list.
      schema:
        type: string
    accountIdParam:
      name: account_id
      in: path
      required: true
      description: The unique identifier for the account, as returned by list accounts
      schema:
        type: string
        example: 7C1F9A34-2D6B-4E58-8A03-B15E7D9C4620
    localeParam:
      name: locale
      in: query
      required: false
      description: 'Locale for translated category copy. English (`en`) is used when omitted

        or unsupported; Spanish (`es`) and regional variants such as `es-MX` are

        also supported.

        '
      schema:
        type: string
        default: en
      example: en
    transactionExpandParam:
      name: expand
      in: query
      required: false
      style: form
      explode: false
      description: 'Related data to include on each transaction, as a comma-separated list. Supported values:

        `events` — the transaction''s lifecycle events (authorization, captures, refunds, confirmed disputes),

        each with the same `event_id` delivered in the Transaction Event Notification;

        `events.reward` — the events, each with the `reward` it earned or deducted (implies `events`).

        Omit to receive the transaction without events. Unknown values return 400. See

        [Retrieve a transaction''s events](https://docs.imprint.co/guide-event-notifications#retrieve-a-transactions-events).

        '
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TransactionExpand'
      example:
      - events
    customerIdParam:
      name: customer_id
      in: path
      required: true
      description: The unique identifier for the Imprint customer
      schema:
        type: string
        example: 2EE24580-B97B-4949-A65C-929CCB9B9B8D
    limitParam:
      name: limit
      in: query
      description: Limits the number of returned results
      schema:
        type: integer
        minimum: 1
        default: 10
        format: int32
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'Basic HTTP authentication. Allowed headers-- Authorization: Basic <base64(api_key_id:api_key_secret)>'
    bearerAuth:
      bearerFormat: auth-scheme
      description: 'Bearer HTTP authentication. Allowed headers-- Authorization: Bearer <api_key>'
      scheme: bearer
      type: http
