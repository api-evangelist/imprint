        customer_id:
          type: string
          example: 9B5E1EE0-2E1C-46E7-81B9-3C3917204BE4
        payment_method_id:
          type: string
          description: The `payment_method_id` that this `transaction_intent` was executed with.
          example: DCBFC736-2286-42DD-897D-160DCA80AED2
        amount:
          type: integer
          description: Currency amount
          example: 10000
        currency:
          $ref: '#/components/schemas/TransactionCurrency'
        status:
          $ref: '#/components/schemas/TransactionIntentStatus'
        network_transaction_id:
          type: string
          description: The network's unique identifier for the transaction. Examples include Visa Transaction ID, Mastercard Trace ID, and American Express Network Reference ID
        partner_transaction_id:
          type: string
          description: The partner's unique transaction id
        created_at:
          type: string
          description: the RFC-3339 timestamp when the transaction intent was created
          example: 2025-02-13 19:08:07+00:00
        updated_at:
          type: string
          description: the RFC-3339 timestamp when the transaction intent was last updated
          example: 2025-02-13 19:08:07+00:00
        metadata:
          type: object
          description: Additional transaction intent data
          additionalProperties: true
          example:
            platform_version: 2.1.0
    Reward:
      type: object
      required:
      - id
      - customer_id
      - amount
      - status
      - type
      - created_at
      properties:
        id:
          type: string
          example: 2EE24580-B97B-4949-A65C-929CCB9B9B8D
        customer_id:
          type: string
          example: 9B5E1EE0-2E1C-46E7-81B9-3C3917204BE4
        transaction_event_id:
          type: string
          description: transaction that generated this reward, if applicable.
          example: E777214A-2D11-4CAD-9E8F-E1BD71D9FE67
        amount:
          type: integer
          description: reward amount in min units.
        type:
          $ref: '#/components/schemas/RewardType'
        currency:
          $ref: '#/components/schemas/RewardCurrency'
        status:
          $ref: '#/components/schemas/RewardStatus'
        created_at:
          type: string
          description: the RFC-3339 timestamp when the reward was created
          example: 2025-02-13 19:08:07+00:00
        updated_at:
          type: string
          description: the RFC-3339 timestamp when the reward was last updated
          example: 2025-02-13 19:08:07+00:00
        metadata:
          type: object
          additionalProperties: true
          example:
            platform_version: 2.1.0
    CardDesignID:
      type: string
      description: Imprint ID for the graphic design printed on the card
      example: 3b9c1f3e-52a0-44c1-b131-a7ab0099a214
    PaymentMethodToken:
      type: object
      required:
      - type
      - token
      - created_at
      - updated_at
      properties:
        type:
          type: string
          enum:
          - ADYEN
          - APPLE_WALLET
          - CYBERSOURCE
          - WORLDPAY
        token:
          type: string
          description: The token, as defined by the processor
        pan_reference_id:
          type: string
          description: An ID that represents the PAN and is defined by the processor
        expires_at:
          type: string
          description: Only present for tokens that expire. If this field is absent, the token has no expiration and no action is needed. When present, this is the RFC-3339 timestamp after which the token can no longer be used. A timestamp in the past means the token is stale and should not be used. Retrieving the payment method refreshes expired tokens where possible; if a newly retrieved token's `expires_at` is still in the past, it cannot be used.
          example: 2025-02-14 19:08:07+00:00
        created_at:
          type: string
          description: the RFC-3339 timestamp when the payment method was created
          example: 2025-02-13 19:08:07+00:00
        updated_at:
          type: string
          example: 2025-02-13 19:08:07+00:00
          description: the RFC-3339 timestamp when the payment method was updated
    TransactionExpand:
      type: string
      description: Related data that can be included on a transaction with the `expand` query parameter. `events` adds the transaction's lifecycle events; `events.reward` adds the events and, on each event, the reward it earned or deducted.
      enum:
      - events
      - events.reward
      example: events
    Transaction:
      type: object
      required:
      - id
      - customer_id
      - payment_method_id
      - amount
      - currency
      - status
      - network_transaction_id
      - created_at
      properties:
        id:
          type: string
          example: E777214A-2D11-4CAD-9E8F-E1BD71D9FE67
        intent_id:
          type: string
          description: Reference to the original transaction intent
          example: 5B30532B-5B5B-4826-8DE2-429C57B705FD
        customer_id:
          type: string
          description: The imprint customer ID for the transaction
          example: 9B5E1EE0-2E1C-46E7-81B9-3C3917204BE4
        authorization_code:
          type: string
          description: Code authorizing the transaction.
          example: ABCD
        payment_method_id:
          type: string
          description: Identifies the payment method used for the transaction
          example: DCBFC736-2286-42DD-897D-160DCA80AED2
        purchase_method:
          $ref: '#/components/schemas/PurchaseMethod'
        amount:
          type: integer
          description: Transaction amount in min units.
        currency:
          $ref: '#/components/schemas/TransactionCurrency'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        network_transaction_id:
          type: string
          description: The network's unique identifier for the transaction. Examples include Visa Transaction ID, Mastercard Trace ID, and American Express Network Reference ID
        partner_transaction_id:
          type: string
          description: The partner's unique transaction id
        created_at:
          type: string
          description: the RFC-3339 timestamp when the transaction was created
          example: 2025-02-13 19:08:07+00:00
        updated_at:
          type: string
          description: the RFC-3339 timestamp when the transaction was last updated
          example: 2025-02-13 19:08:07+00:00
        merchant:
          $ref: '#/components/schemas/Merchant'
        metadata:
          type: object
          additionalProperties: true
          example:
            platform_version: 2.1.0
        events:
          type: array
          description: Events in the transaction's lifecycle, oldest first. Present only when requested with `expand=events`.
          items:
            $ref: '#/components/schemas/TransactionLifecycleEvent'
    RewardCurrency:
      type: string
      description: The 3-character currency code of the amount in ISO 4217 format (e.g., "USD") or a reward unit (e.g., "POINTS")
      example: POINTS
    PurchaseMethod:
      type: string
      enum:
      - CHIP
      - CONTACTLESS
      - KEYEDIN
      - ONLINE
      - SWIPE
      - QRCODE
      - OCR
      - UNKNOWN
      nullable: true
      description: How the purchase was completed.
      example: CHIP
    Statement:
      type: object
      description: 'One closed billing cycle. Amounts are integers in the smallest currency

        unit and are signed the way a card statement reads: charges to the

        customer are positive, money credited back to them is negative.


        Every amount is optional. Ledger records only the lines that had activity

        in the cycle, so a quiet month omits most of them rather than reporting

        them as `0`.

        '
      required:
      - statement_id
      - customer_id
      - account_id
      - as_of
      properties:
        statement_id:
          type: string
          description: The unique identifier for the statement
          example: 8A31B2C0-4F6D-4A21-9E3B-5C1D0F7A2B84
        customer_id:
          type: string
          description: The unique identifier for the customer
          example: 2EE24580-B97B-4949-A65C-929CCB9B9B8D
        account_id:
          type: string
          description: The unique identifier for the account the statement belongs to
          example: 7C1F9A34-2D6B-4E58-8A03-B15E7D9C4620
        period_start_date:
          type: string
          description: RFC-3339 timestamp of the first day of the billing cycle
          example: '2026-05-16T00:00:00Z'
        period_end_date:
          type: string
          description: 'RFC-3339 timestamp when the billing cycle closed. This is the

            statement date.

            '
          example: '2026-06-15T00:00:00Z'
        due_date:
          type: string
          description: RFC-3339 timestamp when payment for this statement is due
          example: '2026-07-10T00:00:00Z'
        pdf_url:
          type: string
          description: 'A pre-signed link to the statement PDF — the same document the

            cardholder sees. The link expires one hour after this response is

            issued, so treat it as a redirect target or an immediate download

            rather than something to persist: a stored copy will stop working,

            and re-reading the statement is how you get a fresh one.


            Omitted when the document is not available. A statement''s PDF is

            rendered shortly after its cycle closes, so the newest statement can

            appear here before its document does; the rest of the statement is

            still accurate.

            '
          example: https://imprint-statements.s3.us-east-1.amazonaws.com/statements/8A31B2C0.pdf?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Expires=3600
        currency:
          $ref: '#/components/schemas/TransactionCurrency'
        statement_balance:
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
          description: 'The balance owed when the cycle closed. Negative if the customer had

            paid ahead.

            '
        minimum_due:
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
          description: 'The minimum payment required by `due_date` to keep the account

            current.

            '
        previous_balance:
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
          description: The balance carried over from the previous cycle.
        purchases:
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
          description: Total purchases posted during the cycle.
        payments:
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
          description: 'Total payments received during the cycle. Negative, because a payment

            reduces what the customer owes.

            '
        credits:
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
          description: Total credits applied during the cycle. Negative.
        refunds:
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
          description: Total refunds posted during the cycle. Negative.
        interest:
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
          description: Interest charged during the cycle.
        fees:
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
          description: Fees charged during the cycle.
        overdue_amount:
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
          description: 'The portion of `statement_balance` that was already past due when the

            cycle closed. `0` on a current account.

            '
        as_of:
          type: string
          description: 'RFC-3339 timestamp of when this statement was read, which is when the

            request was served — not when the cycle closed (that is

            `period_end_date`). Every statement in a page carries the same value.


            A closed statement''s figures do not change, but two things about it

            do: servicing can hide a statement, which drops it from later reads,

            and `pdf_url` is only valid for an hour from this instant. Use it to

            label or expire a cached copy.

            '
          example: '2026-08-27T14:22:31Z'
    CurrencyAmount:
      type: integer
      description: Amount in the smallest currency unit (e.g., cents for USD)
    SpecialRewardCategory:
      type: object
      required:
      - name
