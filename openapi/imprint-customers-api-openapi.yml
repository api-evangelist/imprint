openapi: 3.2.0
info:
  title: Public Imprint Customers API
  version: '2.0'
servers:
- url: https://dev.sbx.imprint.co
  description: Imprint public api sandbox
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Customers
paths:
  /v2/customers:
    get:
      tags:
      - Customers
      summary: Search for customers
      operationId: searchCustomers
      parameters:
      - name: partner_customer_id
        in: query
        description: The unique identifier for the customer in the partner's system
        schema:
          $ref: '#/components/schemas/PartnerCustomerId'
      - name: limit
        $ref: '#/components/parameters/limitParam'
      - name: starting_after
        $ref: '#/components/parameters/startingAfterParam'
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
    post:
      tags:
      - Customers
      summary: Search for customers
      operationId: searchCustomersPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                partner_customer_id:
                  $ref: '#/components/schemas/PartnerCustomerId'
                ssn:
                  description: The ssn of the customer without hyphens
                  example: '123456789'
                  type: string
                date_of_birth:
                  $ref: '#/components/schemas/DateOfBirth'
                limit:
                  description: Limits the number of returned results
                  type: integer
                  minimum: 1
                  default: 10
                  format: int32
                starting_after:
                  description: A cursor for use in pagination. An id that defines your place in the list.
                  type: string
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
  /v2/customers/{customer_id}:
    get:
      tags:
      - Customers
      summary: Retrieve a customer
      description: 'Retrieves the details of an existing customer by ID


        **Optional scope:** `AUTHORIZED_USER_READ`. Without it the request still succeeds, but `authorized_users` is omitted from the response.'
      operationId: getCustomer
      x-optional-scopes:
      - AUTHORIZED_USER_READ
      parameters:
      - name: customer_id
        in: path
        required: true
        description: The unique identifier for the customer
        schema:
          type: string
          example: BBB815E9-F654-438D-9AD3-3F7BB8136FC0
      responses:
        '200':
          description: Customer retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerNotFoundError'
  /v2/customers/{customer_id}/accounts:
    get:
      tags:
      - Customers
      summary: List a customer's accounts
      description: 'Lists the accounts a customer holds with your program, each with the

        `account_id` needed to read it in detail and the type of product it is.


        Scoped to the product your API key is issued for, so it never returns an

        account a customer holds with another program. A customer who has no

        account with your program returns `404`.


        **Required scope:** `ACCOUNT_READ`'
      operationId: listAccounts
      x-required-scopes:
      - ACCOUNT_READ
      parameters:
      - name: customer_id
        in: path
        $ref: '#/components/parameters/customerIdParam'
      responses:
        '200':
          description: The customer's accounts
          content:
            application/json:
              schema:
                type: object
                required:
                - accounts
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountSummary'
        '403':
          description: API key is missing the required `ACCOUNT_READ` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerNotFoundError'
  /v2/customers/{customer_id}/accounts/{account_id}:
    get:
      tags:
      - Customers
      summary: Get customer's account
      description: 'Returns the servicing snapshot for one of a customer''s card accounts:

        account status, credit limit and available credit, the amounts they owe,

        the statement due date, and the APR.


        Every amount is a positive integer in the smallest currency unit and

        represents what the customer owes. A customer who owes nothing — or who

        is in credit — reads as `0` rather than a negative number.


        Per-statement figures — the statement balance, the minimum due, and

        interest — are not on this response. Read them from the statements API.


        `as_of` is when the snapshot was calculated, which is when the request

        was served. It is the instant the figures were true, and what a cached

        copy should be labelled with.


        A secured account whose security deposit has not been funded reads as

        `PENDING_FUNDING` and carries status and `as_of` alone: it has no credit

        line yet, so there is no credit limit, balance, due date or APR to

        report. This endpoint answers whether the account is usable now, not

        where the application got to — the deposit amount, the offer terms and

        the deadline to fund by are on `GET /v2/applications/{application_id}`,

        whose `product_offers[].result` is `ACCEPTED_PENDING_ACTION` for the

        same account.


        **Required scope:** `ACCOUNT_READ`'
      operationId: getAccount
      x-required-scopes:
      - ACCOUNT_READ
      parameters:
      - name: customer_id
        in: path
        $ref: '#/components/parameters/customerIdParam'
      - name: account_id
        in: path
        $ref: '#/components/parameters/accountIdParam'
      responses:
        '200':
          description: Customer account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '403':
          description: API key is missing the required `ACCOUNT_READ` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'The customer was not found, or the account does not belong to them.

            `type` distinguishes the two: `CUSTOMER_NOT_FOUND_ERROR` means we hold

            no record of the customer, `ACCOUNT_NOT_FOUND_ERROR` means the

            `account_id` is not one of theirs.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerNotFoundError'
  /v2/customers/{customer_id}/accounts/{account_id}/rewards_categories:
    get:
      tags:
      - Customers
      summary: List an account's reward categories
      description: 'Returns the account program''s standard earning categories and active

        signup categories. The response is assembled from the same live product,

        accrual, and offer configuration used by Imprint''s application and

        servicing experiences; it is not read from static rewards assets.


        `earn_rate` is the configured exchange rate as a decimal string: reward

        units earned per one transaction-currency unit, in the currency named by

        `currency`. Its decimal places carry the precision the rate is

        configured with.


        **Required scope:** `ACCOUNT_READ`'
      operationId: listRewardCategories
      x-required-scopes:
      - ACCOUNT_READ
      parameters:
      - name: customer_id
        in: path
        $ref: '#/components/parameters/customerIdParam'
      - name: account_id
        in: path
        $ref: '#/components/parameters/accountIdParam'
      - $ref: '#/components/parameters/localeParam'
      responses:
        '200':
          description: Reward categories and earn rates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardCategoriesResponse'
        '403':
          description: API key is missing the required `ACCOUNT_READ` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'The customer was not found, or the account does not belong to them.

            `type` distinguishes the two cases.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerNotFoundError'
  /v2/customers/{customer_id}/accounts/{account_id}/statements:
    get:
      tags:
      - Customers
      summary: List an account's statements
      description: 'Returns the account''s closed billing statements, newest first. A

        statement appears here once its cycle has closed; the cycle in progress

        is not a statement yet — read the account itself for where the customer

        stands today.


        Amounts follow the convention on a card statement: what the customer was

        charged is positive and what was credited back to them is negative. So

        `purchases`, `interest`, and `fees` are positive, while `payments`,

        `credits`, and `refunds` are negative.


        Each statement carries a `pdf_url`: a short-lived link to the statement

        document as the cardholder sees it. Fetch it promptly rather than storing

        it — see the field description for how long it lasts.


        Results are paginated. When `has_more` is `true`, pass the response''s

        `next_page_token` back as `starting_after` to retrieve the next page.


        Each statement carries `as_of`: when it was read, which is when the

        request was served. Not when the cycle closed — that is

        `period_end_date`.


        **Required scope:** `ACCOUNT_READ` — the same scope as the account reads.

        A statement is a closed cycle of the account, so a key that can read the

        account can read its statements.'
      operationId: listStatements
      x-required-scopes:
      - ACCOUNT_READ
      parameters:
      - name: customer_id
        in: path
        $ref: '#/components/parameters/customerIdParam'
      - name: account_id
        in: path
        $ref: '#/components/parameters/accountIdParam'
      - name: limit
        in: query
        description: Limits the number of returned statements
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          format: int32
      - name: starting_after
        in: query
        description: 'A cursor for use in pagination. Unlike other list endpoints, this

          takes the opaque `next_page_token` from the previous response rather

          than a statement id. Omit it for the first page.

          '
        schema:
          type: string
      responses:
        '200':
          description: List of customer statements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementListResponse'
        '400':
          description: '`starting_after` is not a token this endpoint issued. Page tokens are

            opaque and are only valid as returned in a previous

            `next_page_token`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
        '403':
          description: API key is missing the required `ACCOUNT_READ` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'The customer was not found, or the account does not belong to them.

            `type` distinguishes the two: `CUSTOMER_NOT_FOUND_ERROR` means we hold

            no record of the customer, `ACCOUNT_NOT_FOUND_ERROR` means the

            `account_id` is not one of theirs.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerNotFoundError'
  /v2/customers/{customer_id}/rewards_balance:
    get:
      tags:
      - Customers
      summary: Get customer's current rewards balance
      operationId: getRewardsBalance
      parameters:
      - name: customer_id
        $ref: '#/components/parameters/customerIdParam'
      responses:
        '200':
          description: Customer rewards balance
          content:
            application/json:
              schema:
                type: object
                required:
                - customer_id
                - reward_balance
                - reward_symbol
                properties:
                  customer_id:
                    type: string
                    description: The unique identifier for the customer
                    example: 2EE24580-B97B-4949-A65C-929CCB9B9B8D
                  reward_balance:
                    type: integer
                    description: The integer value of the customer's rewards balance
                    example: 120000
                  reward_symbol:
                    type: string
                    description: The symbol for the rewards. Can be in currency like `$` or things like `points`
                  reward_description:
                    type: string
                    description: The description of the rewards, can be displayed to the customer
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerNotFoundError'
  /v2/customers/{customer_id}/payment_methods:
    get:
      tags:
      - Customers
      summary: List customer's payment methods
      description: '**Optional scope:** `PCI_DETAILS_READ`. Without it the request still succeeds, but `card.pci_details` (PAN, CVV, expiry) is omitted from the response.'
      operationId: getPaymentMethods
      x-optional-scopes:
      - PCI_DETAILS_READ
      parameters:
      - name: customer_id
        $ref: '#/components/parameters/customerIdParam'
      responses:
        '200':
          description: Customer rewards balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentMethod'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerNotFoundError'
  /v2/customers/{customer_id}/transaction_intents:
    get:
      tags:
      - Customers
      summary: List customer's transaction intents
      description: '**Required scope:** `TRANSACTION_INTENT_READ`'
      operationId: getTransactionIntents
      x-required-scopes:
      - TRANSACTION_INTENT_READ
      parameters:
      - name: customer_id
        in: path
        $ref: '#/components/parameters/customerIdParam'
      responses:
        '200':
          description: Customer transaction intents
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionIntent'
        '403':
          description: API key is missing the required `TRANSACTION_INTENT_READ` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionNotFoundError'
  /v2/customers/{customer_id}/transactions:
    get:
      tags:
      - Customers
      summary: List customer's transactions
      operationId: getTransactions
      parameters:
      - name: customer_id
        $ref: '#/components/parameters/customerIdParam'
      - name: limit
        in: query
        description: Number of transactions to return, between 1 and 25. Values above 25 are capped at 25.
        schema:
          type: integer
          minimum: 1
          maximum: 25
          default: 10
          format: int32
      - name: starting_after
        $ref: '#/components/parameters/startingAfterParam'
      - name: expand
        $ref: '#/components/parameters/transactionExpandParam'
      responses:
        '200':
          description: List of customer transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  has_more:
                    type: boolean
                  total:
                    type: integer
        '400':
          description: Unsupported expand value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerNotFoundError'
  /v2/customers/{customer_id}/rewards:
    get:
      tags:
      - Customers
      summary: List customer's rewards
      description: List customer's rewards in descending order by the reward's updated at timestamp
      operationId: getRewards
      parameters:
      - name: customer_id
        $ref: '#/components/parameters/customerIdParam'
      - name: limit
        $ref: '#/components/parameters/limitParam'
      - name: starting_after
        $ref: '#/components/parameters/startingAfterParam'
      responses:
        '200':
          description: List of customer rewards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reward'
                  has_more:
                    type: boolean
                  total:
                    type: integer
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerNotFoundError'
components:
  schemas:
    RewardCategoriesResponse:
      type: object
      required:
      - currency
      - categories
      - special_categories
      properties:
        currency:
          type: string
          description: The reward currency configured for the account's program
          example: FanCash
        categories:
          type: array
          description: Standard transaction earning categories in display order
          items:
            $ref: '#/components/schemas/RewardCategory'
        special_categories:
          type: array
          description: Active non-transaction categories, such as a signup bonus
          items:
            $ref: '#/components/schemas/SpecialRewardCategory'
    TransactionIntentStatus:
      type: string
      enum:
      - CONFIRMED
      - CANCELED
      example: CONFIRMED
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - type
          - message
          properties:
            type:
              type: string
              description: The category of error being returned
              example: BAD_REQUEST_ERROR
            message:
              type: string
              description: A message describing the cause of the error
              example: 'unsupported reward_type: INVALID, must be STATEMENT or DELAYED'
    PartnerCustomerId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[\x20-\x7E]+$
      description: 'The unique identifier for the customer in the partner''s system.


        Compared byte-for-byte, so `PARTNER_USER_456` and `partner_user_456` are

        two different customers. Send the same casing everywhere or a later

        lookup silently returns no match.


        Restricted to printable ASCII (`\x20`–`\x7E`) rather than arbitrary

        UTF-8: the value is propagated between internal services as an HTTP/2

        header, which cannot carry non-ASCII bytes. The bound is published

        rather than discovered.

        '
      example: PARTNER_USER_456
    Address:
      type: object
      description: Mailing address information
      properties:
        street_line1:
          type: string
          description: Primary street address
          example: 123 Main St
        street_line2:
          type: string
          description: Secondary street address (apartment, suite, etc.)
          example: Apt 4B
        city:
          type: string
          description: City name
          example: San Francisco
        state:
          type: string
          description: State or province
          example: CA
        postal_code:
          type: string
          examples:
          - '94105'
          - 94105-1234
        country:
          type: string
          description: ISO-3166-1 alpha-3 Country Code
          example: USA
    AuthorizedUser:
      type: object
      description: An authorized user on a primary cardholder's account.
      properties:
        authorized_user_id:
          type: string
          description: Unique identifier for the authorized user. Stable for the lifetime of the authorized user record, and the identifier to store when reconciling with the Payment Method webhook. Note that removing and re-adding the same person creates a new authorized user record with a new identifier.
          example: A1B2C3D4-5566-7788-99AA-BBCCDDEEFF00
        first_name:
          type: string
          description: The authorized user's first name.
          example: Jane
        last_name:
          type: string
          description: The authorized user's last name.
          example: Doe
        email:
          type: string
          description: The authorized user's email address, as supplied by the primary cardholder when the authorized user was added. This value is not independently verified by Imprint.
          example: jane.doe@email.com
        phone:
          type: string
          description: The authorized user's phone number in E.164 format, as supplied by the primary cardholder when the authorized user was added. This value is not independently verified by Imprint.
          example: '+15551234567'
        date_of_birth:
          $ref: '#/components/schemas/DateOfBirth'
        postal_code:
          type: string
          description: The postal code of the authorized user's address.
          example: '60601'
        payment_method_id:
          type: string
          description: Identifier of the authorized user's current card. Omitted when no card is currently issued to them. This value changes when a card is reissued or replaced, so it should not be used as a durable key for the authorized user — use `authorized_user_id` instead.
          example: DCBFC736-2286-42DD-897D-160DCA80AED3
        status:
          type: string
          description: The authorized user's status on this account. `pending` means the authorized user has been added but is not yet activated. `inactive` means they are no longer active on this account.
          enum:
          - active
          - pending
          - inactive
          example: active
    AccountStatus:
      type: string
      description: "The lifecycle state of a customer's card account.\n\nTwo states mean \"approved but not usable yet\", and they are distinct:\n\n- `PENDING_FUNDING` is a secured account whose security deposit has not\n  been funded. The deposit is either still owed or a submitted payment\n  is settling, so no card has been issued and the account cannot be\n  spent on. It has no credit limit, balance or APR yet.\n- `INACTIVE` is an approved account whose card has not been activated\n  yet — for a secured account, one whose deposit has already settled.\n\n`PENDING_FUNDING` only ever appears on a secured-credit-card product.\n"
      enum:
      - OPEN
      - INACTIVE
      - PENDING_FUNDING
      - CLOSED
      - REVOKED
      - CHARGE_OFF
      - SOLD
      example: OPEN
    AccountType:
      type: string
      description: 'The type of product the account is. Absent when the product''s type could

        not be determined.

        '
      enum:
      - CREDITCARD
      - SECUREDCREDITCARD
      - INSTALLMENT_LOAN
      - SPENDCARD
      example: CREDITCARD
    TransactionLifecycleEvent:
      type: object
      description: One step in a transaction's lifecycle, e.g. the authorization, a capture, a refund or a confirmed dispute.
      required:
      - event_id
      - status
      - amount
      - created_at
      properties:
        event_id:
          type: string
          description: Unique identifier of this event. Matches the `event_id` in the Transaction Event Notification and the `transaction_event_id` on a Reward.
          example: B2D4A1C9-7F3E-4C8A-9E61-2A5B8D0F4C17
        status:
          $ref: '#/components/schemas/TransactionStatus'
        amount:
          type: integer
          description: Amount of this event in min units, e.g. the captured or refunded amount. Always non-negative.
          example: 5000
        created_at:
          type: string
          description: The RFC-3339 timestamp when the event was created
          example: 2025-02-13 19:08:07+00:00
        reward:
          allOf:
          - $ref: '#/components/schemas/Reward'
          nullable: true
          x-go-type: nullable.Nullable[Reward]
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          x-go-type-skip-optional-pointer: true
          description: The reward earned or deducted by this event, as returned by `GET /v2/rewards`. Present only when requested with `expand=events.reward`. Null when the event has no reward.
    RewardStatus:
      type: string
      enum:
      - PENDING
      - AVAILABLE
      - PENDING_DEDUCTION
      - DEDUCTED
      example: PENDING
    Account:
      type: object
      description: 'A customer''s card account as of now. Amounts are integers in the

        smallest currency unit and are always positive: they say what the

        customer owes, so a paid-off or in-credit account reads as `0`.


        Per-statement figures live in the statements API, not here.

        '
      required:
      - customer_id
      - account_id
      - status
      - as_of
      properties:
        customer_id:
          type: string
          description: The unique identifier for the customer
          example: 2EE24580-B97B-4949-A65C-929CCB9B9B8D
        account_id:
          type: string
          description: The unique identifier for the account
          example: 7C1F9A34-2D6B-4E58-8A03-B15E7D9C4620
        status:
          $ref: '#/components/schemas/AccountStatus'
        currency:
          $ref: '#/components/schemas/TransactionCurrency'
        credit_limit:
          $ref: '#/components/schemas/CurrencyAmount'
        available_credit:
          $ref: '#/components/schemas/CurrencyAmount'
        current_balance:
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
          description: 'Everything posted to the account, including activity since the last

            statement closed.

            '
        overdue_amount:
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
          description: 'The amount past due — a minimum payment that was not made by its due

            date and is still outstanding. Unlike the minimum due, this moves

            during the cycle: a payment brings it down. `0` on an account that is

            current.

            '
        statement_due_date:
          type: string
          description: 'RFC-3339 timestamp when payment for the most recently closed

            statement is due. Absent on an account still in its first billing

            cycle, which has no closed statement yet.

            '
          example: '2026-06-15T00:00:00Z'
        apr_percentage:
          type: number
          description: The purchase APR as a percentage
          example: 24.99
        as_of:
          type: string
          description: 'RFC-3339 timestamp of when this snapshot was calculated, which is

            when the request was served. Balances move continuously — a purchase

            or a payment lands between one read and the next — so this is the

            instant the figures above were true. Use it to label or expire a

            cached copy, and to order two reads of the same account.

            '
          example: '2026-08-27T14:22:31Z'
    TransactionCurrency:
      type: string
      description: The 3-character currency code of the amount in ISO 4217 format (e.g., "USD")
      example: USD
    PaymentMethod:
      type: object
      required:
      - id
      - type
      - customer_id
      - created_at
      - status
      - metadata
      properties:
        id:
          type: string
          example: DCBFC736-2286-42DD-897D-160DCA80AED2
          description: The unique ID Imprint assigns to the payment method.
        type:
          type: string
          description: The type of payment method
          enum:
          - CARD
          - BANK_ACCOUNT
          - LOAN
        customer_id:
          type: string
          description: The `id` of the Imprint customer that the payment method belongs to.
          example: B40A789E-BD46-4BB9-B63E-F9919582694C
        card:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodCardDetails'
          description: When the payment method is a non-secured `CARD` type, this object holds its card-specific data. Exactly one of `card` or `secured_credit_card` is present.
        secured_credit_card:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodCardDetails'
          description: Card-specific data for a secured-credit-card product, emitted in place of `card` when the payment method's product is a secured credit card. Exactly one of `card` or `secured_credit_card` is present.
        bank_account:
          type: object
          description: When payment method is a `BANK_ACCOUNT` type, this object will have bank account specific data.
          required:
          - last4
          - routing_number
          - bank_name
          properties:
            last4:
              type: string
              example: '1234'
              description: Last 4 numbers of the account.
              minLength: 4
              maxLength: 4
            routing_number:
              type: string
              description: The bank routing number assigned to this account.
            bank_name:
              type: string
              example: Wells Fargo
              description: Name of the banking institution
            account_type:
              type: string
              description: Type of the account.
              enum:
              - CHECKING
              - SAVINGS
        loan:
          type: object
          description: When payment method is a `LOAN` type, this object will have loan specific data.
          required:
          - amount
          - term_months
          properties:
            amount:
              type: integer
              description: Amount in min units.
              example: 10000
            currency:
              $ref: '#/components/schemas/TransactionCurrency'
            remaining_balance:
              type: integer
              description: remaining unspent balance on the loan
            term_months:
              type: integer
              description: Length of the loan term in months
              example: 12
            apr:
              type: string
              description: Annual percentage rate of the loan in floating point
              example: '5.89'
            loan_status:
              type: string
              description: Current status of the loan
              enum:
              - PENDING
              - APPROVED
              - REJECTED
              - ACTIVE
              - CLOSED
        created_at:
          type: string
          description: the RFC-3339 timestamp when the payment method was created
          example: 2025-02-13 19:08:07+00:00
        updated_at:
          type: string
          description: the RFC-3339 timestamp when the payment method was last updated
          example: 2025-02-13 19:08:07+00:00
        status:
          type: string
          description: Current status of the payment method
          enum:
          - ACTIVE
          - INACTIVE
          - CANCELED
        metadata:
          type: object
          additionalProperties: true
          description: Additional metadata for the payment method
          example:
            platform_version: 2.1.0
    RewardCategory:
      type: object
      required:
      - name
      - description
      - earn_rate
      - type
      - merchants
      properties:
        name:
          type: string
          example: On-Merchant
        description:
          type: string
          example: Purchases at Fanatics stores
        earn_rate:
          type: string
          description: 'Reward units earned per one transaction-currency unit, as a decimal

            string in the currency named by the response''s `currency` field. The

            number of decimal places is the precision the rate is configured

            with, so `"10.00"` and `"10"` are the same rate configured at

            different precisions.

            '
          pattern: ^-?\d+(\.\d+)?$
          example: '10.00'
        type:
          $ref: '#/components/schemas/RewardCategoryType'
        merchants:
          type: array
          items:
            type: string
          example:
          - Fanatics
          - NFL Shop
          - NBA Store
    DateOfBirth:
      type: object
      description: Customer's date of birth
      properties:
        year:
          type: integer
          description: Year of birth
          minimum: 1900
          example: 1990
        month:
          type: integer
          description: Month of birth
          minimum: 1
          maximum: 12
          example: 1
        day:
          type: integer
          description: Day of birth
          minimum: 1
          maximum: 31
          example: 1
    CardType:
      type: string
      description: The type of card
      enum:
      - PHYSICAL
      - VIRTUAL
      - UNIFIED
    StatementListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Statement'
        has_more:
          type: boolean
        next_page_token:
          type: string
          description: 'Opaque cursor for the next page, present only when `has_more` is

            `true`. Pass it back as `starting_after` to fetch the following page.

            Treat it as opaque — its contents are not a statement id and may

            change.

            '
          example: eyJsYXN0X3N0YXRlbWVudF9pZCI6MTAzfQ
    PaymentMethodCardDetails:
      type: object
      description: Card-specific data for a `CARD` payment method. Shared by the `card` and `secured_credit_card` properties on `PaymentMethod`; exactly one of those is present.
      required:
      - last4
      - brand
      properties:
        last4:
          type: string
          example: '1234'
          minLength: 4
          maxLength: 4
          description: The last 4 digits of the card PAN
        network:
          type: string
          description: Name of the card issuer
          enum:
          - VISA
          - MASTERCARD
          - AMEX
          - ''
        card_type:
          $ref: '#/components/schemas/CardType'
        card_design_id:
          $ref: '#/components/schemas/CardDesignID'
        exp_month:
          type: string
          description: The month the card expires (MM format).
          example: '06'
        exp_year:
          type: string
          description: The year the card expires (YYYY format).
          example: '2027'
        pci_details:
          type: object
          description: The pci details of the returned card. Only verified PCI compliant partners will be able to retrieve pci details in production environments.
          properties:
            pan:
              type: string
              description: The unique 16-digit number printed on the front of a payment card, used to identify the member's account.
              example: '5105105105105100'
            exp_month:
              type: string
              description: The month the card expires
              example: '06'
            exp_year:
              type: string
              description: The year the card expires
              example: '26'
            cvv:
              type: string
              description: A three- or four-digit security code used to verify card-not-present transactions and prevent fraud.
              example: '123'
        tokens:
          type: array
          description: Payment method tokens that are defined by a third-party provider are included in this array by Imprint.
          items:
            $ref: '#/components/schemas/PaymentMethodToken'
    Customer:
      type: object
      description: Represents a customer in the Imprint system
      required:
      - id
      properties:
        id:
          type: string
          description: Unique identifier for the customer
          example: 9B5E1EE0-2E1C-46E7-81B9-3C3917204BE4
        email:
          type: string
          format: email
          description: Customer's email address
          example: customer@example.com
        phone:
          type: string
          description: Customer's phone number in E.164 format
          example: '+14155552671'
        statuses:
          type: object
          description: Map of the customer's enrolled card program name to the customer's status.
          additionalProperties:
            $ref: '#/components/schemas/CustomerProgramStatus'
          example:
            Card Program Name: OPEN
        first_name:
          type: string
          description: The customer's first name.
          example: John
        last_name:
          type: string
          description: The customer's last name.
          example: Doe
        preferred_language:
          type: string
          description: Customer's preferred language code as defined by ISO 639-1
          example: en
        ssn4:
          type: string
          description: Customer's Social Security Number in 4 digits
          example: '1234'
        date_of_birth:
          $ref: '#/components/schemas/DateOfBirth'
        address:
          $ref: '#/components/schemas/Address'
        partner_customer_id:
          $ref: '#/components/schemas/PartnerCustomerId'
        metadata:
          type: object
          description: Set of key-value pairs for storing additional information about the customer.
          additionalProperties: true
          example:
            preferred_language: en
        created_at:
          type: string
          description: the RFC-3339 date when the customer was created
          example: 2025-02-13 19:08:07+00:00
        updated_at:
          type: string
          description: the RFC-3339 date when the customer was created
          example: 2025-02-13 19:08:07+00:00
        authorized_users:
          type: array
          description: 'The authorized users on this customer''s account for the requesting partner''s card program. Authorized users share the primary cardholder''s customer record, so they are returned here rather than as separate customers. Requires the `AUTHORIZED_USER_READ` scope; omitted entirely when the API key does not hold it.


            Only returned by Retrieve Customer. The Search Customers endpoints share this schema but never populate this field.


            The array is historical, not current: every authorized user ever added to the account is included, and those no longer on it carry `status: inactive`. Filter on `status` to get only the authorized users who can currently transact.'
          items:
            $ref: '#/components/schemas/AuthorizedUser'
    CustomerListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        has_more:
          type: boolean
        total:
          type: integer
    RewardType:
      type: string
      enum:
      - OFFER
      - TRANSACTION
      - ONE_TIME
      - STATEMENT
      - REFERRAL
      example: TRANSACTION
    CustomerNotFoundError:
      type: object
      required:
