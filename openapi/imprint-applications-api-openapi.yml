    PrefillApplicationResponse:
      type: object
      required:
      - prefilled
      - application
      properties:
        prefilled:
          type: object
          description: 'The fields that were found and applied, keyed by field `key`. Show

            these for confirmation and let the applicant correct them. Never

            empty — a miss is a `404 NO_PREFILL_MATCH`, so a client does not have

            to measure this map to learn whether the call found anything.

            '
          additionalProperties: true
          example:
            applicant.first_name: Jane
            applicant.last_name: Doe
            applicant.address:
              street_line1: 123 Main St
              city: Austin
              state: TX
              postal_code: '78701'
              country: USA
            applicant.date_of_birth:
              year: 1990
              month: 4
              day: 12
        application:
          $ref: '#/components/schemas/Application'
