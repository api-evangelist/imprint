    IdempotencyConflictError:
      type: object
      description: 'A keyed operation could not yet be replayed. Reuse the same key and

        request after `retry_after_seconds` for `IDEMPOTENCY_IN_PROGRESS`.

        `IDEMPOTENCY_KEY_REUSED` means the key was previously reserved for a

        different method, operation, target, action, or canonical request body;

        retry only with a new key for the genuinely new operation.

        '
      required:
      - type
      - message
      properties:
        type:
          type: string
          enum:
          - IDEMPOTENCY_IN_PROGRESS
          - IDEMPOTENCY_KEY_REUSED
          example: IDEMPOTENCY_IN_PROGRESS
        message:
          type: string
          example: The operation for this idempotency key is still in progress
        retry_after_seconds:
          type: integer
          description: Present only for `IDEMPOTENCY_IN_PROGRESS`; matches the Retry-After header.
          example: 2
    ProductOfferResult:
      type: string
      description: "One product's decision.\n\n- `OFFER_READY`: approved for this product; the offer can be accepted.\n- `ACCEPTED`: the offer was accepted and the account is being provisioned.\n- `ACCEPTED_PENDING_ACTION`: the offer was accepted and a required\n  action, such as funding a security deposit, must complete first.\n- `COMPLETED`: the account for this product is provisioned.\n- `REJECTED`: declined for this product.\n- `EXPIRED`: the offer was not accepted in time, or an accepted offer's\n  required action did not complete in time.\n\n`COMPLETED`, `REJECTED`, and `EXPIRED` are final.\n"
      enum:
      - OFFER_READY
      - ACCEPTED
      - ACCEPTED_PENDING_ACTION
      - COMPLETED
      - REJECTED
      - EXPIRED
      example: OFFER_READY
  parameters:
    startingAfterParam:
      name: starting_after
      in: query
      description: A cursor for use in pagination. An id that defines your place in the list.
      schema:
        type: string
    applicationMerchantKeyParam:
      name: x-imprint-merchant-key
      in: header
      required: true
      description: 'Identifies the product/program for this application operation. The API

        key must be authorized for the named program. Send this header on every

        request; a key already bound to one product does not make it optional.

        '
      schema:
        type: string
    idempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: false
      description: 'A client-generated key that makes this request safe to retry. Replaying a

        key returns the original result instead of performing the action twice.

        Keys are scoped to your program and retained for 24 hours.

        '
      schema:
        type: string
        example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
    nonblankIdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: false
      description: 'An optional client-generated key that makes this request safe to retry.

        Replaying a key returns the original result instead of performing the

        action twice. When supplied it must be nonblank. Keys are scoped to your

        program and retained for 24 hours.

        '
      schema:
        type: string
        minLength: 1
        pattern: \S
        example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
    applicationIdParam:
      name: application_id
      in: path
      required: true
      description: The unique identifier for the application
      schema:
        type: string
        format: uuid
        example: 7f3c1e20-4b8a-4e11-9c6d-2a5f0b7d3e91
    limitParam:
      name: limit
      in: query
      description: Limits the number of returned results
      schema:
        type: integer
        minimum: 1
        default: 10
        format: int32
