openapi: 3.2.0
info:
  title: Public Imprint Applications API
  version: '2.0'
servers:
- url: https://dev.sbx.imprint.co
  description: Imprint public api sandbox
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Applications
paths:
  /v2/application_configuration:
    get:
      tags:
      - Applications
      summary: Retrieve application configuration
      x-excluded: true
      description: 'Returns the field schema, disclosures, and verification modes for your

        program. This is the *schema* half of the application contract: it

        describes every field the program can ever ask for, so you can build

        your application form at compile time.


        The runtime half is `GET /v2/applications/{application_id}`, whose

        `requirements` array says what is required for one specific application

        right now. Two guarantees hold between them:


        - An application never names a `key` that is absent from this response.

        - This response never asserts what is required for a *given*

        application — a `CONDITIONALLY_REQUIRED` field may or may not be

        asked for, depending on that application''s state.


        In short: configuration drives form *construction*, the application

        drives form *progression*.


        Fetch without `configuration_revision` for the current configuration. Applications

        pin the returned `configuration_revision`; pass that value as

        `configuration_revision` when resuming an

        application so its requirements are interpreted against the same

        configuration. Latest means the final entry in the effective product

        configuration. A removed or unknown revision returns 404.

        All configured translations are returned in localized content maps;

        clients choose the language to display.


        **Required scope:** `APPLICATION_WRITE`'
      operationId: getApplicationConfiguration
      x-required-scopes:
      - APPLICATION_WRITE
      parameters:
      - $ref: '#/components/parameters/applicationMerchantKeyParam'
      - name: configuration_revision
        in: query
        required: false
        description: A configuration revision pinned by an existing application. Omit for current.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Application configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationConfiguration'
        '403':
          description: The API key does not have application write access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: The configuration_revision query must not be blank.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication or merchant-key authorization failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The requested configuration does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: The stored configuration is invalid or could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v2/applications:
    post:
      tags:
      - Applications
      summary: Create an application
      x-excluded: true
      description: 'Creates an application. Every applicant field is optional here — pass

        whatever you already hold and fill the rest in with

        `PATCH /v2/applications/{application_id}`.


        Consent inputs are retained pending validation by Onboard application

        configuration. The draft response currently returns an empty

        `requirements` array and does not include `product_offers`.


        Supply an `Idempotency-Key` to make retries safe; replaying a key

        returns the original application rather than creating a second one.


        **Required scope:** `APPLICATION_WRITE`'
      operationId: createApplication
      x-required-scopes:
      - APPLICATION_WRITE
      parameters:
      - $ref: '#/components/parameters/applicationMerchantKeyParam'
      - $ref: '#/components/parameters/idempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Application created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '503':
          description: Temporarily unavailable; retry with the same idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: 'Malformed JSON, unknown or disallowed fields, or wrong JSON types. Allowed fields that fail program validation are retained as editable candidates and returned with INVALID requirements.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
        '403':
          description: The API key does not have application write access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: '`IDEMPOTENCY_IN_PROGRESS` while the original create is unresolved, or `IDEMPOTENCY_KEY_REUSED` when the key identifies a different request.

            '
          headers:
            Retry-After:
              description: Seconds to wait when `type` is `IDEMPOTENCY_IN_PROGRESS`.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotencyConflictError'
    get:
      tags:
      - Applications
      summary: List applications
      x-excluded: true
      description: 'Returns the applications belonging to one of your customers, most

        recently created first. `partner_customer_id` is required.


        `partner_customer_id` is compared byte-for-byte and the cursor is an

        application id from the same program and filtered collection. `total`

        is the number of applications in this page.


        A draft that was never submitted is left out once it passes its

        `draft_expires_at`. Submitted applications are always listed.


        **Required scope:** `APPLICATION_WRITE`'
      operationId: listApplications
      x-required-scopes:
      - APPLICATION_WRITE
      parameters:
      - $ref: '#/components/parameters/applicationMerchantKeyParam'
      - name: partner_customer_id
        in: query
        required: true
        description: The unique identifier for the customer in the partner's system
        schema:
          $ref: '#/components/schemas/PartnerCustomerId'
      - name: limit
        $ref: '#/components/parameters/limitParam'
      - name: starting_after
        $ref: '#/components/parameters/startingAfterParam'
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'
        '400':
          description: Invalid application list request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
        '403':
          description: The API key does not have application write access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v2/applications/{application_id}:
    get:
      tags:
      - Applications
      summary: Retrieve an application
      x-excluded: true
      description: 'Returns the application, including the `requirements` array that drives

        your form, the `status`, and — once decisioning finishes — each

        product''s decision in `product_offers`.


        This is the only endpoint you need to poll. When `poll_after_ms` is

        present the application is mid-evaluation; wait that many milliseconds

        before polling again rather than fixing your own interval.


        If decisioning takes longer than usual the application stays `EVALUATING`

        with `poll_after_ms` set. Poll for at most 30 seconds in the applicant''s

        session; after that show an under-review state and take the result from

        the application webhook or a background poll. No action is required and

        the application must not be submitted again — Imprint completes delayed

        evaluations on its side and the result arrives on the same application.


        A draft that was never submitted returns `404` once it passes its

        `draft_expires_at`. A submitted application stays retrievable.


        **Required scope:** `APPLICATION_WRITE`'
      operationId: getApplication
      x-required-scopes:
      - APPLICATION_WRITE
      parameters:
      - $ref: '#/components/parameters/applicationMerchantKeyParam'
      - $ref: '#/components/parameters/applicationIdParam'
      responses:
        '200':
          description: Application retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Invalid application request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
        '403':
          description: The API key does not have application write access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The application does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationNotFoundError'
    patch:
      tags:
      - Applications
      summary: Update an application
      x-excluded: true
      description: 'Updates applicant data, records disclosure consent, and selects a card

        design.


        Semantics are JSON merge-patch: omitted fields are left untouched, and

        an explicit `null` clears a field. This lets a multi-page form send only

        the current page''s delta without wiping earlier pages.


        The full application is returned, so the refreshed `requirements` array

        arrives with the write — you do not need to follow up with a `GET`.


        This endpoint carries everything the applicant typed and could retype.

        Anything with an external side effect or a one-way transition — sending

        an SMS, verifying a code, writing a credential, committing a decision —

        is a separate `POST` sub-resource.


        **Required scope:** `APPLICATION_WRITE`'
      operationId: updateApplication
      x-required-scopes:
      - APPLICATION_WRITE
      parameters:
      - $ref: '#/components/parameters/applicationMerchantKeyParam'
      - $ref: '#/components/parameters/applicationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
      responses:
        '200':
          description: Application updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: 'Malformed JSON, unknown or disallowed fields, wrong JSON types, or `consents: null`; the application is not mutated. Allowed fields that fail program validation are retained as editable candidates and returned with INVALID requirements.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
        '403':
          description: The API key does not have application write access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The application does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationNotFoundError'
        '409':
          description: 'The requested field is not editable in the current lifecycle phase, or the draft expired. Applicant data freezes at submit; card design remains editable through OFFERS_AVAILABLE and freezes at acceptance.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
  /v2/applications/{application_id}/phone_verification:
    post:
      tags:
      - Applications
      summary: Verify the applicant's phone number
      x-excluded: true
      description: 'Drives the `phone_verification` requirement. One endpoint, three

        actions:


        - `SEND` — Imprint sends a one-time code by SMS. Requires the SMS

        disclosure to be consented first; until it is, that disclosure

        requirement carries `blocks: PHONE_VERIFICATION` and this returns

        `409`.

        - `VERIFY` — submit the code the applicant received.

        - `ATTEST` — certify that *you* verified the phone number, skipping

        Imprint''s SMS entirely. Available only when the program''s

        `phone_verification.mode` is `PARTNER_ATTESTED`; otherwise `403`.


        Which actions you may use is program configuration, not a property of

        this route, so the contract is identical across partners. Read

        `phone_verification.mode` from `GET /v2/application_configuration`.


        On success this may surface an `account_ownership` requirement: when the

        phone already belongs to an Imprint account, the applicant must prove

        ownership before the application can be submitted. That requirement''s

        `resolution_options` names the ways forward.


        Resends are rate-limited. A `SEND` inside the cooldown returns `429`

        with `retry_after_seconds` and a `Retry-After` header — every send is an

        SMS the applicant receives and someone pays for. Disable your resend

        control for `phone_verification.resend_after_ms` from

        `GET /v2/application_configuration` so the applicant is not offered a

        button that cannot work yet, but treat this `429` as authoritative: it

        accounts for a code sent before your page loaded.


        **Required scope:** `APPLICATION_WRITE`'
      operationId: verifyApplicationPhone
      x-required-scopes:
      - APPLICATION_WRITE
      parameters:
      - $ref: '#/components/parameters/applicationMerchantKeyParam'
      - $ref: '#/components/parameters/applicationIdParam'
      - $ref: '#/components/parameters/idempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneVerificationRequest'
      responses:
        '200':
          description: 'The action was accepted. For `SEND` the code is on its way; for `VERIFY` and `ATTEST` the requirement is now satisfied.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Malformed body, or a missing phone number on the application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
        '403':
          description: 'The API key does not have application write access, or `ATTEST` was used on a program that is not configured for partner attestation.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The application does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationNotFoundError'
        '409':
          description: '`SEND` was called before the SMS disclosure was consented, or the phone is already verified; alternatively an idempotent operation is still in progress or the key was reused for a different request.

            '
          headers:
            Retry-After:
              description: Seconds to wait when `type` is `IDEMPOTENCY_IN_PROGRESS`.
              schema:
                type: integer
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ConflictError'
                - $ref: '#/components/schemas/IdempotencyConflictError'
        '422':
          description: The code is incorrect or has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 'A code was requested again before the cooldown elapsed (`RESEND_TOO_SOON`), or there were too many failed `VERIFY` attempts. `retry_after_seconds` rounds up, and is repeated in the `Retry-After` header.

            '
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 9
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedError'
        '503':
          description: The service is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v2/applications/{application_id}/prefill:
    post:
      tags:
      - Applications
      summary: Prefill applicant data
      x-excluded: true
      description: 'Looks the applicant up from their phone number and the last four digits

        of their SSN, and returns whatever identity data can be retrieved.


        The values are applied to the application *and* returned to you, so you

        can render a confirm-and-edit screen. Present them for confirmation

        rather than submitting silently — the applicant must be able to correct

        a wrong line.


        Requires a verified phone number.


        A miss returns `404` with type `NO_PREFILL_MATCH`, and leaves the

        application untouched — including the four digits it was asked about,

        which a miss has nothing to confirm. Branch on the error `type` rather

        than the status alone: `NO_PREFILL_MATCH` is an ordinary path to manual

        entry, while `APPLICATION_NOT_FOUND` means the id was wrong and must not

        be shown to the applicant as though their data went missing.


        `ssn_last_four` is an input to this endpoint only; it is deliberately not

        a field in `configuration.fields`. A hit does **not** satisfy the

        `applicant.ssn` requirement — submit still requires all nine digits.

        Four digits are guessable, and waiving the full number on that evidence

        would make this an identity oracle.


        **Required scope:** `APPLICATION_WRITE`'
      operationId: prefillApplication
      x-required-scopes:
      - APPLICATION_WRITE
      parameters:
      - $ref: '#/components/parameters/applicationMerchantKeyParam'
      - $ref: '#/components/parameters/applicationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrefillApplicationRequest'
      responses:
        '200':
          description: 'A record matched. `prefilled` carries the values that were applied to the application, and is never empty on a `200`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefillApplicationResponse'
        '400':
          description: Malformed body or failed field validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
        '403':
          description: The API key does not have application write access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'Either no record matched (`NO_PREFILL_MATCH` — an ordinary outcome; send the applicant to manual entry) or the application does not exist or is not owned by the caller (`APPLICATION_NOT_FOUND`). Distinguish them by `type`.

            '
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/NoPrefillMatchError'
                - $ref: '#/components/schemas/ApplicationNotFoundError'
        '409':
          description: 'The application''s phone number is not yet verified (`PHONE_NOT_VERIFIED`), or the application can no longer be edited or changed concurrently (`APPLICATION_CONFLICT`).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
  /v2/applications/{application_id}/verify_account_ownership:
    post:
      tags:
      - Applications
      summary: Verify ownership of an existing Imprint account
      x-excluded: true
      description: 'Satisfies the `account_ownership` requirement when the applicant''s phone

        already belongs to an Imprint account. The requirement advertises exactly

        one route: `VERIFY_PASSWORD` when the account has a password (use

        `PASSWORD`), or `VERIFY_PIN` when it has only a PIN (use `PIN`). Sending

        the other credential type returns `409`.


        Not to be confused with `phone_verification`, which verifies the phone

        number itself. This endpoint proves the applicant is the person who owns

        the Imprint account that number is already attached to.


        An existing account with neither a password nor a PIN has no

        `account_ownership` requirement; the customer sets a password through

        `POST /v2/applications/{application_id}/authentication`.


        `HOSTED` is reserved for an Imprint-hosted handoff that is not yet

        available and currently returns `409` with

        `OWNERSHIP_RESOLUTION_NOT_AVAILABLE`.


        Credentials are forwarded to Imprint''s authentication service and are

        never stored, logged or returned. Failed attempts count against the

        customer''s Imprint app login lockout.


        **Required scope:** `APPLICATION_WRITE`'
      operationId: verifyApplicationAccountOwnership
      x-required-scopes:
      - APPLICATION_WRITE
      parameters:
      - $ref: '#/components/parameters/applicationMerchantKeyParam'
      - $ref: '#/components/parameters/applicationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAccountOwnershipRequest'
      responses:
        '200':
          description: 'Ownership is verified and `account_ownership` is `SATISFIED`. Repeating the call for an already-verified application returns the current application without re-checking the credential.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: 'Malformed body, a credential that does not match `type`, or both credentials sent at once.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
        '403':
          description: The API key does not have application write access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The application does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationNotFoundError'
        '409':
          description: '`ACCOUNT_OWNERSHIP_NOT_REQUIRED` when the application has no `account_ownership` requirement; `OWNERSHIP_RESOLUTION_NOT_AVAILABLE` when the requested `type` is not the advertised route (including `HOSTED`); `APPLICATION_CONFLICT` when the application can no longer be edited or changed concurrently.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '422':
          description: 'The credential is incorrect. The message is deliberately the same whether or not an account exists on that phone number — this endpoint is reachable with only a phone number, so a distinguishable failure would make it an account-existence oracle.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 'Too many failed attempts. Attempts are limited per application and per phone number; wait `retry_after_seconds` rather than retrying on a schedule of your own.

            '
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedError'
        '503':
          description: 'Imprint''s authentication service was unavailable; nothing was verified. Retry.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v2/applications/{application_id}/authentication:
    post:
      tags:
      - Applications
      summary: Establish authentication for the account
      x-excluded: true
      description: 'Sets how the customer will authenticate. This is a credential write, so

        it is deliberately separate from `PATCH` — it gets its own audit trail

        and is never replayable as form data.


        Two types:


        - `PASSWORD` — the customer sets an Imprint password. Application-API

        integrations set a password rather than a PIN, because a

        password-backed account stays recoverable without the partner.

        - `PARTNER_MANAGED` — you own authentication end to end and the customer

        has no Imprint login. Available only to programs with a full

        Servicing-API integration. Should that customer later lose their

        partner account, `POST /v2/customers/{customer_id}/offboard` migrates

        them to a standalone Imprint account.


        The `authentication` requirement carries `blocks: COMPLETION`: an

        application can be submitted and an offer accepted before it is

        satisfied, but the application does not reach `COMPLETED` until it is.

        Call this at any point after the application is created. Before submit

        the password is validated against `password_policy` and held, encrypted,

        on the application; `authentication` reads `SATISFIED` and submit sets the

        password on the customer''s Imprint account. Calling again before submit

        replaces the held password. After submit the password is set

        immediately. An approved application waits in `PENDING_AUTHENTICATION`

        until the requirement is satisfied.


        The password must satisfy the program''s `password_policy`. The server

        also rejects passwords with four or more repeated or sequential

        characters, common passwords, and passwords containing the applicant''s

        personal information; those checks are not published as a pattern and,

        for a password held before submit, run at submit. If they reject it the

        submission still succeeds, `authentication` returns to `MISSING`, and

        this endpoint must be called again with a different password.


        `Idempotency-Key` is optional; when supplied it must be nonblank.

        Completed requests replay their original response with the same key.

        The password is never stored with the idempotency record.


        **Required scope:** `APPLICATION_WRITE`'
      operationId: createApplicationAuthentication
      x-required-scopes:
      - APPLICATION_WRITE
      parameters:
      - $ref: '#/components/parameters/applicationMerchantKeyParam'
      - $ref: '#/components/parameters/applicationIdParam'
      - $ref: '#/components/parameters/nonblankIdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthenticationRequest'
      responses:
        '200':
          description: Authentication established; the requirement is now satisfied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: 'Malformed body, a missing or unknown `type`, a missing `password`, a blank Idempotency-Key, or a password that does not meet the password policy (`details` contains `PASSWORD_POLICY_VIOLATION`).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
        '403':
          description: 'The API key does not have application write access, the program does not offer password authentication, or `PARTNER_MANAGED` was used on a program without a Servicing-API integration.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The application does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationNotFoundError'
        '409':
          description: '`AUTHENTICATION_ALREADY_ESTABLISHED` when the customer already has an Imprint credential; `APPLICATION_CONFLICT` when the application has not been submitted, can no longer be authenticated, or does not support password authentication for this customer; alternatively an idempotent operation is in progress or its key was reused.

            '
          headers:
            Retry-After:
              description: Seconds to wait when `type` is `IDEMPOTENCY_IN_PROGRESS`.
              schema:
                type: integer
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ConflictError'
                - $ref: '#/components/schemas/IdempotencyConflictError'
        '500':
          description: An unexpected error prevented authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Authentication is temporarily unavailable; retry with the same idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v2/applications/{application_id}/submit:
    post:
      tags:
      - Applications
      summary: Submit an application for decisioning
      x-excluded: true
      description: 'Submits the application. Everything with `blocks: PHONE_VERIFICATION` or

        `blocks: SUBMIT` in `requirements` must be satisfied first. Outstanding

        requirements return `409` and the response body names exactly what is blocking, so

        you can route the applicant back to the right screen.


        On success the application moves to `EVALUATING`. Decisioning is

        asynchronous: poll `GET /v2/applications/{application_id}`, honouring

        `poll_after_ms`, or wait for the application webhook. The terminal

        states are `OFFERS_AVAILABLE`, `REJECTED`, and

        the intermediate `IDV_REQUIRED` / `PENDING_REVIEW`.


        `Idempotency-Key` is optional; when supplied it must be nonblank.

        Completed requests replay their original response with the same key.

        A request without a key is treated as a new key. An unexpired,

        unaccepted `FROZEN` application can be resubmitted with a new key after

        the applicant unfreezes their credit file. This reuses the existing

        application and restarts evaluation.

        Other already submitted applications return `409` with

        `APPLICATION_ALREADY_SUBMITTED` for a new key: the earlier submission

        took effect, so poll `GET /v2/applications/{application_id}` for its

        progress instead of retrying. Replaying an earlier key does not restart

        evaluation. This includes an application that has stayed `EVALUATING`

        longer than usual: Imprint completes delayed evaluations on its side,

        so wait for the result rather than resubmitting.

        Successful responses return an empty `product_offers` array. The first

        submit sets `expires_at`; a later resubmit does not move it.


        **Required scope:** `APPLICATION_WRITE`'
      operationId: submitApplication
      x-required-scopes:
      - APPLICATION_WRITE
      parameters:
      - $ref: '#/components/parameters/applicationMerchantKeyParam'
      - $ref: '#/components/parameters/applicationIdParam'
      - $ref: '#/components/parameters/nonblankIdempotencyKeyParam'
      responses:
        '200':
          description: Application submitted; decisioning is under way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Invalid application request or blank Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
        '403':
          description: The API key does not have application write access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The application does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationNotFoundError'
        '409':
          description: 'Requirements that block submission are unsatisfied, or the application was already submitted; alternatively an idempotent operation is in progress or its key was reused. `blocking_requirements` is present for `SUBMIT_BLOCKED`. `APPLICATION_ALREADY_SUBMITTED` means the submission already took effect; poll Get Application for its progress.

            '
          headers:
            Retry-After:
              description: Seconds to wait when `type` is `IDEMPOTENCY_IN_PROGRESS`.
              schema:
                type: integer
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/SubmitBlockedError'
                - $ref: '#/components/schemas/ConflictError'
                - $ref: '#/components/schemas/IdempotencyConflictError'
        '500':
          description: An unexpected error prevented submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Submission is temporarily unavailable; retry with the same idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v2/applications/{application_id}/idv:
    post:
      tags:
      - Applications
      summary: Start identity verification
      x-excluded: true
      description: 'Returns the hosted identity-verification URL for an application in

        `IDV_REQUIRED`. Send the applicant there to verify their identity.


        When they finish, decisioning resumes and the application moves from

        `IDV_REQUIRED` to `OFFERS_AVAILABLE`, `PENDING_REVIEW`, or `REJECTED`.

        A successful IDV is not itself an approval. Poll or wait for the

        webhook as you would after submitting.


        The verification is created when the application enters

        `IDV_REQUIRED`, and every call returns a URL for that same

        verification. Calling again is safe, and an applicant who leaves

        partway through picks up where they left off.


        **Required scope:** `APPLICATION_WRITE`'
      operationId: createApplicationIdv
      x-required-scopes:
      - APPLICATION_WRITE
      parameters:
      - $ref: '#/components/parameters/applicationMerchantKeyParam'
      - $ref: '#/components/parameters/applicationIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIdvRequest'
      responses:
        '200':
          description: The identity-verification URL for the application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdvSession'
        '400':
          description: 'Malformed body, or a `redirect_url` that is not on your program''s redirect allowlist.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
        '403':
          description: The API key does not have application write access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The application does not exist or is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationNotFoundError'
        '409':
          description: 'Identity verification is not open on this application. `type` is `IDV_ALREADY_COMPLETED` if the applicant has already finished — stop asking and poll for the decision — or `IDV_NOT_REQUIRED` if the application never needed it, which means the caller reached this endpoint without an `IDV_REQUIRED` status and has a bug. The two are separated because one is a race the applicant already won and the other is a dead end.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
  /v2/applications/{application_id}/accept:
    post:
      tags:
      - Applications
      summary: Accept an offer
      x-excluded: true
      description: 'Accepts one `OFFER_READY` entry of `product_offers` — pass its `id` as

        `product_offer_id`. This is the commitment point: the account is created

        from here. The response carries the accepted entry as `product_offer`.


        Pass `card_design_id` to choose the design for this product offer.

        Each product has its own designs: list them with

        `GET /v2/card_designs` for the entry''s `product_id`. When omitted, the

        design selected on the application via `PATCH` is used, falling back

        to the configuration''s `card_design.default_card_design_id`; both

        apply only to single-product applications.


        Once acceptance is committed the response may be `OFFER_ACCEPTED` while

        provisioning continues; `customer_id` remains null and callers poll.

        Once the account exists, `customer_id` is populated on the application.

        If authentication is not yet established the application waits in

        `PENDING_AUTHENTICATION`; establish it to reach `COMPLETED`.


        `Idempotency-Key` is optional; when supplied it must be nonblank. Retry the

        same request with the same key to replay the original result. A request

        without a key is treated as a new key. Once an offer has been accepted, a

        new key returns `409` with `APPLICATION_CONFLICT`: the earlier acceptance

        took effect, so poll `GET /v2/applications/{application_id}` for its

        progress instead of retrying.

        Successful responses include the application, its complete requirements, and

        the accepted product offer. Historical replays may omit

        product_offer; they are not enriched with current data.

        Poll Get Application for later progress; Accept does not return `poll_after_ms`.


        **Required scope:** `APPLICATION_WRITE`'
      operationId: acceptApplication
      x-required-scopes:
      - APPLICATION_WRITE
      parameters:
      - $ref: '#/components/parameters/applicationMerchantKeyParam'
      - $ref: '#/components/parameters/applicationIdParam'
      - $ref: '#/components/parameters/nonblankIdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptOfferRequest'
      responses:
        '200':
          description: Offer accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Malformed body or failed field validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
        '403':
          description: The API key does not have application write access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'The application does not exist, is not owned by the caller, or `product_offer_id` is not the `id` of an `OFFER_READY` entry in this application''s `product_offers`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationNotFoundError'
        '409':
          description: 'The application has no offers available, an offer has already been accepted, or the offer has expired; alternatively an idempotent operation is still in progress or its key was reused. When an offer has already been accepted, the acceptance already took effect; poll Get Application for its progress.

            '
          headers:
            Retry-After:
              description: Seconds to wait when `type` is `IDEMPOTENCY_IN_PROGRESS`.
              schema:
                type: integer
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ConflictError'
                - $ref: '#/components/schemas/IdempotencyConflictError'
        '503':
          description: Temporarily unavailable. Retry the same request with the same idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    CreateAuthenticationRequest:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: '`PASSWORD` — the customer sets an Imprint password; requires

            `password`.

            `PARTNER_MANAGED` — you own authentication and the customer has no

            Imprint login. Restricted to programs with a full Servicing-API

            integration.

            '
          enum:
          - PASSWORD
          - PARTNER_MANAGED
          example: PASSWORD
        password:
          type: string
          description: 'The password to set, for `PASSWORD`. Must satisfy the program''s `password_policy`. Write-only, and never returned by any endpoint.

            '
          example: Correct horse battery 9
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - type
          - message
          properties:
            type:
              type: string
              description: The category of error being returned
              example: BAD_REQUEST_ERROR
            message:
              type: string
              description: A message describing the cause of the error
              example: 'unsupported reward_type: INVALID, must be STATEMENT or DELAYED'
    PhoneVerificationRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          description: '`SEND` — Imprint sends a code by SMS.

            `VERIFY` — submit the code the applicant received; requires `code`.

            `ATTEST` — certify you verified the phone yourself; requires

            `verified_at` and `method`, and is available only when the program''s

            `phone_verification.mode` is `PARTNER_ATTESTED`.

            '
          enum:
          - SEND
          - VERIFY
          - ATTEST
          example: SEND
        code:
          type: string
          description: The one-time code, for `VERIFY`.
          example: '123456'
        verified_at:
          type: string
          description: 'The RFC-3339 timestamp at which you verified the phone number, for `ATTEST`. Must be recent.

            '
          example: '2026-08-02T19:04:11Z'
        method:
          type: string
          description: How you verified the phone number, for `ATTEST`.
          enum:
          - SMS_OTP
          - VOICE_OTP
          example: SMS_OTP
    PartnerCustomerId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[\x20-\x7E]+$
      description: 'The unique identifier for the customer in the partner''s system.


        Compared byte-for-byte, so `PARTNER_USER_456` and `partner_user_456` are

        two different customers. Send the same casing everywhere or a later

        lookup silently returns no match.


        Restricted to printable ASCII (`\x20`–`\x7E`) rather than arbitrary

        UTF-8: the value is propagated between internal services as an HTTP/2

        header, which cannot carry non-ASCII bytes. The bound is published

        rather than discovered.

        '
      example: PARTNER_USER_456
    Address:
      type: object
      description: Mailing address information
      properties:
        street_line1:
          type: string
          description: Primary street address
          example: 123 Main St
        street_line2:
          type: string
          description: Secondary street address (apartment, suite, etc.)
          example: Apt 4B
        city:
          type: string
          description: City name
          example: San Francisco
        state:
          type: string
          description: State or province
          example: CA
        postal_code:
          type: string
          examples:
          - '94105'
          - 94105-1234
        country:
          type: string
          description: ISO-3166-1 alpha-3 Country Code
          example: USA
    ApplicationConfiguration:
      type: object
      description: 'The program''s application schema — every field that can ever be asked

        for, the disclosures that must be consented, and the verification and

        authentication modes in effect.

        '
      required:
      - configuration_revision
      - fields
      - disclosures
      - requirement_definitions
      properties:
        configuration_revision:
          type: string
          description: 'Identifier for this configuration entry. Applications retain this

            value so callers can request the matching entry when resuming.

            Operators can edit or remove entries; revisions are not immutable snapshots.

            '
          example: ACFG-2026-08-02-1
        fields:
          type: array
          description: 'Every applicant field the program can ask for. Use this to build

            your form; use the application''s `requirements` to decide what to

            show for a given applicant.

            '
          items:
            $ref: '#/components/schemas/ApplicationFieldSchema'
        disclosures:
          type: array
          description: The disclosures this program requires consent to.
          items:
            $ref: '#/components/schemas/DisclosureSchema'
        requirement_definitions:
          type: array
          description: 'Every non-field, non-disclosure requirement key this program can

            emit. FIELD keys are defined by `fields`; DISCLOSURE keys are

            defined by `disclosures`. Together these collections define every

            requirement key an application can return.

            '
          items:
            $ref: '#/components/schemas/ApplicationRequirementDefinition'
        legal_documents:
          type: array
          description: 'Every document the program publishes, whether or not a disclosure

            references it. A program has documents no single consent covers — a

            rewards program''s terms, a fee schedule — and an applicant is

            entitled to read all of them, so the full set is published rather

            than only the consent-reachable subset.


            This is not consent: nothing here needs acknowledging. Render it as

            a documents or terms section, separately from `disclosures`.

            '
          items:
            $ref: '#/components/schemas/LegalDocumentSchema'
        phone_verification:
          $ref: '#/components/schemas/ApplicationPhoneVerification'
        authentication:
          $ref: '#/components/schemas/ApplicationAuthentication'
        card_design:
          $ref: '#/components/schemas/ApplicationCardDesign'
    SubmitBlockedError:
      type: object
      description: 'Returned when submission is attempted with outstanding requirements. `blocking_requirements` is the subset of the application''s requirements that is holding up submission.

        '
      required:
      - type
      - message
      - blocking_requirements
      properties:
        type:
          type: string
          example: SUBMIT_BLOCKED
        message:
          type: string
          example: 2 requirements must be satisfied before this application can be submitted
        blocking_requirements:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationRequirement'
    LegalDocumentSchema:
      type: object
      description: A published document with all configured translations, keyed by locale.
      required:
      - id
      - content
      properties:
        id:
          type: string
          example: DOC-cardholder-agreement-v1
        content:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ApplicationLegalDocumentContent'
    ApplicantInput:
      type: object
      description: 'Writable applicant fields. Only fields present in the program''s

        configuration are accepted; anything else is a `400`.

        '
      properties:
        first_name:
          type: string
          example: Jane
        last_name:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: jane@doe.com
        phone:
          type: string
          description: E.164 format. Cannot be changed once verified.
          example: '+15125550143'
        address:
          $ref: '#/components/schemas/Address'
        date_of_birth:
          $ref: '#/components/schemas/DateOfBirth'
        ssn:
          type: string
          description: 'The applicant''s full SSN, without hyphens. Write-only — never returned.

            '
          example: '123456789'
        annual_income:
          type: integer
          multipleOf: 100
          minimum: 0
          maximum: 999999900
          description: 'Gross annual income in cents (the smallest currency unit). Must be

            a whole-dollar amount (a multiple of 100) between 0 and 999999900

            ($9,999,999.00); `8500000` is $85,000.00. A value outside these

            bounds cannot be submitted.

            '
          example: 8500000
        income_type:
          type: string
          example: SALARY
        housing_cost:
          type: integer
          multipleOf: 100
          minimum: 0
          maximum: 999999900
          description: 'Monthly housing cost in cents (the smallest currency unit). Must be

            a whole-dollar amount (a multiple of 100) between 0 and 999999900

            ($9,999,999.00); `220000` is $2,200.00. A value outside these

            bounds cannot be submitted.

            '
          example: 220000
        housing_type:
          type: string
          example: RENT
        language:
          type: string
          description: IETF language tag for applicant-facing content
          example: en-US
    LocalizedMessage:
      type: object
      description: 'Applicant-facing text, keyed by IETF BCP 47 locale tag.


        A dictionary rather than a server-resolved string because the caller

        knows which locale to render and the server does not: an applicant who

        switches language mid-application would otherwise need every requirement

        refetched, and resolving server-side means resolving against a language

        preference the applicant may not have set yet.


        Callers should fall back to `en-US`, and then to any present locale — a

        missing translation should degrade to readable copy in the wrong

        language rather than to a blank where the applicant most needs to be

        told something.

        '
      additionalProperties:
        type: string
      example:
        en-US: At least 8 characters, including a letter and a number.
        es-US: Al menos 8 caracteres, incluyendo una letra y un número.
    ApplicationPhoneVerification:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          description: '`IMPRINT_OTP` — Imprint sends and verifies the code.

            `PARTNER_ATTESTED` — you may instead certify that you verified

            the phone number yourself, via the `ATTEST` action.

            '
          enum:
          - IMPRINT_OTP
          - PARTNER_ATTESTED
          example: IMPRINT_OTP
        code_length:
          type: integer
          description: 'How many digits the code has, so an input can be sized before a

            code is ever sent. Present when `mode` is `IMPRINT_OTP`.

            '
          example: 6
        resend_after_ms:
          type: integer
          description: 'How long to wait between `SEND` actions. Lets a caller disable

            its own resend control before being rejected; the `429` from the

            endpoint remains authoritative, since it accounts for a code

            sent before the current page was loaded.

            '
          example: 15000
    ApplicationAddressPatch:
      type: object
      properties:
        street_line1:
          type: string
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          x-go-type-skip-optional-pointer: true
        street_line2:
          type: string
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          x-go-type-skip-optional-pointer: true
        city:
          type: string
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          x-go-type-skip-optional-pointer: true
        state:
          type: string
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          x-go-type-skip-optional-pointer: true
        postal_code:
          type: string
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          x-go-type-skip-optional-pointer: true
        country:
          type: string
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          x-go-type-skip-optional-pointer: true
    ApplicationLegalDocumentContent:
      type: object
      required:
      - display_name
      - url
      properties:
        display_name:
          type: string
        url:
          type: string
    VerifyAccountOwnershipRequest:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: '`PASSWORD` presents the existing account password (advertised by

            `VERIFY_PASSWORD`) and requires `password`. `PIN` presents the

            existing account PIN (advertised by `VERIFY_PIN`) and requires

            `pin`. `HOSTED` is reserved for the Imprint-owned handoff, must omit

            both credentials, and currently returns `409`.

            '
          enum:
          - PASSWORD
          - PIN
          - HOSTED
          example: PASSWORD
        password:
          type: string
          description: 'The password on the applicant''s existing Imprint account. Required for `PASSWORD`; forbidden for `PIN` and `HOSTED`. Write-only.

            '
          example: correct-horse-battery-staple
        pin:
          type: string
          description: 'The PIN on the applicant''s existing Imprint account. Required for `PIN`; forbidden for `PASSWORD` and `HOSTED`. Write-only.

            '
          pattern: ^[0-9]{4,12}$
          example: '482913'
    ApplicationCardDesign:
      type: object
      description: How card-design selection behaves for this program.
      properties:
        default_card_design_id:
          type: string
          format: uuid
          nullable: true
          x-go-type: nullable.Nullable[string]
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          x-go-type-skip-optional-pointer: true
          description: 'The default card design for single-product applications, applied

            when the applicant does not choose one. When present, the

            `card_design` requirement starts satisfied and a selection is an

            override. Multi-product applications choose a design per product

            offer on accept instead.

            '
          example: 8a2f41c6-90be-4d77-b1e3-5c7092da6f84
    ApplicationFieldSchema:
      type: object
      description: 'The schema for one applicant field: how to render and validate it, and

        whether the program can ever require it.


        No label is published. What a field is *called* belongs to the surface it

        appears on — it changes with that surface and needs translating alongside

        the rest of the page. Validation is published because the program

        enforces it server-side, and a caller inventing its own would reject

        input the program accepts.

        '
      required:
      - key
      - type
      - necessity
      properties:
        key:
          type: string
          description: 'The field''s stable identifier, also used as the `key` of a

            `FIELD` requirement and as the path to set in `PATCH`.

            '
          example: applicant.email
        type:
          type: string
          description: The field's data type, which determines the JSON shape accepted by `PATCH`.
          enum:
          - string
          - email
          - phone
          - integer
          - date
          - address
          - enum
          example: email
        necessity:
          type: string
          description: '`ALWAYS_REQUIRED` — every application will require this field.

            `CONDITIONALLY_REQUIRED` — some applications will, depending on

            their state; only the application''s `requirements` can tell you.

            `OPTIONAL` — never blocks progress.


            This describes what the program *can* ask for. It never tells you

            what a given application requires right now.

            '
          enum:
          - ALWAYS_REQUIRED
          - CONDITIONALLY_REQUIRED
          - OPTIONAL
          example: ALWAYS_REQUIRED
        pattern:
          type: string
          description: A regular expression the value must match.
          example: ^\d{9}$
        min_length:
          type: integer
          example: 1
        max_length:
          type: integer
          example: 254
        allowed_values:
          type: array
          description: For `enum` fields, the permitted values.
          items:
            type: string
          example:
          - EMPLOYED
          - SELFEMPLOYED
          - OTHER
        minimum:
          type: integer
          format: int64
          description: For `integer` fields, the smallest permitted value, inclusive.
          example: 0
        maximum:
          type: integer
          format: int64
          description: For `integer` fields, the largest permitted value, inclusive.
          example: 999999900
        multiple_of:
          type: integer
          format: int64
          description: 'For `integer` fields, the value must be an exact multiple of this

            number. Currency fields use `100` to require whole dollars.

            '
          example: 100
    ApplicationDateOfBirthPatch:
      type: object
      properties:
        year:
          type: integer
          nullable: true
          x-go-type: nullable.Nullable[int]
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          x-go-type-skip-optional-pointer: true
        month:
          type: integer
          nullable: true
          x-go-type: nullable.Nullable[int]
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
