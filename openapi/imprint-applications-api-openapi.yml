    RateLimitedError:
      type: object
      description: 'An action was requested again too soon. `retry_after_seconds` rounds up — truncating would report `0` with time still on the clock and send the caller straight into another rejection. The same value is on the `Retry-After` header; it is in the body as well so a client that already parses the JSON error can render a countdown without reaching for response headers.

        '
      required:
      - type
      - message
      - retry_after_seconds
      properties:
        type:
          type: string
          example: RESEND_TOO_SOON
        message:
          type: string
          example: A verification code was already sent; retry in 9 seconds
        retry_after_seconds:
          type: integer
          example: 9
    RequirementResolutionOption:
      type: object
      description: One way to satisfy a requirement.
      required:
      - type
      properties:
        type:
          type: string
          description: 'Identifies the route to take. These name *routes*, and are a

            different vocabulary from the credential `type` the routes accept —

            do not pass one of these values through as a request field:


            | This option | Call | With `type` |

            |---|---|---|

            | `VERIFY_PASSWORD` | `POST .../verify_account_ownership` | `PASSWORD` |

            | `VERIFY_PIN` | `POST .../verify_account_ownership` | `PIN` |

            | `HOSTED_AUTHENTICATION` | `POST .../verify_account_ownership` | `HOSTED` |

            | `SET_PASSWORD` | `POST .../authentication` | `PASSWORD` |

            | `IDV` | `POST .../idv` | — |


            `HOSTED_AUTHENTICATION` is reserved and not advertised today.

            `UNFREEZE_CREDIT` has no endpoint: the applicant must lift the

            freeze with the bureau, then the application can be resubmitted.

            '
          enum:
          - VERIFY_PASSWORD
          - VERIFY_PIN
          - HOSTED_AUTHENTICATION
          - SET_PASSWORD
          - IDV
          - UNFREEZE_CREDIT
          example: VERIFY_PASSWORD
        message:
          allOf:
          - $ref: '#/components/schemas/LocalizedMessage'
          description: Applicant-facing detail about this option.
          example:
            en-US: Verify the password on the existing Imprint account
            es-US: Verifique la contraseña de su cuenta Imprint existente
    Application:
      type: object
      description: 'An application in progress or complete. `requirements` is the driver:

        it tells you what to collect next and what is blocking each milestone.

        '
      required:
      - id
      - configuration_revision
      - status
      - requirements
      - created_at
      - updated_at
      properties:
        id:
          type: string
