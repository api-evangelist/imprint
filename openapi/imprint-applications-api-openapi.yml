    CreateIdvRequest:
      type: object
      properties:
        redirect_url:
          type: string
          description: 'Where to send the applicant when identity verification completes or fails. Must be on your program''s redirect allowlist, which Imprint configures with its verification provider; ask Imprint to add a URL before using it. A URL that is not allowlisted is rejected with `400`. Omit it to leave the applicant on the verification page when they finish. Query parameters added to this URL on arrival are not a decision: read the outcome from the application or its webhook.

            '
          example: https://partner.example.com/apply/idv-complete
    ApplicationStatus:
      type: string
      description: 'The application''s lifecycle status. The application webhook reports

        this same status: Imprint computes it from the application''s current

        decisioning state on every read, and sends the webhook only after that

        state changes, so a `GET /v2/applications/{application_id}` made after

        a webhook returns that webhook''s `status` or a later one, never an

        earlier one.


        Branch on `status`, not on

        `product_offers[].result`, when choosing what to render: in a

        multi-product application some products can be `REJECTED` while the

        application is `OFFERS_AVAILABLE`.


        `IDV_REQUIRED`, `FROZEN`, and `PENDING_REVIEW` are application statuses,

        not product offer results; `product_offers` is empty while the

        application is in one of them. `IDV_REQUIRED` means the applicant must

        complete IDV; `FROZEN` means the applicant must lift the credit freeze

        with the bureau before the application is resubmitted.


        `EVALUATING` means Imprint is decisioning the application. It normally

        lasts seconds but can occasionally persist longer while Imprint

        completes a delayed evaluation; no action is required and the

        application cannot be submitted again from this status.


        `OFFER_ACCEPTED` means acceptance is durably committed and provisioning

        is still running. `PENDING_AUTHENTICATION` means the account exists but

        required authentication is outstanding. `COMPLETED` requires both.

        `ACCOUNT_FUNDED` is shared webhook vocabulary for funding products; the

        first Application API release has no secured funding operation and does

        not originate it.

        '
      enum:
      - IN_PROGRESS
      - EVALUATING
      - IDV_REQUIRED
      - PENDING_REVIEW
      - FROZEN
      - OFFERS_AVAILABLE
      - REJECTED
      - OFFER_ACCEPTED
      - ACCOUNT_FUNDED
      - PENDING_AUTHENTICATION
      - COMPLETED
      - EXPIRED
      example: IN_PROGRESS
    PasswordPolicy:
      type: object
      description: 'The password rule this program enforces, published so a caller can

        validate before submitting rather than inventing its own rule and

        rejecting input the program would have accepted.


        This is the inline-checkable subset of the Imprint default password

        policy: 10 to 128 Unicode code points with at least one uppercase

        letter, one lowercase letter and one digit. The server additionally

        rejects four-character sequential or repeated runs, common passwords,

        and passwords containing the applicant''s email name, phone digits or

        date of birth; none of those can be expressed here, so a password that

        satisfies this object can still be rejected with

        `PASSWORD_POLICY_VIOLATION`. See the Password policy section of the

        Application APIs guide for the full table.


        The vocabulary is deliberately the same as `ApplicationFieldSchema`''s —

        `pattern`, `min_length`, `max_length` — rather than a second one for the

        same job.

        '
      properties:
        min_length:
          type: integer
          example: 10
        max_length:
          type: integer
          description: 'Real policy rather than an oversight: hashing unbounded input is a

            cheap denial of service, so the bound is published rather than

            discovered.

            '
          example: 128
        pattern:
          type: string
          description: 'A regular expression the password must match.


            This pattern must compile in every engine that reads it, which rules

            out the two constructs most likely to be reached for first:

            lookahead (`(?=...)`) is unsupported by Go''s RE2, and the `(?s)`

            flag is a syntax error in JavaScript. The portable form of "an

            uppercase letter, a lowercase letter and a digit, in any order" is an

            alternation over the six orderings, as in the example.


            Unicode classes are used rather than ASCII ranges because programs

            publish non-English copy, and `[A-Za-z]` would reject a valid

            password such as `contraseña1` for containing no letters. Callers

            compiling this in a browser must pass the `u` flag: without it

            JavaScript reads `\p{L}` as a literal `p` instead of failing, and

            silently enforces a rule the program never published.


            A caller that cannot compile the pattern should treat the password as

            acceptable and let the server reject it. The program enforces the

            rule regardless, and a form that can never be submitted is worse

            than a rejection that explains itself.

            '
          example: ^(?:[\s\S]*\p{Lu}[\s\S]*\p{Ll}[\s\S]*\p{Nd}|[\s\S]*\p{Lu}[\s\S]*\p{Nd}[\s\S]*\p{Ll}|[\s\S]*\p{Ll}[\s\S]*\p{Lu}[\s\S]*\p{Nd}|[\s\S]*\p{Ll}[\s\S]*\p{Nd}[\s\S]*\p{Lu}|[\s\S]*\p{Nd}[\s\S]*\p{Lu}[\s\S]*\p{Ll}|[\s\S]*\p{Nd}[\s\S]*\p{Ll}[\s\S]*\p{Lu})[\s\S]*$
    ProductOffer:
      type: object
      description: 'One product''s decision and, when approved, its offer.


        `credit_limit`, `apr_percentage`, `expires_at`, and

        `cardholder_agreement_url` are present only on an `OFFER_READY`,

        `ACCEPTED`, `ACCEPTED_PENDING_ACTION`, or `COMPLETED` entry.

        `card_design_id` is present once the entry is accepted. A `REJECTED`

        entry carries its reasons and, when required, an adverse action

        notice.

        '
      required:
      - id
      - product_id
      - result
      properties:
        id:
          type: string
          format: uuid
          description: The id to pass as `product_offer_id` when accepting.
          example: 6db3f865-e2ea-4cf0-a77d-4330a1b2c3d4
        product_id:
          type: string
          description: The product this decision is for
          example: daff06e9-143f-4318-81db-42d47e9bb388
        result:
          $ref: '#/components/schemas/ProductOfferResult'
        reason_code:
          type: string
          description: 'The primary machine-readable reason. This vocabulary only ever

            grows — codes are never repurposed — so treat an unrecognised code

            as an unhandled default rather than an error.

            '
          example: INSUFFICIENT_CREDIT_HISTORY
        reasons:
          type: array
          description: All contributing reasons, most significant first.
          items:
            type: object
            required:
            - code
            properties:
              code:
                type: string
                example: INSUFFICIENT_CREDIT_HISTORY
              message:
                allOf:
                - $ref: '#/components/schemas/LocalizedMessage'
                description: 'Applicant-facing explanation of this reason, safe to display.

                  '
                example:
                  en-US: Not enough credit history
                  es-US: Historial de crédito insuficiente
        adverse_action_notice_url:
          type: string
          description: 'Where the adverse action notice can be retrieved, when one is required for this decision.

            '
          example: https://disclosures.imprint.co/aan/7f3c1e20-4b8a-4e11-9c6d-2a5f0b7d3e91.pdf
        cardholder_agreement_url:
          type: string
          description: 'Where this product offer''s cardholder agreement can be retrieved. It is generated for this product with this product offer''s terms, so each acceptable entry has its own. Present on an `OFFER_READY`, `ACCEPTED`, `ACCEPTED_PENDING_ACTION`, or `COMPLETED` entry once the agreement has been generated. Presigned and short-lived: do not cache, log, or persist it.

            '
          example: https://disclosures.imprint.co/cardholder-agreement/APLN-v1-650E5076-F94C-4E6C-9583-9DED76DB3F86/agreement.pdf
        card_design_id:
          type: string
          format: uuid
          description: 'The card design committed for this product when the product offer was accepted, and the design used for issuance. Absent until the entry is accepted, or when no design was selected.

            '
          example: 3b9c1f3e-52a0-44c1-b131-a7ab0099a214
        credit_limit:
          $ref: '#/components/schemas/CurrencyAmount'
        apr_percentage:
          type: number
          description: The purchase APR as a percentage
          example: 24.99
        expires_at:
          type: string
          description: The RFC-3339 timestamp after which this offer can no longer be accepted
          example: '2026-08-20T12:00:04Z'
    ApplicationRequirement:
      type: object
      description: 'One thing the application needs. `kind` says what sort of thing it is,

        `status` whether it is done, and `blocks` which milestone it holds up.


        Modelling fields, disclosures, and actions in one list means a new

        requirement is an added array entry rather than a new response field —

        so handle unknown `kind` and `key` values by ignoring them rather than

        failing.

        '
      required:
      - key
      - kind
      - status
      properties:
        key:
          type: string
          description: 'Stable identifier. For `FIELD` requirements this matches a `key` in

            the application configuration''s `fields`.

            '
          example: applicant.address
        kind:
          type: string
          description: '`FIELD` — applicant data, set via `PATCH`.

            `DISCLOSURE` — consent recorded via `PATCH`.

            `SELECTION` — a choice among options, such as a card design.

            `ACTION` — something with a side effect, satisfied by its own

            `POST` endpoint.

            '
          enum:
          - FIELD
          - DISCLOSURE
          - SELECTION
          - ACTION
          example: FIELD
        status:
          type: string
          description: '`MISSING` — not yet provided.

            `PENDING` — provided or started, awaiting completion elsewhere

            (an OTP sent but unverified, an IDV session in progress).

            `SATISFIED` — done.

            `INVALID` — provided but rejected; `message` explains why.

            '
          enum:
          - MISSING
          - PENDING
          - SATISFIED
          - INVALID
          example: MISSING
        blocks:
          type: string
          nullable: true
          description: 'The milestone this requirement holds up, or `null` if it blocks

            nothing.


            `blocks` names the *earliest* milestone gated, not the only one, so

            the milestones nest: `PHONE_VERIFICATION` requirements block

            submission as well, because nothing can be submitted before the

            phone is verified. To find what is holding up submit, take every

            unsatisfied requirement whose `blocks` is `PHONE_VERIFICATION` or

            `SUBMIT` — which is what `SUBMIT_BLOCKED`''s `blocking_requirements`

            reports. `OFFER_ACCEPTANCE` and `COMPLETION` requirements do not

            block submission: `authentication` can be satisfied after an offer is

            accepted.

            '
          enum:
          - PHONE_VERIFICATION
          - SUBMIT
          - OFFER_ACCEPTANCE
          - COMPLETION
          example: SUBMIT
        message:
          allOf:
          - $ref: '#/components/schemas/LocalizedMessage'
          description: 'Why the value was rejected, present when `status` is `INVALID`. Applicant-facing and safe to display.

            '
          example:
            en-US: Address could not be verified
            es-US: No se pudo verificar la dirección
        disclosure:
          $ref: '#/components/schemas/DisclosureSchema'
        resolution_options:
          type: array
          description: 'For an unsatisfied `ACTION`, the route or routes by which it can be

            resolved. Present whenever the caller must choose a dedicated

            resolution route, even if only one is currently available.

            '
          items:
            $ref: '#/components/schemas/RequirementResolutionOption'
